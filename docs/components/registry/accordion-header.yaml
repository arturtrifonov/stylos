id: "Accordion Header"
name: "Accordion Header"
level: "object"
role: "trigger"
flow_behavior:
  - "fill"
children:
  - "Badge"
  - "Button Inner"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Tag"
  - "Toggle Input"
  - "Toggle Label"
  - "Toggle Text"
  - "Avatar"
  - "Loader"
parents:
  - "Accordion"
notes: "Reviewed with Accordion and approved ready by the owner on 2026-10-24. Native availability and disclosure state remain independent of decorative icon presence. Implementation evidence: [Accordion review](../../../packages/ui/verification/accordion-2026-10-24.md)."
import:
  batch: 1
  ready: true
status: "ready"
html: "<button type=\"button\">Section title</button>"
summary: "The native disclosure button for an Accordion."
purpose: "Expose a section title and whether its content is expanded."
use_when:
  - "A collapsible section needs a titled button that exposes its expanded state."
do_not_use_when:
  -
    text: "A complete collapsible section should own its heading, body and disclosure relationship."
    instead: "Accordion"
api:
  -
    name: "size"
    kind: "variant"
    description: "The five current Figma density presets; the consumer owns available width."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    description: "Native availability; hover, active and focus are browser states."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is expanded"
    kind: "boolean"
    description: "Bindable disclosure state; reflected in aria-expanded."
    default: false
  -
    name: "expand icon position"
    kind: "variant"
    description: "Position of the expand/collapse icon."
    default: "leading"
    values:
      -
        value: "leading"
      -
        value: "trailing"
  -
    name: "expand icon"
    kind: "variant"
    description: "The paired expand/collapse marks, independent of their leading or trailing position."
    default: "chevron"
    values:
      -
        value: "chevron"
        note: "Expand More / Expand Less."
      -
        value: "plus"
        note: "Add / Dash."
      -
        value: "dropdown"
        note: "Drop Down / Drop Up."
  -
    name: "label text"
    kind: "text"
    description: "Visible accessible disclosure name."
    default: "Accordion title"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show the configured decorative icon."
    default: false
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured decorative mark beside the title."
    svelte_type: "snippet"
  -
    name: "id"
    kind: "string"
    description: "Disclosure button ID."
  -
    name: "controls"
    kind: "string"
    description: "ID of the controlled body region."
  -
    name: "onclick"
    kind: "event"
    description: "Native activation, after the bound expansion state changes."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Five native button heights with the verified larger Accordion title ramp."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_000"
      gap: "gap/g-0_500"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "small"
      box: "size/s-4_000"
      padding_x: "gap/g-1_250"
      gap: "gap/g-0_625"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_x: "gap/g-1_500"
      gap: "gap/g-0_750"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
    -
      size: "large"
      box: "size/s-6_000"
      padding_x: "gap/g-2_000"
      gap: "gap/g-0_875"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_x: "gap/g-2_500"
      gap: "gap/g-1_000"
      font_size: "size/1_875"
      line_height: "line height/string/1_875"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4381:718"
  last_verified: "2026-10-24"
limitations:
  - "A standalone Header does not create or hide a content panel. Its owner supplies the controlled panel and keeps its visibility in sync, or uses Accordion for the complete section."
figma_notes:
  - "expand icon selects one of the three existing instance-swap pairs: Expand More / Expand Less, Add / Dash or Drop Down / Drop Up."
  - "Figma is focused toggles the shared Focus instance for documentation and composition. Web focus follows native :focus-visible; it is not a component prop."
