id: "Tab Item"
name: "Tab Item"
level: "object"
role: "trigger"
flow_behavior:
  - "fill"
children:
  - "Badge"
  - "Icon"
parents:
  - "Tabs Horizontal"
  - "Tabs Vertical"
notes: "Owner approved as ready on 2026-10-26 after alignment with the finished Figma set: one button per tab without slot wrappers, state surfaces for both selection states, icon overhang and a Badge that follows size and state. Scoped evidence: packages/ui/verification/tabs-2026-10-26.md."
import:
  batch: 1
  ready: true
status: "ready"
html: "<button role=\"tab\">Tab name</button>"
summary: "One horizontal tab with an associated panel."
purpose: "Expose a named peer view and its selected state inside Tabs Horizontal."
use_when:
  - "One horizontal tab with an associated panel."
do_not_use_when:
  -
    text: "An individual tab has no containing tab list or associated panel."
    instead: "Tabs Horizontal"
  -
    text: "The tab shows only an icon."
    instead: "Tab Item Icon"
api:
  -
    name: "size"
    kind: "variant"
    description: "The five current Figma density presets; the consumer owns available width."
    default: "medium"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    description: "Native button availability."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "value"
    kind: "string"
    description: "Unique selection value."
    default: "tab"
  -
    name: "label text"
    kind: "text"
    description: "Visible tab name."
    default: "Tab item"
  -
    name: "id"
    kind: "string"
    description: "Tab button ID used by the panel aria-labelledby."
  -
    name: "controls"
    kind: "string"
    description: "Associated panel ID."
  -
    name: "has badge"
    kind: "boolean"
    description: "Show the configured count in a Badge that follows the tab size and selection."
    default: false
    controls:
      - "number text"
  -
    name: "number text"
    kind: "text"
    description: "Badge count; include its meaning in the surrounding context."
    default: "1"
  -
    name: "has leading icon"
    kind: "boolean"
    description: "Show the configured leading mark."
    default: false
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    description: "Decorative Icon snippet rendered directly before the label text, without a wrapper. Also shown beside the label in the overflow menu."
    svelte_type: "snippet"
  -
    name: "has trailing icon"
    kind: "boolean"
    description: "Show the configured trailing mark."
    default: false
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    description: "Decorative Icon snippet rendered directly after the label and badge, without a wrapper."
    svelte_type: "snippet"
sizing_model:
  horizontal: "hug"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Inherits the group size. The tab is its label box, 24/32/40/48/56 units high; Tabs Horizontal adds the band below it. Icons occupy 16/20/24/28/32 units with a 2/2/2/3/3-unit optical overhang; the Badge uses the same size name."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_000"
      gap: "gap/g-0_500"
      icon: "size/s-2_000"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
    -
      size: "small"
      box: "size/s-4_000"
      padding_x: "gap/g-1_250"
      gap: "gap/g-0_625"
      icon: "size/s-2_500"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_x: "gap/g-1_500"
      gap: "gap/g-0_750"
      icon: "size/s-3_000"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
    -
      size: "large"
      box: "size/s-6_000"
      padding_x: "gap/g-2_000"
      gap: "gap/g-0_875"
      icon: "size/s-3_500"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_x: "gap/g-2_500"
      gap: "gap/g-1_000"
      icon: "size/s-4_000"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4451:16154"
  last_verified: "2026-10-26"
limitations:
  - "Whole-release Chrome/Orca, contrast and two-theme accessibility acceptance remain in packages/ui/verification/0.3.0.md; this component review does not close those gates."
  - "Migration: Medium replaces extra small as the default size (owner decision, 2026-10-26)."
  - "Use inside Tabs Horizontal, which draws the band, the selection indicator and keyboard focus; an icon-only tab is Tab Item Icon. Vertical tabs are outside this slice."
  - "Each icon snippet should render one Icon. The tab sets its footprint and gives up padding for the optical overhang; it does not wrap or hide arbitrary content."
figma_notes:
  - "Figma hover and active are drawing states; the web derives them from the browser. Figma is focused on the item is exploratory and not implemented; Tabs Horizontal draws focus."
  - "Figma draws each icon in a container narrower than the icon by the optical overhang (2/2/2/3/3 units). The web keeps the full Icon footprint and reduces the padding on that side instead."
  - "The Badge follows the tab size and takes the primary tone when selected, base when not and disabled when the tab is disabled."
