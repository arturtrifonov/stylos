# Contract written 2026-08-27 from the live component set. The parents list and
# the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Badge"
name: "Badge"
level: "primitive"
role: "content"
status: "draft"
version: "0.1"
summary: "A compact numeric counter attached to another element."
purpose: "A count has to sit on the thing it counts — the tab, the menu item, the filter — and it must not introduce a second colour language while doing so. Badge is built as a visual extension of text rather than as a control: its surface takes the text colour roles, so it reads as part of the parent's typography instead of as an object stuck onto it, and it picks up whatever tone the surrounding text already carries."
use_when:
  - "A small number supports the meaning of a parent element — a navigation item, tab, button, menu item, list row, filter, or notification entry point."
do_not_use_when:
  -
    text: "The content is a word rather than a number — a label, category, or piece of descriptive metadata."
    instead: "Tag"
  -
    text: "The thing being shown is a status with no count, such as an online dot or a state marker."
    instead: "Indicator"
  -
    text: "The element is meant to be selected, removed or acted on. Badge is not interactive and has no state property."
    instead: "Chips"
parents:
  - "Accordion / Container"
  - "Accordion / Header"
  - "Avatar"
  - "Checkbox"
  - "Chips"
  - "Link"
  - "Radio"
