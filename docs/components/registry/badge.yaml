# Contract written 2026-08-27 from the live component set. The parents list and
# the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Badge"
name: "Badge"
level: "primitive"
role: "content"
html: "no semantic html"
status: "draft"
version: "0.1"
summary: "A compact numeric counter that takes its meaning from what it sits with."
purpose: "A count is never about itself: \"3\" means nothing until something nearby says three of what. Badge exists so a number can be placed where that subject is already stated, without introducing a second colour language to do it. It is drawn as a visual extension of text rather than as an object of its own — its surface takes the text colour roles, so it continues the typography around it instead of sitting on top of it."
use_when:
  - "A number belongs to something whose meaning is already established where the badge appears — a navigation item, tab, button, menu item, list row, filter, notification entry point, or a heading it sits beside. Being nested inside that component is not required; sharing its context is."
do_not_use_when:
  -
    text: "Nothing around the badge says what is being counted. The number is not required to have a parent component, but it is required to have a subject, and the surroundings are the only place it can come from."
    instead: null
  -
    text: "The content is a word rather than a number — a label, category, or piece of descriptive metadata."
    instead: "Tag"
  -
    text: "The thing being shown is a status with no count, such as an online dot or a state marker."
    instead: "Indicator Status"
  -
    text: "The element is meant to be selected, removed or acted on. Badge is not interactive and has no state property."
    instead: "Chips"
parents:
