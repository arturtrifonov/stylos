id: "Alert Inline"
name: "Alert Inline"
level: "widget"
role: "output"
flow_behavior:
  - "fill"
children:
  - "Avatar"
  - "Badge"
  - "Button"
  - "Button Inner"
  - "Button Dropdown"
  - "Button Group"
  - "Button Icon"
  - "Checkbox Input"
  - "Checkbox Label"
  - "Checkbox Text"
  - "Code Snippet"
  - "Icon"
  - "Image"
  - "Indicator Status"
  - "Indicator Special"
  - "Input Text"
  - "Input Date"
  - "Input Search"
  - "Input Number"
  - "Input Color"
  - "Input Datetime"
  - "Input Email"
  - "Input Password"
  - "Input Time"
  - "Input Telephone"
  - "Input URL"
  - "Link"
  - "List"
  - "Multiselect"
  - "Person"
  - "Tag"
  - "Text Area"
  - "Loader"
  - "Tree"
  - "Toggle Input"
  - "Toggle Label"
  - "Toggle Text"
  - "Radio Input"
  - "Radio Label"
  - "Radio Text"
  - "Slider"
  - "Select"
  - "Scrollbar"
  - "Progress Bar"
parents:
  - "Accordion"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
notes: "Owner-directed starting-set expansion, 2026-10-17. Current Figma reference inspected; this is not a Ready to publish assessment."
import:
  batch: 1
  ready: true
status: "draft"
html: "<section>Notification and actions</section>"
summary: "A notification in document flow."
purpose: "Give product notifications a shared visual and interaction contract while their designs remain provisional."
use_when:
  - "A notification in document flow."
do_not_use_when:
  -
    text: "The message must float over the page rather than participate in document flow."
    instead: "Alert Popup"
api:
  -
    name: "type"
    kind: "variant"
    description: "Semantic notification type. Legacy Figma Info maps to default and Error maps to danger."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "warning"
      -
        value: "danger"
      -
        value: "success"
  -
    name: "is open"
    kind: "boolean"
    description: "Bindable presence. Closing hides this notification and does not steal focus."
    default: true
  -
    name: "has heading"
    kind: "boolean"
    description: "Show the heading."
    default: true
    controls:
      - "heading text"
  -
    name: "heading text"
    kind: "text"
    description: "Notification heading."
    default: "Heading Text"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show the consumer-configured decorative icon."
    default: true
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured semantic mark; an unconfigured Figma placeholder is not a product icon."
    svelte_type: "snippet"
  -
    name: "has content"
    kind: "boolean"
    description: "Show the content slot."
    default: true
    controls:
      - "content slot"
  -
    name: "content slot"
    kind: "slot"
    description: "Notification details; no product-specific fallback copy is inserted."
  -
    name: "has buttons"
    kind: "boolean"
    description: "Show primary and secondary actions."
    default: true
    controls:
      - "primary button text"
      - "secondary button text"
  -
    name: "primary button text"
    kind: "text"
    description: "Primary action label; the consumer owns its effect."
    default: "Accept"
  -
    name: "secondary button text"
    kind: "text"
    description: "Secondary action label; the consumer owns its effect."
    default: "Cancel"
  -
    name: "has close button"
    kind: "boolean"
    description: "Show the native dismiss action."
    default: false
    controls:
      - "close accessible name"
  -
    name: "close accessible name"
    kind: "text"
    description: "Accessible name of the icon-only dismiss action."
    default: "Close"
  -
    name: "announcement"
    kind: "variant"
    description: "Consumer selects urgency independently of visual type; initial static content may need an enclosing live region."
    default: "polite"
    values:
      -
        value: "polite"
      -
        value: "assertive"
      -
        value: "off"
  -
    name: "onprimaryclick"
    kind: "event"
    description: "Native primary action click."
  -
    name: "onsecondaryclick"
    kind: "event"
    description: "Native secondary action click."
  -
    name: "onclose"
    kind: "event"
    description: "Close event after the bound is open becomes false."
  -
    name: "has undo button"
    kind: "boolean"
    description: "Show a consumer-owned Undo action."
    default: false
    controls:
      - "undo button text"
  -
    name: "undo button text"
    kind: "text"
    description: "Label for the undo action."
    default: "Undo"
  -
    name: "onundoclick"
    kind: "event"
    description: "Native click; restoring product state belongs to the consumer."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Current Figma composition; Inline and Timer have one authored density, Popup has five. Width follows the host. Floating placement, stacking and lifetime belong to the consumer."
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4462:2882"
  last_verified: "2026-10-17"
limitations:
  - "Provisional product integration: status stays draft even when code exists. API, design alignment and accessibility require subsequent review."
  - "Popup is a notification surface, not a modal dialog; it neither traps focus nor implements an overlay queue."
  - "Inline and Timer retain legacy Figma geometry. Existing Stylos Buttons and fonts replace their obsolete nested button/font definitions."
family: "Alert"
figma_notes:
  - "Figma title-case Show properties become canonical has properties. Info/Error map to default/danger. Unconfigured Icon placeholders are supplied by the consumer, never traced or substituted. Current geometry is a reference, not a claim that old Figma token aliases are approved."
