id: "Alert Inline"
name: "Alert Inline"
level: "widget"
role: "output"
flow_behavior:
  - "fill"
children:
  - "Avatar"
  - "Badge"
  - "Button"
  - "Button Inner"
  - "Button Dropdown"
  - "Button Group"
  - "Button Icon"
  - "Checkbox Input"
  - "Checkbox Label"
  - "Checkbox Text"
  - "Code Snippet"
  - "Icon"
  - "Image"
  - "Indicator Status"
  - "Indicator Special"
  - "Input Text"
  - "Input Date"
  - "Input Search"
  - "Input Number"
  - "Input Color"
  - "Input Datetime"
  - "Input Email"
  - "Input Password"
  - "Input Time"
  - "Input Telephone"
  - "Input URL"
  - "Link"
  - "List"
  - "Multiselect"
  - "Person"
  - "Tag"
  - "Text Area"
  - "Loader"
  - "Tree"
  - "Toggle Input"
  - "Toggle Label"
  - "Toggle Text"
  - "Radio Input"
  - "Radio Label"
  - "Radio Text"
  - "Slider"
  - "Select"
  - "Scrollbar"
  - "Progress Bar"
parents:
  - "Accordion"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
notes: "Owner-directed starting-set expansion, 2026-10-17. Inline was aligned with all five reviewed Popup size profiles on 2026-10-25. This is not a Ready to publish assessment."
import:
  batch: 1
  ready: true
status: "draft"
html: "<section>Notification and actions</section>"
summary: "A notification in document flow."
purpose: "Give product notifications a shared visual and interaction contract while their designs remain provisional."
use_when:
  - "A notification in document flow."
do_not_use_when:
  -
    text: "The message must float over the page rather than participate in document flow."
    instead: "Alert Popup"
api:
  -
    name: "size"
    kind: "variant"
    description: "The same five density presets as Alert Popup; typography, spacing, icons and all buttons follow the selected size. Width follows the host."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "type"
    kind: "variant"
    description: "Semantic notification type; the heading, mark and border use matching color roles."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "warning"
      -
        value: "danger"
      -
        value: "success"
  -
    name: "is open"
    kind: "boolean"
    description: "Bindable presence. Closing hides this notification and does not steal focus."
    default: true
  -
    name: "has heading"
    kind: "boolean"
    description: "Show the heading."
    default: true
    controls:
      - "heading text"
  -
    name: "heading text"
    kind: "text"
    description: "Notification heading."
    default: "Heading Text"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show the consumer-configured decorative icon."
    default: true
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured semantic mark; an unconfigured Figma placeholder is not a product icon."
    svelte_type: "snippet"
  -
    name: "has content"
    kind: "boolean"
    description: "Show the content slot."
    default: true
    controls:
      - "content slot"
  -
    name: "content slot"
    kind: "slot"
    description: "Notification details; no product-specific fallback copy is inserted."
  -
    name: "has buttons"
    kind: "boolean"
    description: "Show primary and secondary actions."
    default: true
    controls:
      - "primary button text"
      - "secondary button text"
  -
    name: "primary button text"
    kind: "text"
    description: "Primary action label; the consumer owns its effect."
    default: "Accept"
  -
    name: "secondary button text"
    kind: "text"
    description: "Secondary action label; the consumer owns its effect."
    default: "Cancel"
  -
    name: "has close button"
    kind: "boolean"
    description: "Show the native dismiss action."
    default: false
    controls:
      - "close accessible name"
  -
    name: "close accessible name"
    kind: "text"
    description: "Accessible name of the icon-only dismiss action."
    default: "Close"
  -
    name: "announcement"
    kind: "variant"
    description: "Consumer selects urgency independently of visual type; initial static content may need an enclosing live region."
    default: "polite"
    values:
      -
        value: "polite"
      -
        value: "assertive"
      -
        value: "off"
  -
    name: "onprimaryclick"
    kind: "event"
    description: "Native primary action click."
  -
    name: "onsecondaryclick"
    kind: "event"
    description: "Native secondary action click."
  -
    name: "onclose"
    kind: "event"
    description: "Close event after the bound is open becomes false."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Five density presets matching Alert Popup. Width follows the host and height hugs the content. Each row records the icon footprint and heading typography; body text uses text/base at the matching size. Icon and close slots match the heading first-line height. Primary and secondary buttons follow size. The surface uses background/base, border/default (or the semantic border for its type) and shadow/elevation 1."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_500"
      padding_x: "gap/g-1_500"
      padding_y: "gap/g-1_500"
      gap: "gap/g-1_000"
      font_size: "size/1_125"
      line_height: "line height/heading/1_125"
    -
      size: "small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_750"
      padding_y: "gap/g-1_750"
      gap: "gap/g-1_000"
      font_size: "size/1_250"
      line_height: "line height/heading/1_250"
    -
      size: "medium"
      box: "size/s-3_500"
      padding_x: "gap/g-2_000"
      padding_y: "gap/g-2_000"
      gap: "gap/g-1_250"
      font_size: "size/1_500"
      line_height: "line height/heading/1_500"
    -
      size: "large"
      box: "size/s-4_000"
      padding_x: "gap/g-2_500"
      padding_y: "gap/g-2_500"
      gap: "gap/g-1_250"
      font_size: "size/1_750"
      line_height: "line height/heading/1_750"
    -
      size: "extra large"
      box: "size/s-4_500"
      padding_x: "gap/g-3_000"
      padding_y: "gap/g-3_000"
      gap: "gap/g-1_500"
      font_size: "size/2_000"
      line_height: "line height/heading/2_000"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4462:2882"
  last_verified: "2026-10-25"
limitations:
  - "Provisional product integration: status stays draft even when code exists. API, design alignment and accessibility require subsequent review."
  - "Manual Chrome/Orca evaluation and contrast review remain pending."
family: "Alert"
figma_notes:
  - "The current set uses canonical has properties and default/warning/danger/success types. It shares all five Popup typography and spacing profiles, with current Button instances and the same semantic marks. Icon and close containers bind to the heading line-height variable. The product supplies the default icon; a library placeholder is not a product mark."
  - "The 2026-10-25 appearance update uses background/base, default or semantic border, and shadow/elevation 1. Workshop icons use the shared Material Symbols Rounded preset (FND-ICONS-05); their drawings differ from the legacy outline marks in Figma."
