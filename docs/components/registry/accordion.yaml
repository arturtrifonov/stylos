notes: "Initial integration: 2026-10-17. Content disclosure is immediate through native hidden; no height, opacity, padding or gap animation runs on load or expansion. The mounted body becomes inert and aria-hidden on collapse. Implementation review, fixes and remaining checks: [Accordion review](../../../packages/ui/verification/accordion-2026-10-24.md)."
import:
  batch: 1
  ready: true
status: "ready"
html: "<section><h3><button>Section title</button></h3><div>Content</div></section>"
summary: "A titled section that can reveal or hide its content."
purpose: "Keep related product content in one section without making the product invent its own disclosure."
use_when:
  - "Related content can be collapsed under a clear section title to keep a page easier to scan."
  - "A list of independently expandable sections needs consistent disclosure, headings and shared dividers."
do_not_use_when:
  -
    text: "The section must always remain visible. Do not conceal essential instructions in a disclosure."
    instead: null
api:
  -
    name: "size"
    kind: "variant"
    description: "The five current Figma density presets; the consumer owns available width."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    description: "Availability of the disclosure button."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is expanded"
    kind: "boolean"
    description: "Bindable state. A collapsed body remains mounted and hidden from interaction."
    default: false
  -
    name: "expand icon position"
    kind: "variant"
    description: "Position of the expand/collapse icon; Accordion Figma composition uses trailing."
    default: "trailing"
    values:
      -
        value: "leading"
      -
        value: "trailing"
  -
    name: "expand icon"
    kind: "variant"
    description: "The paired expand/collapse marks. The mark changes with the expanded state independently of its leading or trailing position."
    default: "chevron"
    values:
      -
        value: "chevron"
        note: "Expand More / Expand Less."
      -
        value: "plus"
        note: "Add / Dash."
      -
        value: "dropdown"
        note: "Drop Down / Drop Up."
  -
    name: "heading level"
    kind: "variant"
    description: "The section title's heading level, chosen to fit the surrounding page hierarchy. This is a semantic choice and does not change the title's visual size."
    default: "3"
    values:
      -
        value: "1"
      -
        value: "2"
      -
        value: "3"
      -
        value: "4"
      -
        value: "5"
      -
        value: "6"
  -
    name: "label text"
    kind: "text"
    description: "Forwarded to Accordion Header."
    default: "Accordion title"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show a configured decorative title icon."
    default: false
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured decorative title icon."
    svelte_type: "snippet"
  -
    name: "content slot"
    kind: "slot"
    description: "Section content; may contain existing Stylos components."
  -
    name: "id"
    kind: "string"
    description: "Base ID for unique header and body associations."
  -
    name: "onchange"
    kind: "event"
    description: "Native activation event after expansion changes."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Fill available width; the inside border is included in the constant outer vertical inset. Size controls the header height and the gap before the content. The recorded horizontal padding applies to header and body; vertical padding rows describe the body. Medium retains the current Figma body's distinct vertical-padding token."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_000"
      padding_y: "gap/g-0_500"
      gap: "gap/g-0_500"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "small"
      box: "size/s-4_000"
      padding_x: "gap/g-1_250"
      padding_y: "gap/g-0_625"
      gap: "gap/g-0_625"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_x: "gap/g-1_500"
      padding_y: "gap/g-0_625"
      gap: "gap/g-0_750"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
    -
      size: "large"
      box: "size/s-6_000"
      padding_x: "gap/g-2_000"
      padding_y: "gap/g-0_875"
      gap: "gap/g-0_875"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_x: "gap/g-2_500"
      padding_y: "gap/g-1_000"
      gap: "gap/g-1_000"
      font_size: "size/1_875"
      line_height: "line height/string/1_875"
a11y:
  -
    status: "requires"
    note: "Supply a meaningful section title and content, and choose a heading level that fits the page hierarchy. Manual Chrome/Orca evaluation and contrast review remain pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4384:1292"
  last_verified: "2026-10-24"
limitations:
  - "Each Accordion owns its expansion independently. Exclusive groups and animated disclosure are not included."
  - "Consecutive sibling Accordions share a single border at their common edge. The following sibling omits its top border automatically while preserving the title inset."
figma_notes:
  - "heading level is a web semantic property; it has no visual variant or Figma control."
  - "The medium content slot is bound to gap/g-0_625 for vertical padding, while its header/content gap is gap/g-0_750. The implementation preserves those distinct bindings."
  - "Figma exposes has top border for manual composition; web composition handles consecutive siblings automatically."
  - "The expand icon choice maps to the existing expand more icon / expand less icon instance-swap pairs on Accordion Header; it adds no Figma variant axis."
