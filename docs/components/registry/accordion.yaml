notes: "Owner-directed starting-set expansion, 2026-10-17. Current Figma reference inspected; this is not a Ready to publish assessment."
import:
  batch: 1
  ready: true
status: "draft"
html: "<section><button>Section title</button><div>Content</div></section>"
summary: "A titled section that can reveal or hide its content."
purpose: "Keep related product content in one section without making the product invent its own disclosure."
use_when:
  - "A titled section that can reveal or hide its content."
do_not_use_when:
  -
    text: "The section must always remain visible. Do not conceal essential instructions in a disclosure."
    instead: null
api:
  -
    name: "size"
    kind: "variant"
    description: "The five current Figma density presets; the consumer owns available width."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    description: "Availability of the disclosure button."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is expanded"
    kind: "boolean"
    description: "Bindable state. A collapsed body remains mounted and hidden from interaction."
    default: false
  -
    name: "expand icon position"
    kind: "variant"
    description: "Position of the disclosure chevron; Accordion Figma composition uses trailing."
    default: "trailing"
    values:
      -
        value: "leading"
      -
        value: "trailing"
  -
    name: "label text"
    kind: "text"
    description: "Forwarded to Accordion Header."
    default: "Accordion title"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show a configured decorative title icon."
    default: false
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured decorative title icon."
    svelte_type: "snippet"
  -
    name: "content slot"
    kind: "slot"
    description: "Section content; may contain existing Stylos components."
  -
    name: "id"
    kind: "string"
    description: "Base ID for unique header and body associations."
  -
    name: "onchange"
    kind: "event"
    description: "Native activation event after expansion changes."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Fill available width; constant outer vertical padding with size-dependent header and content gap."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_000"
      gap: "gap/g-0_500"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "small"
      box: "size/s-4_000"
      padding_x: "gap/g-1_250"
      gap: "gap/g-0_625"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_x: "gap/g-1_500"
      gap: "gap/g-0_750"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
    -
      size: "large"
      box: "size/s-6_000"
      padding_x: "gap/g-2_000"
      gap: "gap/g-0_875"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_x: "gap/g-2_500"
      gap: "gap/g-1_000"
      font_size: "size/1_875"
      line_height: "line height/string/1_875"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4384:1292"
  last_verified: "2026-10-17"
limitations:
  - "Provisional product integration: status stays draft even when code exists. API, design alignment and accessibility require subsequent review."
  - "Each Accordion owns its expansion independently. Exclusive groups and animated height transitions are not included."
