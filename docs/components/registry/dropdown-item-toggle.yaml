# Contract written 2026-09-02 from the live component set. A new component, so
# there is no import block. See docs/components/registry/README.md for the schema.

id: "Dropdown Item Toggle"
name: "Dropdown Item Toggle"
family: "Dropdown Item"
level: "object"
role: "input"
html: "<li role=\"presentation\"><label><input type=\"checkbox\" role=\"switch\">"
status: "ready"
version: "0.1.0"
summary: "An option that takes effect the moment it is switched, at either end of the row."
purpose: "For a list of things a person turns on and off rather than picks — a menu of settings rather than a menu of answers. The switch reads as immediate where a checkbox reads as collected, and it sits at either end of the row: leading where it is the point of the row, trailing where the option is named first and the switch answers it."
use_when:
  - "Several options can be on at once and the list stays open while they are set."
do_not_use_when:
  -
    text: "Exactly one option can be chosen, and choosing it closes the list."
    instead: "Dropdown Item Default"
  -
    text: "The options are collected and applied together rather than each taking effect at once."
    instead: "Dropdown Item Checkbox"
children:
  - "Toggle Input"
parents:
  - "Dropdown"
uses:
  - "Toggle Input"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "The web row uses one native labelled control. Its full label is clickable, focus surrounds the row, and checked/disabled state is exposed by the input. The qualifier is an associated description. The owner supplies a named group rather than a listbox for control rows (SC 4.1.2)."
  -
    status: "fail"
    note: "The label of a chosen option measures 4.39:1 in light and 4.41:1 in dark on a hovered row, and 3.74:1 and 3.63:1 on a pressed one, against the 4.5:1 SC 1.4.3 asks. At rest it passes at 4.75:1 and 6.50:1 — putting the pointer on the option is what drops it under."
  -
    status: "fail"
    note: "The second line measures 3.48:1 against the page in light mode, 2.82:1 on a hovered row and 3.05:1 on a chosen one, against 4.5:1. Dark mode clears it at 9.81:1, 4.54:1 and 5.45:1. The role is text/secondary; what fails is the pairing rather than this component's use of it."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: false
    vertical: false
  intent: "Width belongs to the list, which gives every option the same one so the labels line up down the column. Height is nobody's to name — the block padding twice over plus whatever the row is carrying — and the run is deliberately tighter than the Object run the components inside it sit on, because options stack and a tall option multiplies down the list. The inline padding is set so that it plus the list's own padding comes to the padding the closed control above uses, which is what puts the text in the control and the text in every option on one line. The type uses the recommended Element profile rather than the Object profile; this entry records that choice. Line heights come from the string family because an option is one line. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      padding_inline: "gap/g-0_500"
      padding_block: "gap/g-0_500"
      gap: "gap/g-0_500"
      text_gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      additional_font_size: "size/0_625"
      additional_line_height: "line height/string/0_625"
      control: "size/s-2_000"
    -
      size: "small"
      padding_inline: "gap/g-0_750"
      padding_block: "gap/g-0_625"
      gap: "gap/g-0_625"
      text_gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      additional_font_size: "size/0_625"
      additional_line_height: "line height/string/0_625"
      control: "size/s-2_500"
    -
      size: "medium"
      padding_inline: "gap/g-1_000"
      padding_block: "gap/g-0_750"
      gap: "gap/g-0_750"
      text_gap: "gap/g-0_625"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      additional_font_size: "size/0_750"
      additional_line_height: "line height/string/0_750"
      control: "size/s-3_000"
    -
      size: "large"
      padding_inline: "gap/g-1_500"
      padding_block: "gap/g-0_875"
      gap: "gap/g-0_875"
      text_gap: "gap/g-0_750"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
      additional_font_size: "size/0_750"
      additional_line_height: "line height/string/0_750"
      control: "size/s-3_500"
    -
      size: "extra large"
      padding_inline: "gap/g-2_000"
      padding_block: "gap/g-1_000"
      gap: "gap/g-1_000"
      text_gap: "gap/g-0_750"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
      additional_font_size: "size/0_875"
      additional_line_height: "line height/string/0_875"
      control: "size/s-4_000"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Row density, and every option in one list is set to the same one. Drives the padding, the gap, the type and the control, and the control is driven in step so it is never a size out from its row."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "How the row answers a pointer, and whether it can be chosen at all."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "Cannot be chosen. No surface, both lines drop to the disabled text role, and the row carries no focus ring at all because there is nothing to reach."
  -
    name: "is selected"
    kind: "variant"
    default: "false"
    description: "Bindable binary value. Whether this option is on. It throws the switch, tints the row and takes the label to the primary text role."
    values:
      -
        value: "false"
      -
        value: "true"
  -
    name: "alignment"
    kind: "variant"
    default: "start"
    description: "Which end of the row the switch sits at. Leading where the switch is the point of the row; trailing where the option is named first and the switch answers it."
    values:
      -
        value: "start"
      -
        value: "end"
  -
    name: "label text"
    kind: "text"
    default: "Option"
    description: "The option. One line, truncated with an ellipsis — an option too long for the list is cut, so the words that tell it apart go first."
  -
    name: "has additional text"
    kind: "boolean"
    default: "false"
    description: "Whether a second, quieter line sits under the option. It qualifies the option rather than continuing it, and it makes every row in the list taller."
    controls:
      - "additional text"
  -
    name: "additional text"
    kind: "text"
    default: "Additional"
    description: "The qualifier — what the option costs, what it does, why it is not available. Secondary text role at a smaller measure, truncated on the same terms."
  -
    name: "id"
    kind: "string"
    description: "Optional native control identifier; an instance ID is generated otherwise."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Native form field name."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Native form value submitted when selected."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Associated form ID, including when the popup is portalled."
  -
    name: "onchange"
    kind: "event"
    description: "Native change event after the control changes; isSelected also supports binding."
limitations:
  - "Binary on/off only, consistent with the web switch role."
  - "No leading mark. The switch takes one end and the text the other, so an option here cannot also carry an icon."
  - "One line for the option and one for its qualifier, both truncated."
  - "No group heading, no separator and no all-on row. A list that needs them gets them from whatever draws it."
figma_notes:
  - "Web pointer and focus states follow native interaction rather than drawing-only props. All five live sizes were verified on 2026-10-11: nested control sizes match the row; text Vertical trim is NONE. Native labelled controls preserve the drawing with group semantics."
  - "The focus ring is an absolutely positioned rectangle larger than the row, with a thick stroke and a larger radius than the row itself, so it reads as around the option rather than as part of it. It is absent from the disabled variants rather than hidden."
  - "The row's own stroke weight is bound on all four sides but no stroke colour is set, so nothing is painted."
  - "The row drives the nested Toggle Input's own size, state and is checked in step with its own, so the control never disagrees with the row it is in."
  - "The toggle container binds a height but no width, unlike the control container on Dropdown Item Checkbox; the whole boundVariables object was read on each."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4858:6245"
  last_verified: "2026-10-11"
notes: "The api order is authored for readability: Figma's componentPropertyDefinitions does not return the order the panel shows, so adjacency under naming.md sections 9 and 10 cannot be checked from the file and is not claimed."
