id: "Alert Popup Timer"
name: "Alert Popup Timer"
level: "object"
role: "output"
status: "ready"
html: "<section>Notification and actions</section>"
summary: "A floating notification with a controlled time indicator."
purpose: "Present a non-modal notification with remaining time and an optional consumer-owned Undo action."
use_when:
  - "A floating notification with a controlled time indicator."
do_not_use_when:
  -
    text: "Important information must remain available until dismissed without time pressure."
    instead: "Alert Popup"
api:
  -
    name: "size"
    kind: "variant"
    description: "Five density presets. Typography, spacing, the counter, Undo and Close follow size; available width belongs to the host."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "is open"
    kind: "boolean"
    description: "Bindable presence. Closing hides this notification and does not steal focus."
    default: true
  -
    name: "heading text"
    kind: "text"
    description: "Required notification heading; only this text participates in live announcements."
    default: "Heading Text"
  -
    name: "has content"
    kind: "boolean"
    description: "Show the content slot."
    default: false
    controls:
      - "content slot"
  -
    name: "content slot"
    kind: "slot"
    description: "Notification details; no product-specific fallback copy is inserted."
  -
    name: "has close button"
    kind: "boolean"
    description: "Show the native dismiss action."
    default: false
    controls:
      - "close accessible name"
  -
    name: "close accessible name"
    kind: "text"
    description: "Accessible name of the icon-only dismiss action."
    default: "Close"
  -
    name: "announcement"
    kind: "variant"
    description: "Consumer selects urgency independently of visual type; initial static content may need an enclosing live region."
    default: "polite"
    values:
      -
        value: "polite"
      -
        value: "assertive"
      -
        value: "off"
  -
    name: "onclose"
    kind: "event"
    description: "Close event after the bound is open becomes false."
  -
    name: "has undo button"
    kind: "boolean"
    description: "Show a consumer-owned Undo action."
    default: true
    controls:
      - "undo button text"
  -
    name: "undo button text"
    kind: "text"
    description: "Label for the undo action."
    default: "Undo"
  -
    name: "onundoclick"
    kind: "event"
    description: "Native click; restoring product state belongs to the consumer."
  -
    name: "has timer counter"
    kind: "boolean"
    description: "Show the rounded remaining seconds and optional unit."
    default: true
    controls:
      - "time unit"
  -
    name: "time unit"
    kind: "string"
    description: "Optional consumer-localized suffix, such as s or с. Empty shows only the number; no unit or uppercase conversion is added automatically."
    default: ""
  -
    name: "duration"
    kind: "number"
    description: "Total duration in seconds. Non-finite or negative values normalize to 0. Zero duration displays 0 with an empty progress track. The host owns the clock and expiry."
    default: 3
  -
    name: "remaining time"
    kind: "number"
    description: "Remaining seconds, including fractions. Clamped to 0 through duration; invalid values become 0. The count rounds up to a whole second while progress follows the precise remaining fraction. The component does not start a clock or dismiss itself."
    default: 3
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Five Timer densities. Width fills the host and height hugs the content. Counter, heading and Undo form a cluster with its own gap; Close is separated by the outer padding. Counter and Close boxes match the size of Undo. The header-to-content gap is 8/8/10/12/14 and the content stack is 8/10/12/16/20 for XS through XL. The heading has 5 units of block padding. The 8-unit Progress Bar is separated from the body by the outer padding. Background/base, border/default and shadow/elevation 4 follow the independent-notification role (FND-LAYERS-01). Progress is derived from remaining time / duration. Placement, stacking, clock and expiry belong to the host."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_500"
      padding_y: "gap/g-1_500"
      gap: "gap/g-0_750"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "small"
      box: "size/s-4_000"
      padding_x: "gap/g-1_750"
      padding_y: "gap/g-1_750"
      gap: "gap/g-1_000"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_x: "gap/g-2_000"
      padding_y: "gap/g-2_000"
      gap: "gap/g-1_250"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
    -
      size: "large"
      box: "size/s-6_000"
      padding_x: "gap/g-2_500"
      padding_y: "gap/g-2_500"
      gap: "gap/g-1_500"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_x: "gap/g-3_000"
      padding_y: "gap/g-3_000"
      gap: "gap/g-1_750"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4462:2998"
  last_verified: "2026-10-25"
limitations:
  - "Component review completed on 2026-10-25; release-wide accessibility and publication acceptance remain tracked in packages/ui/verification/0.3.0.md."
  - "Popup is a notification surface, not a modal dialog; it neither traps focus nor implements an overlay queue."
  - "Controlled presentation only: the consumer owns the clock, pause/resume, expiry, undo and persistence. No automatic dismissal or per-second screen-reader announcement is introduced."
notes: "Five Timer sizes aligned with the owner-refined Figma component on 2026-10-25. The neutral design replaces the legacy type variants and always includes a heading. Reviewed for component readiness on 2026-10-25; release-wide acceptance remains separate."
