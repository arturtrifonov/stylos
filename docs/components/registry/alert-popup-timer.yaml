figma_notes:
  - "The current set exposes size, heading text, content slot and the has content/close button/undo button/timer counter switches. Its timer text is a drawing sample; the web accepts numeric duration and remaining time in seconds, derives progress, and appends only an explicitly supplied time unit. It has no semantic type or has heading property."
  - "The counter uses matching-size text/emphasis typography, tabular lining figures and surface/subtle/base/default without a stroke. The heading uses normal-family emphasis with string line height: 14/16/18/22/26."
  - "The web reuses Button Outline, Button Inner and Progress Bar. Close and its icon footprint run from 24 to 56; Progress Bar stays 8 high with no visible label. Figma's legacy gap/g-12 (XS) is represented by canonical gap/g-1_500 in code."
