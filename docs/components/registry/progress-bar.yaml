id: "Progress Bar"
name: "Progress Bar"
level: "object"
role: "content"
flow_behavior:
  - "fill"
parents:
  - "Accordion"
  - "Alert Inline"
  - "Alert Popup"
  - "Alert Popup Timer"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
notes: "Owner-directed starting-set expansion, 2026-10-17. Updated to the simplified Figma component on 2026-10-25; this is not a Ready to publish assessment."
import:
  batch: 2
  ready: false
status: "draft"
html: "<progress></progress>"
summary: "A determinate or indeterminate indicator of task completion."
purpose: "Show process completion independently of loading content."
use_when:
  - "A determinate or indeterminate indicator of task completion."
do_not_use_when:
  -
    text: "A status is unrelated to completion of a measurable task."
    instead: "Indicator Status"
api:
  -
    name: "value"
    kind: "string"
    description: "Completion from 0 to 100, with an optional trailing percent sign; unknown is indeterminate. Finite values clamp to the range; invalid numbers become 0."
    default: "0"
    values:
      -
        value: "0"
      -
        value: "37.5"
      -
        value: "100%"
      -
        value: "unknown"
  -
    name: "has label"
    kind: "boolean"
    description: "Show the derived number or supplied label. Unknown has no numeric fallback."
    default: true
    controls:
      - "label text"
      - "label width"
  -
    name: "label text"
    kind: "text"
    description: "Optional label override. Empty derives the clamped number; unknown stays unlabelled unless text is supplied."
    default: ""
  -
    name: "label width"
    kind: "string"
    description: "CSS width reserved for the optional label. Auto hugs its text; use a width such as 5ch for integer percentages 0%–100% so updates do not resize the track. Reserve enough space for the supplied text."
    default: "auto"
    values:
      -
        value: "auto"
      -
        value: "5ch"
  -
    name: "accessible name"
    kind: "text"
    description: "Accessible name describing the operation being measured, independently of the visible label."
    default: "Progress Bar"
sizing_model:
  horizontal: "fill"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: false
  intent: "One authored density: an 8-unit track, 2-unit radius, 4-unit label gap and label/base/extra small typography. The label is vertically centred and may extend above and below the thin track. Width follows the host; the component does not shrink its fixed height in a flex parent. Label width defaults to auto; a fixed CSS label width reserves space independently of the current text. Numeric labels use tabular figures and align to the end. Unknown uses a repeating 12-unit diagonal primary/subtle-primary tile and never implies numerical completion."
motion:
  loop: true
  intent: "Owner review, 2026-10-25: known completion follows externally supplied value immediately, without a component clock, fixed-duration interpolation or easing. The external producer determines elapsed time and update cadence. Unknown moves its diagonal stripes continuously by one tile per motion/duration/cycle using motion/easing/linear, only while value is unknown. Reduced motion keeps the static stripe pattern and native indeterminate semantics (FND-MOTION-12, FND-MOTION-13)."
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "3417:15594"
  last_verified: "2026-10-25"
limitations:
  - "Provisional product integration: status stays draft even when code exists. API, design alignment and accessibility require subsequent review."
figma_notes:
  - "The simplified Figma set exposes value (0% through 100% in 10% examples, plus unknown), has label and label text. Web value is continuous; type, state and has icon are removed."
  - "The bar uses surface/subtle/base/default and surface/bold/primary/default; the unknown tile alternates primary with surface/subtle/primary/default. The visible label uses label/base/extra small."
  - "Figma's example label remains 20 on every variant. The web derives a consistent number unless label text overrides it; unknown never invents a percentage."
