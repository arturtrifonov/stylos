# Unified frontend contract, approved 2026-10-10.
# Separate authored Figma sets are mapped explicitly in figma.sources.
id: "Button"
name: "Button"
family: "Button"
level: "object"
role: "trigger"
html: "<button type=\"button\">"
status: "ready"
version: "0.1.0"
summary: "A labelled action button with base, outline and ghost treatments."
purpose: "Perform the action supplied by the consumer. The treatments share native button behaviour, sizing, label and decorative icon slots; variant controls visual prominence."
use_when:
  - "A labelled control performs an action such as save, create, confirm or apply."
do_not_use_when:
  -
    text: "The control is a local action on the component it sits in — clear a field, remove a tag, dismiss a toast. Those take an icon's space and show their affordance under the pointer; this takes a button's space and is always visible."
    instead: "Button Inner"
  -
    text: "The control is icon-only and stands on its own — a toolbar action, an action in a header. That is an object with its own size run, not this one with its label emptied."
    instead:
      - "Button Icon"
  -
    text: "The control navigates rather than acts. A link drawn as a button is still a link, and drawing it this way breaks the middle click, the copy-address, and the back button."
    instead: "Link"
  -
    text: "Pressing it leaves a state behind rather than performing an action — selecting, toggling, expanding."
    instead:
      - "Toggle Label"
      - "Checkbox Label"
children:
  - "Badge"
  - "Avatar"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Tag"
  - "Loader"
parents:
  - "Accordion"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "hug"
a11y:
  -
    status: "requires"
    note: "The label is uppercased by a transform, not typed in capitals — the characters stay as they were written. An implementation has to do the same and change the case in CSS, because typing the label in capitals changes the accessible name as well as the appearance, and a screen reader may then spell it out letter by letter."
  -
    status: "requires"
    note: "The label has to say what the action does. This component supplies visual weight and nothing else; a button labelled OK inside a filled box is still a button labelled OK."
  -
    status: "requires"
    note: "The label has to say what the action does. This component supplies visual weight and nothing else; a button labelled OK inside a bordered box is still a button labelled OK."
  -
    status: "requires"
    note: "The label has to say what the action does. This component draws nothing at rest, so the label is the entire control — a ghost button labelled OK is a word on a page."
  -
    status: "requires"
    note: "At rest the only thing marking this as a control is its label, so the surface it is placed on has to give the label the contrast it needs. Measured on the white page it sits between 7.1:1 and 14.6:1; on a coloured or image surface that is the consumer's to check, because the component supplies no background of its own to measure against."
sizing_model:
  horizontal: "hug"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: false
  intent: "The height is authored on the Object run and the width is whatever the label needs, so a button is a band of a known height wrapping a variable phrase. The label neither wraps nor truncates — it has no width to truncate against — so a phrase too long for its column widens the button rather than being cut. The type run is a component-specific mapping rather than the recommended Object profile: one step below it at every size, recorded here as the chosen mapping. A button carries two or three words beside the content it acts on, and at the profile's own measures it would out-shout that content. Padding and gap have their own runs; the radius does not move with size, because a button reads as the same shape at every size rather than a shape that rounds off as it grows. Width is the consumer's to name where a layout calls for it — a named width is still fixed, not fill."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      icon: "size/s-2_000"
    -
      size: "small"
      box: "size/s-4_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      icon: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-0_750"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
      icon: "size/s-3_000"
    -
      size: "large"
      box: "size/s-6_000"
      padding_inline: "gap/g-3_000"
      gap: "gap/g-0_875"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
      icon: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_inline: "gap/g-3_500"
      gap: "gap/g-1_000"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
      icon: "size/s-4_000"
api:
  -
    name: "tone"
    kind: "variant"
    default: "primary"
    description: "Semantic colour role, shared by all three visual treatments."
    values:
      -
        value: "base"
        note: "No meaning of its own. The filled button for an action that is the main one on its surface without being brand or consequence."
      -
        value: "primary"
        note: "The default, and the brand. One per surface — a second one is two main actions, which is none."
      -
        value: "warning"
        note: "The action has a consequence the reader should weigh first, and can undo afterwards."
      -
        value: "danger"
        note: "The action destroys something, or cannot be undone. Not an error — the button is working exactly as intended."
      -
        value: "success"
        note: "Rare on a trigger. For a button that completes something rather than starting it."
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "The band height, and with it the label measure, the padding, the gap and the icon slots. Sized to the density of the surface the button sits on rather than to the importance of the action — importance is what tone is for."
    values:
      -
        value: "extra small"
        note: "For a dense row — a table, a toolbar. The 24-unit height meets the minimum target height in WCAG 2.2 SC 2.5.8 (https://www.w3.org/TR/WCAG22/#target-size-minimum); the consumer keeps the complete target at least 24 by 24."
      -
        value: "small"
      -
        value: "medium"
        note: "The default, and what most surfaces want."
      -
        value: "large"
      -
        value: "extra large"
        note: "For a button that is the only thing on its surface — an empty state, a landing section."
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native control. The browser derives hover, pressing and keyboard focus; disabled prevents activation and focus. A disabled fieldset has the same effect."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "Native activation and focus are disabled. Each treatment retains its recorded disabled surface and text roles, without elevation."
  -
    name: "type"
    kind: "variant"
    default: "button"
    description: "Native form behaviour. button performs only the supplied action; submit submits its associated form; reset restores that form's default values."
    values:
      -
        value: "button"
      -
        value: "submit"
      -
        value: "reset"
  -
    name: "variant"
    kind: "variant"
    default: "base"
    description: "Visual treatment mapped to an existing Figma component set. It preserves the shared behaviour and geometry."
    values:
      -
        value: "base"
        note: "The filled action button — the one a view is built around."
      -
        value: "outline"
        note: "The bordered action button, for the action beside the main one."
      -
        value: "ghost"
        note: "The unboxed action button, for an action that should wait to be looked for."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows a mark before the label. Off by default: the label names the action, and a mark in front is for the cases where the action has a symbol the reader already knows."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "The mark shown before the label. It qualifies the action rather than naming it, so a button whose meaning rests on the mark alone is a button with the wrong label."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: false
    description: "Shows a mark after the label. This is the side for a mark that points outward — that the action opens something, continues somewhere, or reveals more."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "The mark shown after the label, on the same terms as the leading one."
  -
    name: "label text"
    kind: "text"
    default: "Button"
    description: "Short label naming the action, supplied in its original case."
  -
    name: "id"
    kind: "string"
    description: "Native button id; the consumer keeps it unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "The submitter name included when this button submits its form."
  -
    name: "value"
    kind: "string"
    default: ""
    description: "The submitter value paired with name."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Id of an associated form, including a form outside the button's ancestors."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated supporting element ids for aria-describedby."
  -
    name: "onclick"
    kind: "event"
    description: "Native click callback for pointer and keyboard activation. It receives a MouseEvent; preventDefault cancels the native submit/reset action. Disabled controls do not activate."
limitations:
  - "The focus ring is absent from every disabled variant, and disabled controls do not receive keyboard focus. A disabled control is outside the tab order."
  - "The base tone measures 4.55:1 against its own label in light mode, clearing 4.5:1 by less than rounding. Any move of surface/bold/base/default or text/inverted is a contrast change, not a colour change."
  - "The label cannot wrap. There is no two-line button and no truncating one; the component is one line by construction."
  - "The focus ring does not scale with size. A 24-tall button and a 56-tall one take the same two-pixel ring at the same offset — deliberate, because the ring belongs to the keyboard rather than to the size run."
  - "Disabled controls do not activate or receive keyboard focus; this also applies inside a disabled fieldset."
  - "The base tone's border is the shared neutral at 2.14:1 against a white page, where the other four tones sit between 7.1:1 and 7.9:1. The label carries the contrast in every tone — between 9.8:1 and 12.9:1 for base — and the border is a boundary rather than information, so its suitability is assessed against FND-ACCESSIBILITY-01 in the consuming interface."
  - "The tones are measured against a white page, because the component supplies no surface of its own. On any other background the numbers are different and nothing in the component knows it."
figma_notes:
  - "Vertical trim checked on 2026-10-10: leadingTrim=NONE on all 100 text layers across 100 variants. Preserve the normal text boxes; this component does not use text-box trimming."
  - "Verified on 2026-10-09 on Button page 0:1, component set 4479:13507. All 100 size/tone/state variants use the corresponding surface/bold token. Figma hover/active states and is focused are drawing controls; the web API exposes default/disabled and derives interaction from the browser. Native type, form identity and onclick are web integration properties, without Figma controls."
  - "The icon containers use the local icon container width collection: widths 14/18/22/25/29 around 16/20/24/28/32-unit icons. Leading marks overhang outward to the left by 2/2/2/3/3; trailing marks overhang to the right. The implementation preserves that optical correction using existing gap tokens. Figma uses Placeholder for unassigned icon swaps; the public icon inputs have no default and render nothing until assigned, as in the Icon contract."
  - "The shared Focus instance has a 2-unit outward offset, an outside stroke bound to width/thick, radius large and border/primary. Focus is absent from disabled variants."
  - "The api block is ordered by the registry contract; Figma's property-key order does not establish panel order."
  - "Verified on 2026-10-09 on Button page 0:1, component set 4829:7643. All 100 size/tone/state variants use surface/subtle tokens with the tone’s text and border roles; the base border uses border/default and disabled uses border/secondary. Figma hover/active states and is focused are drawing controls; the web API exposes default/disabled and derives interaction from the browser. Native type, form identity and onclick are web integration properties, without Figma controls."
  - "Verified on 2026-10-09 on Button page 0:1, component set 4829:8344. All 100 size/tone/state variants use tone text roles, no fill at rest or while disabled, and surface/subtle hover/active tokens. Figma hover/active states and is focused are drawing controls; the web API exposes default/disabled and derives interaction from the browser. Native type, form identity and onclick are web integration properties, without Figma controls."
  - "The owner approved one frontend component for these separate Figma sets on 2026-10-10. variant is a web integration property; Figma names and nodes stay unchanged. Each visual treatment preserves its original tokens, geometry, states and text trimming."
