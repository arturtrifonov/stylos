# Contract written 2026-08-29 from the live Icon page. The parents list and the
# import block are carried unchanged from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Icon"
name: "Icon"
family: "Icon"
level: "primitive"
role: "content"
html: "<svg>"
status: "draft"
version: "0.1"
summary: "A single mark from the system set, chosen by what it means rather than by how it is drawn."
purpose: "Interfaces need a small vocabulary of marks that a person recognises faster than they read: close, search, expand, the direction a thing will move. Icon is that vocabulary. It is deliberately small and deliberately curated — every entry exists because a component needed it — so that choosing one is choosing a meaning the system already has, not shopping in an icon library. The drawing is an implementation of the meaning and can be replaced without any consumer changing."
use_when:
  - "A component needs a mark that stands for a meaning the set already carries, and it reaches for that meaning through one of the exposed icon slots."
do_not_use_when:
  -
    text: "The picture is content rather than vocabulary — a photograph, a logo, an illustration a product owns. Those carry their own meaning, do not take the system's colour, and are not chosen from a set."
    instead: "Image"
  -
    text: "The meaning is not in the set. Adding one is a decision about the vocabulary, not a local substitution, and tracing or importing a shape to fill the gap is how a set stops being a set."
    instead: null
parents:
  - "Accordion / Container"
  - "Accordion / Header"
  - "Avatar"
  - "Button Inner"
  - "Checkbox Input"
  - "Checkbox Label"
  - "Checkbox Text"
