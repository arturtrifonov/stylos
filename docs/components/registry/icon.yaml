flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The mark carries no text, so whether it needs a name is the parent's question, not this component's. A mark that is the only thing saying what a control does has to be named; a mark repeating the words beside it has to be hidden from assistive technology instead, or it is read twice. Nothing in this component can tell which case it is in."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: true
  intent: "One square footprint, and the drawing inside is set to scale with it, so a consumer that needs another dimension sets the number and everything follows. That is why the set is authored at a single size rather than in a run: the components that use it already have size runs of their own and bind the icon slot to whichever step they are on. The drawing does not fill the footprint — each mark is inset by whatever its own optical balance needs, and those insets are the drawing's business rather than the system's."
  footprint: "size/s-3_000"
api:
  -
    name: "name"
    kind: "string"
    description: "Which mark in the active preset. There is no default and no placeholder value: a name that is not registered renders nothing, because an icon nobody chose is one nobody wrote. The registered marks resolve from the start; any other catalogue mark resolves once the consumer registers it. The current default preset retains Material Symbols names, but that is a preset convention rather than the Icon contract. Figma expresses the same property as thirty separate components — see the Figma notes below. The values are examples rather than a vocabulary: any name in the catalogue is valid, and these are what the generated story and the component page render. Written without example names on purpose — this text is rendered as Markdown in Storybook, where an underscored name loses its underscores to emphasis; the values below carry the examples and render intact."
    values:
      -
        value: "search"
      -
        value: "check_circle"
      -
        value: "chevron_right"
      -
        value: "more_horiz"
limitations:
  - "No size and no tone property. The footprint takes one token and a consumer sets another number if it needs one; the colour is bound to a text role, so an instance can be repainted to any role in that family and to nothing outside it."
  - "Error, Success and Warning name marks in the same words the validation vocabulary uses for outcomes. Nothing states whether picture names and property values share a namespace."
figma_notes:
  - "The set is thirty separate components rather than one component set with a property, because swapping an instance is how a designer picks a mark in Figma. They are not thirty components in any other sense: the contract is identical for all of them and only the drawing differs. Code has no equivalent and needs none — one component, and the name of the mark is written rather than picked, so the indirection these thirty provide is Figma-only (SPEC 0012 §1). The twenty-nine marks they hold are among those assets/icons/manifest.yaml registers by default; the thirtieth, the placeholder, marks an instance nobody has chosen yet, which is a state a design file has and a program does not."
  - "figma.node_id points at the base component, Icon — the default in every icon slot and the one member that carries no meaning of its own. It is a real address rather than a representative one, which it was not while that component was named Placeholder."
  - "The twenty-nine marks carry one description between them, because they differ in nothing but the drawing and a per-mark description would have to invent a difference. Its job is not findability — the names already do that at this size of set — but preventing the one misuse there is: A mark from the Stylos icon set. Swap it into an icon, leading icon or trailing icon slot — it is not placed on its own. What the set is and how a mark is chosen: Icon. Typed once and pasted; it is not worth a rule in stylos-description-sync for one family."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "2840-130810"
  last_verified: "2026-09-05"
notes: "children and uses are absent because the mark is a drawing rather than a component."
import:
  batch: 1
  ready: true
