# Contract written 2026-08-29 from the live Icon page. The parents list and the
# import block are carried unchanged from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Icon"
name: "Icon"
family: "Icon"
level: "primitive"
role: "content"
html: "<svg>"
status: "ready"
version: "0.1.0"
summary: "A single mark from the system set."
purpose: "Interfaces need a small vocabulary of marks a person recognises faster than they read: close, search, expand, the direction a thing will move. Icon renders one of them. The set is deliberately small and grown only when something needs a mark, and every mark in it is drawn from Material Symbols at one fixed instance (docs/foundations/icons.md) — so a component reaching for a mark gets one that matches every other mark in the system, which is what makes the set a set rather than a folder."
use_when:
  - "A component needs a mark the set carries, in an icon, leading icon or trailing icon slot."
do_not_use_when:
  -
    text: "The picture is content rather than vocabulary — a photograph, a logo, an illustration a product owns. Those carry their own meaning, do not take the system's colour, and are not chosen from a set."
    instead: "Image"
  -
    text: "The mark is not in the set. Adding one is a line in assets/icons/manifest.yaml and a re-run of npm run icons:import; tracing or importing a shape locally to fill the gap is how a set stops being a set."
    instead: null
