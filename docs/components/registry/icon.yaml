# Contract written 2026-08-29 from the live Icon page. The parents list and the
# import block are carried unchanged from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Icon"
name: "Icon"
family: "Icon"
level: "primitive"
role: "content"
html: "<svg>"
status: "ready"
version: "0.1.0"
summary: "A single mark from the system set."
purpose: "Interfaces need a small vocabulary of marks a person recognises faster than they read: close, search, expand, the direction a thing will move. Icon renders one of them. Any mark in the preset's catalogue can be used; a product registers the ones it needs, so it ships those and no others. Its drawings come from one declared preset (docs/foundations/icons.md), so a component reaching for a mark gets one that matches every other mark in the system, which is what makes the set a set rather than a folder."
use_when:
  - "A component needs a mark from the preset, in an icon, leading icon or trailing icon slot."
do_not_use_when:
  -
    text: "The picture is content rather than vocabulary — a photograph, a logo, an illustration a product owns. Those carry their own meaning, do not take the system's colour, and are not chosen from a set."
    instead: "Image"
  -
    text: "The mark is not in the preset's catalogue. Every catalogue mark is already available — import it from @stylos/ui/icons and register it; tracing or importing a shape from elsewhere to fill a gap is how a set stops being a set."
    instead: null
