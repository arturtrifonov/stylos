# Hand-written 2026-08-26. Replaces part of checkbox.yaml, whose id "Checkbox"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Checkbox Text"
name: "Checkbox Text"
family: "Checkbox"
level: "element"
role: "input"
html: "<label><input type=\"checkbox\"> Label text</label>"
status: "ready"
version: "0.1.0"
summary: "A checkbox tied to wrapping copy in a column of fixed width, the box aligned to the first line."
purpose: "Some checkboxes carry a paragraph — a data-processing agreement, a permission with a qualifier, a confirmation that has to state what is being confirmed. That text wraps at a width the layout decides, and the box has to stay where the reader's eye starts rather than float in the vertical middle of four lines. Checkbox Label can do neither, because it hugs and centres."
use_when:
  - "The text may run to more than one line, or the row must occupy a width the layout sets rather than a width the text sets."
do_not_use_when:
  -
    text: "The label is a phrase on one line — a fixed width would leave a gap after short text."
    instead: "Checkbox Label"
  -
    text: "The control has no visible text of its own because its context supplies the meaning."
    instead: "Checkbox Input"
  -
    text: "The text is not the checkbox's own but the field's. A helper line describing a group of options belongs to the group, not to one option."
    instead: null
parents:
  - "Accordion"
  - "Asset"
  - "Table Cell Checkbox"
  - "Table Cell Heading Checkbox"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Checkbox Input"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "Inline anchors in the content slot retain native label behaviour: activating a link does not toggle the checkbox. Consumers supply phrasing content only, with no nested labels or additional controls."
  -
    status: "warning"
    note: "The copy is the accessible name, so a screen reader reads the whole paragraph as the control's name with no pause. Where the copy runs past a sentence or two, supply accessible name to override the long label and put supplementary explanation in adjacent content associated through description ids."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Width is the one dimension a consumer sets — directly, or by filling an auto-layout parent — and no width token is recorded because there is no width the system chooses. Height follows the wrapping line count and is never set by hand. The box stays aligned to the first line however many lines appear, which is the whole reason this component is separate from Checkbox Label. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/text/0_750"
    -
      size: "small"
      box: "size/s-2_500"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/text/0_875"
    -
      size: "medium"
      box: "size/s-3_000"
      gap: "gap/g-0_750"
      font_size: "size/1_000"
      line_height: "line height/text/1_000"
    -
      size: "large"
      box: "size/s-3_500"
      gap: "gap/g-0_875"
      font_size: "size/1_250"
      line_height: "line height/text/1_250"
    -
      size: "extra large"
      box: "size/s-4_000"
      gap: "gap/g-1_000"
      font_size: "size/1_500"
      line_height: "line height/text/1_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Drives the box, the text measure and the gap together. It does not set the width."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts and for secondary consent text inside an already compact panel."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "Multi-line copy makes the target far larger than 24 x 24 and clears the criterion comfortably. One line at this size is 18 tall and does not — conformant then only through the Spacing exception."
      -
        value: "small"
        rationale: "Same dense contexts, one step up."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "One line at this size is 22 tall against a required 24. Multi-line copy clears it."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native input; hover, pressing and focus are derived by the browser across the whole label. The visual change happens in the box; the copy follows only on disabled, and selection does not change the copy at all."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "The copy takes the disabled text role along with the box. Removes the control from tab order."
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Bindable selection through bind:isChecked; click or Space toggles false/true and activating mixed selects true. Reset restores the initial value. Does not affect the copy."
    values:
      -
        value: "false"
      -
        value: "true"
      -
        value: "mixed"
        note: "Some but not all of what this checkbox governs is selected. Not unknown, not loading, not inapplicable."
  -
    name: "label text"
    kind: "text"
    default: "Checkbox"
    description: "Prose: sentence case, full sentences, terminal punctuation. Written to wrap — if it never wraps, Checkbox Label is the right component. Ticking must mean assent to exactly what is written, so explanation that is not part of the agreement belongs beneath the field rather than inside the label."
    examples:
      -
        verdict: "do"
        props:
          "label text": "I agree to the processing of my personal data in accordance with the privacy policy."
      -
        verdict: "dont"
        caption: "One line leaves a fixed-width gap after the text and gives up the only thing this component does. Use Checkbox Label."
        props:
          "label text": "Remember me"
  -
    name: "id"
    kind: "string"
    description: "Optional native input id. The component generates a stable instance id when omitted; consumers keep supplied ids unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Form field name. An empty name leaves the control out of submitted form data."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Form value submitted when checked and enabled. false and mixed submit no value."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "An optional form id for a control outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Optional accessible-name override mapped to aria-label. Leave empty for the visible label to supply the name; use a concise override for long copy."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of persistent explanatory content, mapped to aria-describedby. These descriptions supplement the accessible name."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native form validity requires a checked value. Unchecked and mixed fail this requirement; no separate error appearance is supplied."
  -
    name: "content"
    kind: "slot"
    description: "Optional phrasing content rendered as children instead of label text, for inline links or emphasis. Use text and anchors only; no nested labels or additional form controls. Clicking a link follows the link without toggling the checkbox."
limitations:
  - "Native required validity is supported; there is no inline error appearance. Associate consumer-supplied error copy through description ids."
  - "No supporting-text slot. One text role only."
  - "The box is always leading and always aligned to the first line. No property changes either."
  - "No text style on the copy — every typographic property is bound to a variable directly."
figma_notes:
  - "Verified on 2026-10-07: all 60 size/state/selection variants, gaps, typography, first-line alignment and Checkbox Input instance references. Web defaults use medium; drawing-only hover/active/focus are derived natively. Form integration properties have no extra Figma variants."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4349-3554"
  last_verified: "2026-10-07"
notes: "Composes Checkbox Input and shares its native behaviour and Motion treatment. The visible text supplies the accessible name unless accessible name overrides it. Legacy children are removed: Label, Badge and Loader are not content children of this input. The historical parents list is retained."
import:
  batch: 1
  ready: true
