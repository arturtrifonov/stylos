flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The spin conveys nothing to a screen reader. The waiting state has to be announced as a status message and the region it covers marked busy — WCAG 2.2 SC 4.1.3, Level AA. A spinner with no announcement is silence, and silence during a wait is indistinguishable from a broken page."
  -
    status: "requires"
    note: "The rotation is continuous and starts on its own, so it must stop or be replaced where the person has asked for reduced motion. Nothing in the component expresses that preference; it is the implementation's obligation and there is no variant that represents the stilled state."
  -
    status: "warning"
    criterion: "WCAG 2.2 SC 2.2.2"
    note: "Moving content that starts automatically and runs past five seconds must be pausable unless the movement is essential to the activity. A loader reporting a real wait is essential and exempt. Left spinning over a view that has finished or stalled it is no longer reporting anything, the exemption falls away, and it is moving decoration that cannot be stopped."
motion:
  drives: "angle"
  loop: true
  intent: "The animation is the component. The four variants form a cycle rather than a scale, and `angle` exists only so something has values to step between — a loader placed at a fixed angle is a stopped loader, which is the one thing this component must never be. How fast it turns and on what curve are not settled here: Figma carries one timing as a prototype, and that is an implementation of the idea rather than a decision the system has made."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable: true
  intent: "One footprint, bound to a token, with proportions locked. The mark inside is not separately sized: it is inset by a sixth on every side and its constraints are set to scale, so it follows the footprint whenever the footprint is set to something else. That is the opposite of Indicator, where the mark deliberately does not follow — here there is one dimension and the mark is a fixed fraction of it."
  footprint: "size/s-3_000"
  mark_ratio: "5/6 of the footprint, by constraint rather than by a recorded value"
api:
  -
    name: "angle"
    kind: "variant"
    default: "0"
    description: "The rotation of the mark, in degrees clockwise. This is not a setting. The four values exist so the prototype has something to step between, and choosing one by hand places a stopped loader — which is the one thing this component must never be. A consumer picks the component, not the angle."
    values:
      -
        value: "0"
      -
        value: "90"
      -
        value: "180"
      -
        value: "270"
limitations:
  - "One property, and it is the animation's. There is no size and no tone."
  - "The colour is fixed to `text/primary`. A loader cannot sit on a filled primary surface — inside a primary button the mark would be indigo on indigo — and there is no tone value to move it."
  - "The mark's own dimension is a raw 20 with no token binding. It holds its proportion by a scale constraint, not by a value the system can change."
  - "Rotation speed and easing are unspecified. The contract says the mark turns continuously and loops; how quickly is an open question, and an implementation is not bound by whatever Figma happens to be running."
