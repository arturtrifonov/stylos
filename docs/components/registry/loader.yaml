id: "Loader"
name: "Loader"
level: "primitive"
role: "content"
html: "no semantic html"
status: "draft"
version: "0.1"
summary: "A spinning mark that says work is under way when there is no figure to report."
purpose: "Most waits have no number attached: the operation either finishes or it does not, and there is nothing meaningful to show in between. Loader is what stands in that gap. It is deliberately mute — it says something is happening and nothing about what, how far along, or how much longer — so that the surrounding interface can say those things where it actually knows them."
use_when:
  - "The interface is waiting for an operation whose progress cannot be measured, or can be but is not worth showing — loading data, submitting changes, refreshing content, preparing a view."
do_not_use_when:
  -
    text: "The progress is known as a proportion. A spinner in place of a bar throws away the one thing the person wants to know."
    instead: "Progress"
  -
    text: "The mark is static — a symbol or decoration rather than a running process. This component is its animation; stopped, it is a shape with no meaning."
    instead: "Icon"
  -
    text: "The wait is long enough that a person will start wondering whether anything is happening at all. A mark answers whether the interface is alive, never what it is doing, and past a few seconds that stops being enough on its own."
    instead: null
