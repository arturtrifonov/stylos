# Hand-written 2026-08-26. Replaces part of checkbox.yaml, whose id "Checkbox"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Checkbox Label"
name: "Checkbox Label"
family: "Checkbox"
level: "element"
role: "input"
html: "<label><input type=\"checkbox\"> Label text</label>"
status: "ready"
version: "0.1.0"
summary: "A checkbox with a short single-line label, sized by its text."
purpose: "Most checkboxes in a product are a box and two or three words. This is that case, authored so the label is part of the same component: clickable, aligned to the box at every size, and programmatically associated without the consumer arranging it."
use_when:
  - "The option is a phrase that sits on one line, and the component may take whatever width its text needs."
do_not_use_when:
  -
    text: "The text wraps, or the row must occupy a fixed column width — the label would either force the component wider than its container or truncate."
    instead: "Checkbox Text"
  -
    text: "The control has no visible text of its own because its context supplies the meaning."
    instead: "Checkbox Input"
  -
    text: "The change takes effect on click. A checkbox is selected now and applied later."
    instead: "Toggle Label"
parents:
  - "Accordion"
  - "Asset"
  - "Table Cell Checkbox"
  - "Table Cell Heading Checkbox"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Checkbox Input"
flow_behavior:
  - "hug"
a11y:
  -
    status: "requires"
    note: "The label is the accessible name and the whole component is the click target, label included. That is the reason to use this rather than assembling a box and a text node; an implementation that makes only the box clickable has thrown away the point of the component."
sizing_model:
  horizontal: "hug"
  vertical: "hug"
  adjustable:
    horizontal: false
    vertical: false
  intent: "The run is authored per size, not inherited from the box. The box happens to be the tallest element at every size, so the component height follows it — but that is a consequence, not the rule, and the run can move independently of Checkbox Input. Neither axis is adjustable: a fixed width is what Checkbox Text is for. Every dimension is a token name; the component height is not recorded because it is derived from the box and the line box. Resolve values with `npm run tokens:report`."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
    -
      size: "small"
      box: "size/s-2_500"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "medium"
      box: "size/s-3_000"
      gap: "gap/g-0_750"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
    -
      size: "large"
      box: "size/s-3_500"
      gap: "gap/g-0_875"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
    -
      size: "extra large"
      box: "size/s-4_000"
      gap: "gap/g-1_000"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Drives the box, the text measure and the gap together. They are not separately settable."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts — filter lists, toolbars, menus — where the surrounding layout already supplies the vertical spacing and a taller row would break the rhythm."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "The whole component is the target and is 16 tall — 72 x 16 for a one-word label. The criterion needs 24 on both dimensions and width does not offset height. Conformant only through the Spacing exception, which needs 24px between the centres of adjacent targets."
      -
        value: "small"
        rationale: "Same dense contexts, one step up where the row can afford it."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "20 tall against a required 24. Same exception applies."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native input; hover, pressing and focus are derived by the browser across the whole label. The visual change happens in the box; the label follows only on disabled, and selection does not change the label at all."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "The label takes the disabled text role along with the box. Removes the control from tab order."
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Bindable selection through bind:isChecked; click or Space toggles false/true and activating mixed selects true. Reset restores the initial value. Does not affect the label."
    values:
      -
        value: "false"
      -
        value: "true"
      -
        value: "mixed"
        note: "Some but not all of what this checkbox governs is selected. Not unknown, not loading, not inapplicable."
  -
    name: "label text"
    kind: "text"
    default: "Checkbox"
    description: "One line, sentence case, no terminal period — it is an option, not a sentence. Wrapping is prevented: long text widens the component past its container. Use Checkbox Text when width is constrained."
    examples:
      -
        verdict: "do"
        props:
          "label text": "Send me release notes"
      -
        verdict: "dont"
        caption: "Phrase the option so that ticking it means yes. An inverted label is read wrongly under time pressure."
        props:
          "label text": "Do not send me release notes"
      -
        verdict: "dont"
        caption: "Anything that would wrap belongs in Checkbox Text — here it just grows sideways."
        props:
          "label text": "I agree to the processing of my personal data in accordance with the privacy policy"
  -
    name: "id"
    kind: "string"
    description: "Optional native input id. The component generates a stable instance id when omitted; consumers keep supplied ids unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Form field name. An empty name leaves the control out of submitted form data."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Form value submitted when checked and enabled. false and mixed submit no value."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "An optional form id for a control outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Optional accessible-name override mapped to aria-label. Leave empty for the visible label to supply the name; use a concise override for long copy."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of persistent explanatory content, mapped to aria-describedby. These descriptions supplement the accessible name."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native form validity requires a checked value. Unchecked and mixed fail this requirement; no separate error appearance is supplied."
limitations:
  - "Native required validity is supported; there is no error appearance. Associate consumer-supplied error copy through description ids."
  - "No label-position property. The label is always trailing."
  - "No text style on the label — every typographic property is bound to a variable directly, so a consumer cannot restyle it by swapping a style."
figma_notes:
  - "Vertical trim checked on 2026-10-10: leadingTrim=NONE on all 60 text layers across 60 variants. Preserve the normal text boxes; this component does not use text-box trimming."
  - "Verified on 2026-10-07: all 60 size/state/selection variants, gaps, typography, first-line alignment and Checkbox Input instance references. Web defaults use medium; drawing-only hover/active/focus are derived natively. Form integration properties have no extra Figma variants."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4327-34970"
  last_verified: "2026-10-07"
notes: "Composes Checkbox Input and shares its native behaviour and Motion treatment. The visible text supplies the accessible name unless accessible name overrides it. Legacy children are removed: Label, Badge and Loader are not content children of this input. The historical parents list is retained."
import:
  batch: 1
  ready: true
