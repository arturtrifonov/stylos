# Hand-written 2026-08-26. Replaces part of checkbox.yaml, whose id "Checkbox"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Checkbox Input"
name: "Checkbox Input"
family: "Checkbox"
level: "element"
role: "input"
html: "<input type=\"checkbox\">"
status: "ready"
version: "0.1.0"
summary: "The checkbox control alone — the box and its selection state, with no label."
purpose: "Selection has to be shown in places that already explain themselves. A table row, a menu item and a bulk-selection header all carry their own meaning, and a label on the checkbox there would repeat what the row already says. This component exists so those contexts get the control without the explanation, and so the box itself is authored once and reused by every component that needs one."
use_when:
  - "The checkbox sits inside a component or layout whose surrounding content already identifies what is being selected — a table cell, a list or menu item, a bulk-selection control, a composed form field."
do_not_use_when:
  -
    text: "The checkbox is a standalone option a person reads and decides on. It needs a label, and the label has to be part of the same component to be clickable and associated."
    instead: "Checkbox Label"
  -
    text: "The option is tied to copy that wraps."
    instead: "Checkbox Text"
  -
    text: "The change takes effect on click. A checkbox is selected now and applied later."
    instead: "Toggle Input"
parents:
  - "Dropdown Item Checkbox"
  - "Accordion"
  - "Asset"
  - "Table Cell Checkbox"
  - "Table Cell Heading Checkbox"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The box shows no text of its own, so nothing on screen supplies its accessible name automatically — the implementation sets one, either on the control or by pointing it at the cell or heading that already identifies the row. That is ordinary work rather than a gap: what a label element does for Checkbox Label, an attribute does here."
  -
    status: "requires"
    note: "The control has its own hit area because it is interactive, and at the smaller sizes that area is below the 24 by 24 the target-size criterion asks for — see the size values. A parent that owns the row usually extends the target across it, which is the normal remedy, but the obligation is to think about the target when placing the control rather than to assume the row will fix it."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable:
    horizontal: false
    vertical: false
  intent: "Square at every size, and the run is authored rather than derived from anything. Both axes are intrinsic — sizing.md names checkbox indicators among the dimensions never adjusted by hand. The 1px inside stroke does not scale with the box. Sizes are recorded as token names, never as numbers: run `npm run tokens:report dimension` to resolve them."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
    -
      size: "small"
      box: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-3_000"
    -
      size: "large"
      box: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-4_000"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "The box dimension. Nothing else about the component changes with it."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts — table rows, menus, toolbars — where the surrounding row already supplies the spacing and the hit area, and a 24px box would break the row rhythm."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "16 against a required 24 on both dimensions. Conformant only where the parent provides the target, or through the Spacing exception, which needs 24px between the centres of adjacent targets."
      -
        value: "small"
        rationale: "Same dense contexts, one step up where the row can afford it."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "20 against a required 24. Same conditions as extra small."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native control. Pointer hover, pressing and keyboard focus are derived by the browser. disabled prevents changes, keyboard focus and form submission. A disabled fieldset has the same effect."
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Selection, bindable in Svelte through bind:isChecked. Click or Space toggles false/true; activating mixed selects true. Form reset restores the selection supplied at mount, including mixed. The unchecked box is a surface and a border; the checked and mixed box is a filled surface with no border and a mark."
    values:
      -
        value: "false"
        note: "No selection mark is drawn in this value. The web decoration keeps its surface mounted, with no hidden mark element."
      -
        value: "true"
        note: "Mark is the Check glyph, sized to the full box rather than inset."
      -
        value: "mixed"
        note: "Some but not all of what this checkbox governs is selected. Not unknown, not loading, not inapplicable. Identical to true in every other respect; only the glyph differs, and it is Dash."
  -
    name: "id"
    kind: "string"
    description: "The native input id, used by a surrounding label or other association. The consumer keeps ids unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Form field name. An empty name leaves the control out of submitted form data."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Form value submitted when checked and enabled. false and mixed submit no value."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "An optional form id for a control outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "The input's accessible name, mapped to aria-label. Leave empty when an associated HTML label already supplies the name. The component draws no visible label."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of persistent explanatory content, mapped to aria-describedby. These descriptions supplement the accessible name."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native form validity requires a checked value. Unchecked and mixed fail this requirement; no separate error appearance is supplied."
limitations:
  - "Native required validity is supported, but there is no validation appearance; the consumer supplies persistent error copy and associates it through description ids."
  - "No read-only value. Disabled is the only unavailable state."
figma_notes:
  - "Verified on 2026-10-07 on Checkbox page 238:47895, component set 4349:1753. The 60 size/state/selection combinations describe visual samples; web state exposes default/disabled, while hover/active/focus are derived by native input and CSS. Figma is focused is a drawing control rather than a public web property."
  - "Form identity, value, accessible naming, descriptions and required validity are web integration properties with no extra visual variants. Existing Figma instances need no migration. Native indeterminate state represents mixed; the web component keeps checked false while mixed."
  - "The Check and Dash glyphs are exact Figma SVG exports at each supported size. They differ from the current Material Symbols preset, so the component retains them as internal masks with shared text colours; no public icon choice is introduced."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4349-1753"
  last_verified: "2026-10-07"
notes: "Hover, pressing and selection treatment transition surface colour and border with duration/micro and easing/linear; the glyph and selection semantics change immediately, without movement or delay. Reduced motion makes these colour changes immediate. The local-state profile keeps a small control responsive and interrupted transitions continue from their current presentation. Historical unused itemSpacing bindings in Figma use Gap/g-6, Gap/g-8 or Gap/g-10; all visual children are positioned absolutely, so these gaps do not affect its footprint. The visual surface accepts no content children. Surrounding labels and copy belong to the consumer or the Checkbox Label/Text compositions. The historical parents list is carried from the pre-split entry."
import:
  batch: 1
  ready: true
