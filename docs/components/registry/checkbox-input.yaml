# Hand-written 2026-08-26. Replaces part of checkbox.yaml, whose id "Checkbox"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Checkbox Input"
name: "Checkbox Input"
family: "Checkbox"
level: "element"
role: "input"
html: "<input type=\"checkbox\">"
status: "draft"
version: "0.1"
summary: "The checkbox control alone — the box and its selection state, with no label."
purpose: "Selection has to be shown in places that already explain themselves. A table row, a menu item and a bulk-selection header all carry their own meaning, and a label on the checkbox there would repeat what the row already says. This component exists so those contexts get the control without the explanation, and so the box itself is authored once and reused by every component that needs one."
use_when:
  - "The checkbox sits inside a component or layout whose surrounding content already identifies what is being selected — a table cell, a list or menu item, a bulk-selection control, a composed form field."
do_not_use_when:
  -
    text: "The checkbox is a standalone option a person reads and decides on. It needs a label, and the label has to be part of the same component to be clickable and associated."
    instead: "Checkbox Label"
  -
    text: "The option is tied to copy that wraps."
    instead: "Checkbox Text"
  -
    text: "The change takes effect on click. A checkbox is selected now and applied later."
    instead: "Toggle Label"
uses:
  - "Icon"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The component shows no text, so its name has to come from outside it — a label element, a reference to the cell or heading that identifies the row, a name supplied directly. All of those are ordinary and supported; what the component cannot do is provide the words itself. An instance embedded with no name is named by nothing, and that is the parent's omission."
  -
    status: "requires"
    note: "The control has its own hit area because it is interactive, and at the smaller sizes that area is below the 24 by 24 the target-size criterion asks for — see the size values. A parent that owns the row usually extends the target across it, which is the normal remedy, but the obligation is to think about the target when placing the control rather than to assume the row will fix it."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable: false
  intent: "Square at every size, and the run is authored rather than derived from anything. Both axes are intrinsic — sizing.md names checkbox indicators among the dimensions never adjusted by hand. The 1px inside stroke does not scale with the box. Sizes are recorded as token names, never as numbers: run `npm run tokens:report dimension` to resolve them."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
    -
      size: "small"
      box: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-3_000"
    -
      size: "large"
      box: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-4_000"
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "The box dimension. Nothing else about the component changes with it."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts — table rows, menus, toolbars — where the surrounding row already supplies the spacing and the hit area, and a 24px box would break the row rhythm."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "16 against a required 24 on both dimensions. Conformant only where the parent provides the target, or through the Spacing exception, which needs 24px between the centres of adjacent targets."
      -
        value: "small"
        rationale: "Same dense contexts, one step up where the row can afford it."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "20 against a required 24. Same conditions as extra small."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Pointer interaction and availability. Hover and active change the box surface only; disabled changes the surface, drops the border to the default role and dims the mark."
    values:
      -
        value: "default"
      -
        value: "hover"
      -
        value: "active"
      -
        value: "disabled"
        note: "Not the same as read-only, which the component does not have: read-only means shown but not editable, disabled means not applicable now."
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Selection. The unchecked box is a surface and a border; the checked and mixed box is a filled surface with no border and a mark."
    values:
      -
        value: "false"
        note: "The component has no children at all in this value — there is no hidden mark layer."
      -
        value: "true"
        note: "Mark is the Check glyph, sized to the full box rather than inset."
      -
        value: "mixed"
        note: "Some but not all of what this checkbox governs is selected. Not unknown, not loading, not inapplicable. Identical to true in every other respect; only the glyph differs, and it is Dash."
  -
    name: "is focused"
    kind: "boolean"
    default: "false"
    description: "Whether the control holds keyboard focus. A ring is drawn outside it and nothing else changes. It is a boolean rather than a value of state because focus coexists with hover, active and checked instead of replacing them."
limitations:
  - "No validation property: a required unticked checkbox cannot show an error."
  - "No read-only value. Disabled is the only unavailable state."
figma_notes:
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4349-1753"
  last_verified: "2026-08-26"
notes: "children and parents are carried from the pre-split entry and have not yet been divided between the three family members — that division is a judgement, not a transcription."
import:
  batch: 1
  ready: true
