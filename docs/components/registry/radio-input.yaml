# Amended 2026-10-10: native web API and verified Figma geometry.
# Hand-written 2026-08-28. Replaces part of radio.yaml, whose id "Radio"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Radio Input"
name: "Radio Input"
family: "Radio"
level: "element"
role: "input"
html: "<input type=\"radio\">"
status: "ready"
version: "0.1.0"
summary: "The radio control alone — the circle and its selection state, with no label."
purpose: "A radio is never one control. It is one member of a set where choosing any member unchooses the rest, and that set is the unit a person reasons about. This component exists for the places where the set is already drawn by something else — a table of plans, a list of options, a row of cards — so the circle can be authored once and reused by everything that needs one, without carrying a label it would only duplicate."
use_when:
  - "The radio sits inside a component or layout whose surrounding content already identifies the option — a table cell, a list or menu item, a card, a composed form row."
do_not_use_when:
  -
    text: "The option is a phrase a person reads and decides on. It needs a label, and the label has to be part of the same component to be clickable and associated."
    instead: "Radio Label"
  -
    text: "The option is tied to copy that wraps, or the row must occupy a width the layout sets."
    instead: "Radio Text"
  -
    text: "More than one of the options may be chosen at once. Mutual exclusion is the whole meaning of this control, and a radio that does not exclude anything is a checkbox drawn wrongly."
    instead: "Checkbox Input"
parents:
  - "Accordion"
  - "Asset"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The circle shows no text of its own, so nothing on screen supplies its accessible name automatically — the implementation sets one, either on the control or by pointing it at the cell, heading or copy that already identifies the option. That is ordinary work rather than a gap: what a label element does for Radio Label, an attribute does here."
  -
    status: "requires"
    note: "A radio only means anything inside a group. The implementation has to expose the set as one group with one name, move between members with the arrow keys rather than tab, and keep a single tab stop for the whole set — SC 4.1.2 and SC 2.1.1. Nothing in this component expresses the group, because the group is not a component here."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable:
    horizontal: false
    vertical: false
  intent: "Circular at every size, and the run is authored rather than derived from anything. Both axes are intrinsic — sizing.md names radio indicators among the dimensions never adjusted by hand — so only the width is bound and the height follows by locked proportion. The centre has its own authored run: exact Figma SVGs of 10/12/14/16/18 sit centred in the 16/20/24/28/32 boxes, with insets of 3/4/5/6/7. It is not a fixed fraction of the box. The 1px inside stroke does not scale with the box. Sizes are recorded as token names, never as numbers: run npm run tokens:report dimension to resolve them."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
    -
      size: "small"
      box: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-3_000"
    -
      size: "large"
      box: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-4_000"
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "The circle dimension, and with it the centre. Nothing else about the component changes with it."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts — table rows, menus, option lists — where the surrounding row already supplies the spacing and the hit area, and a 24px circle would break the row rhythm."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "16 against a required 24 on both dimensions. Conformant only where the parent provides the target, or through the Spacing exception, which needs 24px between the centres of adjacent targets."
      -
        value: "small"
        rationale: "Same dense contexts, one step up where the row can afford it."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "20 against a required 24. Same conditions as extra small."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native radio. Hover, pressing and keyboard focus are derived by the browser. Disabled inputs and disabled fieldsets prevent selection, focus and submission."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "Not the same as read-only, which the component does not have: read-only means shown but not editable, disabled means not applicable now."
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Selection, bindable through bind:isChecked. Native activation selects this option and unchecks peers with the same nonempty name, form owner and tree. Bindings follow selection of managed and native peers. Form reset restores the initial group defaults."
    values:
      -
        value: "false"
        note: "No selection mark is drawn. The decorative surface remains mounted."
      -
        value: "true"
        note: "The circle takes the bold primary surface and drops its border, and a smaller circle in the inverted text role sits inside it."
  -
    name: "id"
    kind: "string"
    description: "Native input id. Supply one for external label association."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Shared nonempty name defines the mutually exclusive options within one form owner and tree. Empty names do not group or submit. Use fieldset and legend to name the group."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Value submitted when checked and enabled. Supply a distinct value for each option in a named group."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Optional form id for an input outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Accessible name mapped to aria-label. Supply this or associate an external label."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of explanatory or error copy, mapped to aria-describedby."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native validity requires a selection in this group. No inline error appearance is supplied."
limitations:
  - "No mixed value, correctly: a radio is chosen or it is not, and partial selection has no meaning in a mutually exclusive set. This is the one place the Radio family and the Checkbox family diverge in their properties."
  - "The inner circle is an opaque fill in the inverted text role, not a hole, so it does not take the colour of whatever the component is placed on. There is no property to change it."
  - "Native required validity is supported; there is no inline error appearance. Associate consumer-supplied error copy through description ids."
  - "No read-only value. Disabled is the only unavailable state, and it is the wrong tool for a choice that is settled but still worth reading."
figma_notes:
  - "Verified on 2026-10-10: all 40 size/state/selection variants. Web API exposes default and disabled; hover, active and focus are native. Form properties add no Figma variants. The checked mark retains text/inverted, including disabled. Five exact Check SVGs are preserved locally."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the set at 40 variants instead of 50."
  - "Figma draws the focus toggle only on checked variants. Web focus follows :focus-visible on any enabled option, including an unchecked member of an empty group; focusing does not itself force selection."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4344-431"
  last_verified: "2026-10-10"
notes: "Native Radio Input implementation. Historical parents are retained; legacy Label/Icon/Badge/Loader children are removed because they are not content children of this control. Motion uses duration/micro and easing/linear, with reduced-motion and forced-colors support."
import:
  batch: 1
  ready: true
