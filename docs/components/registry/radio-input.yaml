# Hand-written 2026-08-28. Replaces part of radio.yaml, whose id "Radio"
# matches no component in Figma. Carries the full component contract; there is
# no companion Markdown document — the readable page is generated from here.

id: "Radio Input"
name: "Radio Input"
family: "Radio"
level: "element"
role: "input"
status: "draft"
version: "0.1"
summary: "The radio control alone — the circle and its selection state, with no label."
purpose: "A radio is never one control. It is one member of a set where choosing any member unchooses the rest, and that set is the unit a person reasons about. This component exists for the places where the set is already drawn by something else — a table of plans, a list of options, a row of cards — so the circle can be authored once and reused by everything that needs one, without carrying a label it would only duplicate."
use_when:
  - "The radio sits inside a component or layout whose surrounding content already identifies the option — a table cell, a list or menu item, a card, a composed form row."
do_not_use_when:
  -
    text: "The option is a phrase a person reads and decides on. It needs a label, and the label has to be part of the same component to be clickable and associated."
    instead: "Radio Label"
  -
    text: "The option is tied to copy that wraps, or the row must occupy a width the layout sets."
    instead: "Radio Text"
  -
    text: "More than one of the options may be chosen at once. Mutual exclusion is the whole meaning of this control, and a radio that does not exclude anything is a checkbox drawn wrongly."
    instead: "Checkbox Input"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The component has no accessible name and cannot have one. The parent must supply it — the row's identifying cell, the card's heading, an association with surrounding text. A parent that embeds this and supplies no name has a defect, and the defect is the parent's."
  -
    status: "requires"
    note: "A radio only means anything inside a group. The implementation has to expose the set as one group with one name, move between members with the arrow keys rather than tab, and keep a single tab stop for the whole set — SC 4.1.2 and SC 2.1.1. Nothing in this component expresses the group, because the group is not a component here."
  -
    status: "requires"
    note: "The parent supplies the click target. The circle is 16 to 32 and is not intended to be the hit area on its own; the cell, row or card is."
  -
    status: "open"
    note: "There is no focus value and there will not be one: state is single-select, and focus coexists with hover, active and checked rather than replacing them. Focus becomes a boolean once its treatment is decided. Unresolved system-wide, and it matters most here because arrow-key movement through a group is the primary way this control is operated."
  -
    status: "open"
    note: "In the disabled checked value the centre and the surface behind it are both light neutrals, and the selection is only just legible. Disabled controls are exempt from the contrast criteria, so this is not a conformance failure — it is an information failure, because a person looking at a disabled group cannot easily see which option was chosen. The roles were moved once on 2026-08-28 and the reading improved without clearing 3:1. Disabled contrast is being reconsidered across the system rather than patched on this component."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable: false
  intent: "Circular at every size, and the run is authored rather than derived from anything. Both axes are intrinsic — sizing.md names radio indicators among the dimensions never adjusted by hand — so only the width is bound and the height follows by locked proportion. The centre is a fixed fraction of the circle rather than a second run: it advances with the box at every step, unlike Indicator where the mark deliberately does not follow. The 1px inside stroke does not scale with the box. Sizes are recorded as token names, never as numbers: run npm run tokens:report dimension to resolve them."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
    -
      size: "small"
      box: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-3_000"
    -
      size: "large"
      box: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-4_000"
variants:
  count: 40
  complete_cross_product: true
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "The circle dimension, and with it the centre. Nothing else about the component changes with it."
    values:
      -
        value: "extra small"
        rationale: "Exists for dense contexts — table rows, menus, option lists — where the surrounding row already supplies the spacing and the hit area, and a 24px circle would break the row rhythm."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "16 against a required 24 on both dimensions. Conformant only where the parent provides the target, or through the Spacing exception, which needs 24px between the centres of adjacent targets."
      -
        value: "small"
        rationale: "Same dense contexts, one step up where the row can afford it."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "20 against a required 24. Same conditions as extra small."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Pointer interaction and availability. Hover and active change the surface only — the unchecked circle moves through the subtle base roles and the checked circle through the bold primary ones; disabled changes the surface and drops the border to the default role."
    values:
      -
        value: "default"
      -
        value: "hover"
      -
        value: "active"
      -
        value: "disabled"
        note: "Not the same as read-only, which the component does not have: read-only means shown but not editable, disabled means not applicable now. Applying it to one member of a group rather than the whole group is almost always wrong — the choice is the group's."
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Selection. The unchecked circle is a surface and a border; the checked circle is a filled surface with no border and a light centre, which reads as a ring."
    values:
      -
        value: "false"
        note: "The component has no children at all in this value — there is no hidden mark layer."
      -
        value: "true"
        note: "The mark is not a dot but a light disc inset into the filled circle, so the selected control reads as a thick ring. That is the inverse of the conventional radio, where the ring is the border and the dot is the accent."
limitations:
  - "No mixed value, correctly: a radio is chosen or it is not, and partial selection has no meaning in a mutually exclusive set. This is the one place the Radio family and the Checkbox family diverge in their properties."
  - "The centre is an opaque light fill rather than a hole. On a white page it reads as a ring; on any other surface it shows a pale disc that does not match what is behind it, and there is no property to change it."
  - "No validation property: a required group with nothing chosen cannot show an error on the control."
  - "No read-only value. Disabled is the only unavailable state, and it is the wrong tool for a choice that is settled but still worth reading."
  - "The stroke weight is a raw 1 with no variable binding, so it does not follow the border scale that width/normal defines."
  - "The centre has a raw dimension with no binding and MIN constraints, so it neither follows the scale nor recentres if the circle is resized. The circle is not adjustable, which is why this has no consequence today."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4344-431"
  last_verified: "2026-08-28"
notes: "children/parents deliberately absent: the allowed-composition set from radio.yaml has not yet been split across the three family members, and that split is a judgement rather than a transcription. radio.yaml should be deleted once it is done — 15 other entries still name Radio. uses is absent because this component contains no instances. used_by needs a whole-file survey that has not been run. The mark layer is still named Check in Figma, a checkbox word on a radio that also names the light centre rather than a mark."
import:
  batch: 1
  ready: true
