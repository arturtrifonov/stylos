# Contract written 2026-09-04 from the live component set. The children list and
# the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Modal"
name: "Modal"
level: "layout"
role: "container"
html: "<dialog>"
status: "draft"
version: "0.1"
summary: "A dialog that takes over the screen until the person answers it."
purpose: "Some decisions cannot be deferred, and the only honest way to say so is to stop everything else. A modal is that stop: a titled panel over the page with the task in the middle and the answers along the bottom, and nothing behind it reachable until one of them is chosen. Everything in it follows from that. It has one heading because a dialog asks one question. It has a close in the corner because refusing to answer has to be as easy as answering. It has a slot rather than a fixed body because what is being asked varies completely while the frame around it does not. And it has no state, because a dialog is not a control — it is either there or it is not."
use_when:
  - "The person has to answer before anything else can continue — confirm a deletion, resolve a conflict, complete a step the flow cannot skip."
  - "A short task deserves its own frame without deserving its own page — a form of a few fields, a picker, a set of settings."
do_not_use_when:
  -
    text: "The content is long enough to scroll at any length, or wide enough to want the page. A dialog that has to be scrolled is a page that has been put in a box."
    instead: "Flex Layout"
  -
    text: "Nothing has to be answered — the panel only shows something alongside the page, and the page should stay usable while it is open."
    instead:
      - "Drawer"
      - "Popover"
  -
    text: "The message reports something that has already happened and needs no answer. Stopping the person to acknowledge a result they cannot change is a dialog spent on nothing."
    instead:
      - "Toast"
      - "Alert"
  -
    text: "It is a few words describing a control the person is already looking at."
    instead: "Tooltip"
children:
