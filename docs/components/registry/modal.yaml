notes: "The accessibility target is not chosen yet — PLAN.md Stage 5 — so what is recorded here is the obligation on the consumer rather than a judgement against a criterion the system has not adopted. children is carried over whole from the imported entry and is close to the whole library, which is what a dialog slot permits in principle; narrowing it is a later judgement."
import:
  batch: 1
  ready: true
