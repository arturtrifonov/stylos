# Contract written 2026-09-01 from the live component set. The relations and the
# import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Select"
name: "Select"
family: "Input"
level: "object"
role: "input"
html: "<label></label><button role=combobox></button><select aria-hidden=true></select><ul role=listbox></ul>"
status: "ready"
version: "0.1.0"
summary: "A form control showing the option currently chosen, which opens a list to change it."
purpose: "A single-value form field. Select renders the closed field and composes Dropdown with authored Dropdown Item Default options. Shared Zag Select behaviour owns keyboard selection, typeahead navigation, dismissal and placement; a hidden native select participates in forms, autofill, required validation and reset."
use_when:
  - "One value is chosen from a set the product knows, and the set is short enough to be worth opening rather than searching."
  - "The set is fixed: a person picks from it and cannot add to it."
do_not_use_when:
  -
    text: "More than one option may be chosen at once."
    instead: "Multiselect"
  -
    text: "The options nest, so choosing means walking a tree rather than picking from a list."
    instead: "Select Cascade"
  -
    text: "The value is typed rather than chosen."
    instead: "Input Text"
  -
    text: "The set is short, the options are visible together, and choosing is the point of the screen rather than one field in a form."
    instead:
      - "Radio Label"
      - "Radio Text"
children:
  - "Dropdown"
  - "Avatar"
  - "Badge"
  - "Button Inner"
  - "Chips"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Label"
  - "Link"
  - "Tag"
  - "Loader"
parents:
  - "Accordion"
  - "Alert Inline"
  - "Alert Popup"
  - "Alert Popup Timer"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Label"
  - "Icon"
  - "Button Inner"
  - "Dropdown"
  - "Dropdown Item Default"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "Supply label text, an accessible name or external label IDs. The full-field trigger is a select-only combobox associated with the Dropdown listbox."
  -
    status: "requires"
    note: "Arrow keys, Home/End, typeahead navigation, Enter/Space, Escape and Tab follow Zag Select. Disabled options are skipped. The native select supplies form data, autofill, required validation and reset."
  -
    status: "requires"
    note: "Only error sets aria-invalid. Error/warning messages and any suffix are associated through aria-describedby. The owner supplies the outcome and useful message."
  -
    status: "requires"
    note: "Clear is a separate native button, named with the field label by default. Supply clear accessible name when external labels or localization require it."
  -
    status: "requires"
    note: "Read-only retains the value, form submission and keyboard focus but cannot open or clear. Disabled leaves the tab order and form submission. Both suppress validation and the chevron. Disabled fieldsets are handled by the native form bridge."
sizing_model:
  horizontal: "fixed"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Width is the one dimension anyone names; the 220 the set is authored at is a canvas artifact carrying no meaning. Height is nobody's to name. The box is a token height per size, and above it the label is one line, or two where it carries a supporting line, or absent — so the component hugs whatever that comes to rather than offering a height to set. The type uses the recommended Element profile rather than the Object profile; this entry records that choice. Line heights come from the string family because the value is one line. The chevron and the leading mark step on the icon run; the clear control and the validation mark step two below it, so neither competes with the value. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      field_height: "size/s-3_000"
      padding_inline: "gap/g-1_000"
      gap: "gap/g-0_500"
      stack_gap: "gap/g-0_250"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_000"
      validation_icon: "size/s-1_500"
      clear: "size/s-1_500"
    -
      size: "small"
      field_height: "size/s-4_000"
      padding_inline: "gap/g-1_250"
      gap: "gap/g-0_625"
      stack_gap: "gap/g-0_375"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_500"
      validation_icon: "size/s-1_750"
      clear: "size/s-1_750"
    -
      size: "medium"
      field_height: "size/s-5_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_750"
      stack_gap: "gap/g-0_500"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_000"
      validation_icon: "size/s-2_000"
      clear: "size/s-2_000"
    -
      size: "large"
      field_height: "size/s-6_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_875"
      stack_gap: "gap/g-0_625"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_500"
      validation_icon: "size/s-2_250"
      clear: "size/s-2_250"
    -
      size: "extra large"
      field_height: "size/s-7_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-1_000"
      stack_gap: "gap/g-0_750"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
      suffix_font_size: "size/0_875"
      suffix_line_height: "line height/string/0_875"
      icon: "size/s-4_000"
      validation_icon: "size/s-2_500"
      clear: "size/s-2_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Field height, padding, text and icon sizes. Width belongs to the consumer."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Interaction mode. Hover and focus are native. Read-only stays focusable but cannot open or clear; disabled also leaves form submission."
    values:
      -
        value: "default"
      -
        value: "read only"
      -
        value: "disabled"
  -
    name: "validation"
    kind: "variant"
    default: "off"
    description: "Consumer-supplied checking result. Error and warning show supporting text; success shows only a mark. Read-only and disabled suppress the outcome. Only error sets aria-invalid; a warning is advisory."
    values:
      -
        value: "off"
      -
        value: "error"
      -
        value: "warning"
      -
        value: "success"
  -
    name: "value"
    kind: "string"
    default: ""
    description: "Selected option value, bindable in Svelte. Empty string means no selection; is filled is derived. Options need unique non-empty values."
  -
    name: "has label"
    kind: "boolean"
    default: true
    description: "Shows the associated Label above the field. When hidden, supply an external label or accessible name."
  -
    name: "label text"
    kind: "text"
    default: "Label"
    description: "Passed to the nested Label and used as the visible field's accessible name."
  -
    name: "has additional text"
    kind: "boolean"
    default: false
    description: "Shows the Label's supporting line outside error and warning, which require the line."
    controls:
      - "additional text"
  -
    name: "additional text"
    kind: "text"
    default: "Additional text"
    description: "Hint or validation message, associated with the field through aria-describedby."
  -
    name: "has placeholder"
    kind: "boolean"
    default: true
    description: "Shows the placeholder before an option is chosen."
    controls:
      - "placeholder text"
  -
    name: "placeholder text"
    kind: "text"
    default: "Select the option"
    description: "Instruction for the empty field; does not provide its accessible name."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied leading decorative mark. No placeholder drawing is substituted."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet before the value, normally Icon."
  -
    name: "has suffix text"
    kind: "boolean"
    default: false
    description: "Shows a unit or qualifier after the value; it is not part of the submitted value."
    controls:
      - "suffix text"
  -
    name: "suffix text"
    kind: "text"
    default: "Suffix"
    description: "Unit or qualifier, included in the field's accessible description."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native required constraint and the nested Label's required marker."
  -
    name: "id"
    kind: "string"
    description: "Native control ID. A stable instance ID is generated when omitted."
  -
    name: "name"
    kind: "string"
    description: "Native form-data key."
  -
    name: "form"
    kind: "string"
    description: "ID of an external form, when the field is outside it."
  -
    name: "autocomplete"
    kind: "string"
    description: "Native autocomplete hint."
  -
    name: "accessible name"
    kind: "text"
    description: "Nonvisual accessible name when has label is false."
  -
    name: "label ids"
    kind: "string"
    description: "Space-separated external label IDs for aria-labelledby when has label is false."
  -
    name: "description ids"
    kind: "string"
    description: "Additional description IDs, combined with the component's supporting text and suffix."
  -
    name: "oninput"
    kind: "event"
    description: "Input event from the native form bridge."
  -
    name: "onchange"
    kind: "event"
    description: "Change event from the native form bridge; the value binding has been updated."
  -
    name: "input text"
    kind: "text"
    default: ""
    description: "Optional selected label for server rendering before the adapter resolves it from the option rows. It does not set the value."
  -
    name: "has clear button"
    kind: "boolean"
    default: false
    description: "Shows a separate clear action only when a value is chosen and the field is editable."
  -
    name: "clear accessible name"
    kind: "text"
    description: "Localized field-specific clear action name. Defaults to Clear plus the visible field label."
  -
    name: "max height"
    kind: "string"
    default: ""
    description: "CSS length limiting the Dropdown option area; empty uses its size-token default."
  -
    name: "options slot"
    kind: "slot"
    description: "Dropdown Item Default snippets. Select supplies the Dropdown panel and size context; each option has a unique non-empty value."
limitations:
  - "Single selection with plain Dropdown Item Default rows. Search, nested options, staged actions and multiple selection remain separate components. Keyboard typeahead navigates the fixed options without a search field."
  - "One line. The selected label truncates horizontally and remains readable in the list."
  - "The chosen value must match an authored option. For server-rendered selected text supply input text; the browser resolves the label from option rows."
  - "The owner supplies validation and localized content, including a field-specific clear accessible name when needed."
figma_notes:
  - "Verified 2026-10-11 against set 4804:9784: medium default; five sizes; default/hover/focus/read-only/disabled; four validation outcomes and empty/filled variants."
  - "In the web API hover/focus follow interaction and is filled follows value. Label text, supporting text and requiredness are forwarded to the nested Label."
  - "Vertical trim is CAP_HEIGHT on empty placeholders at extra small, small, medium and large. The extra-large placeholder and all selected Input text layers use NONE. This is a component detail, not a typography rule."
  - "read only and disabled drop the chevron entirely rather than dimming it, because in those states there is no list to open."
  - "The placeholder sits in a wrapper so the field row keeps its width when the placeholder is switched off."
  - "The label's words and the message's words are properties of the nested Label instance rather than of this component, because Figma cannot push a value deeper without a variable for the whole file. In @stylos/ui both are set on Select and passed down."
  - "state and validation both drive the nested Label by swapping its variant. On success the Label is left on validation off, which is how the rule that success carries no message is expressed."
  - "Focus is a third drop shadow on top of the two the resting field already carries, rather than a change of border weight."
  - "The leading, clear, validation and chevron containers bind their width to a local collection named icon size, outside tokens/, while their heights bind to the dimension scale. The footprints recorded in sizes above are the tokens."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4804:9784"
  last_verified: "2026-10-11"
notes: "Select and Input Text share property keys, box, type run, states and colour roles. That is because they are the same kind of thing in a form, not because either derives from the other. The api order is authored for readability: Figma's componentPropertyDefinitions does not return the order the panel shows, so adjacency under naming.md sections 9 and 10 cannot be checked from the file and is not claimed."
import:
  batch: 1
  ready: true
