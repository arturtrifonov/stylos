# Amended 2026-10-10: binary native switch API and verified Figma geometry.
# Hand-written 2026-08-30. Replaces part of toggle.yaml, whose id "Toggle"
# matches no component in Figma. See docs/components/registry/README.md,
# section "When a component is split".

id: "Toggle Input"
name: "Toggle Input"
family: "Toggle"
level: "element"
role: "input"
html: "<input type=\"checkbox\" role=\"switch\">"
status: "ready"
version: "0.1.0"
summary: "The switch alone — the track and its setting, with no label."
purpose: "A switch says what something is set to and changes it in one movement, without a Save between. This component is that control on its own, for the places where the surrounding interface already says what is being switched: a settings row whose left half is the name, a table cell under a column heading, a composed field. The box is authored once here so every component that needs one is showing the same switch."
use_when:
  - "The switch sits inside a component or layout whose surrounding content already identifies what it governs — a settings row, a table cell, a list item, a composed form field."
do_not_use_when:
  -
    text: "The setting is a phrase a person reads and decides on. It needs a label, and the label has to be part of the same component to be clickable and associated."
    instead: "Toggle Label"
  -
    text: "The setting is tied to copy that wraps, or the row must occupy a width the layout sets."
    instead: "Toggle Text"
  -
    text: "The choice is made now and applied later, when the form is submitted. A switch that waits for a Save button has promised something it does not do."
    instead: "Checkbox Input"
parents:
  - "Dropdown Item Toggle"
  - "Accordion"
  - "Accordion Header"
  - "Table Cell Checkbox"
  - "Table Cell Heading Checkbox"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The switch shows no text of its own, so nothing on screen supplies its accessible name automatically — the implementation sets one, either on the control or by pointing it at the text that already identifies the setting. That is ordinary work rather than a gap: what a label element does for Toggle Label, an attribute does here. The name is the thing being switched, not the act of switching it."
  -
    status: "requires"
    note: "A switch acts on the setting the moment it is flipped. Where the change is slow, costly or hard to reverse, the interface around it has to say so and offer the way back — the control gives no opportunity to reconsider between deciding and doing."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable:
    horizontal: false
    vertical: false
  intent: "The track is the authored dimension and the only one bound: its height takes a step of the Element run and its width follows at three halves by locked proportion, which is what makes a switch read as a switch rather than a wide box. The thumb follows its own size run. Its centred inset grows from 2 to 6 across the five sizes and maps to semantic gap tokens. Neither axis accepts a consumer override; the size property controls the authored run. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      track: "size/s-2_000"
      thumb: "size/s-1_500"
    -
      size: "small"
      track: "size/s-2_500"
      thumb: "size/s-1_750"
    -
      size: "medium"
      track: "size/s-3_000"
      thumb: "size/s-2_000"
    -
      size: "large"
      track: "size/s-3_500"
      thumb: "size/s-2_250"
    -
      size: "extra large"
      track: "size/s-4_000"
      thumb: "size/s-2_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "The track, and with it the thumb. Nothing else about the component changes with it."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native switch. Hover, pressing and keyboard focus come from the browser. Disabled inputs and disabled fieldsets prevent switching, focus and submission."
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Binary on/off setting, bindable through bind:isChecked. Native activation updates it immediately; form reset restores the initial value and respects cancellation. Mixed is not part of the web API."
    values:
      -
        value: "false"
      -
        value: "true"
  -
    name: "id"
    kind: "string"
    description: "Native input id. Supply one for external label association."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Native form field name. Only enabled, checked switches with a nonempty name submit."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Value submitted when checked and enabled."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Optional form id for an input outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Accessible name mapped to aria-label. Supply this or associate an external label."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of explanatory or error copy, mapped to aria-describedby."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native validity requires this switch to be on. No inline error appearance is supplied."
limitations:
  - "Native required validity is supported; no inline error appearance is supplied. Associate consumer error copy through description ids."
  - "No read-only value. Disabled is the only unavailable state, and it is the wrong tool for a setting that is fixed but still worth reading."
  - "No tone. The track takes the primary role when on and the neutral role when off."
figma_notes:
  - "Verified on 2026-10-10: five sizes and all binary state appearances. Web API exposes default and disabled; hover, active and focus are native. The owner selected false/true only for the web API: mixed remains a Figma drawing variant and is not implemented as a switch value. Form properties add no Figma variants."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the set at 60 variants instead of 75. The ring is present on every enabled variant and on none of the disabled ones."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
  - "Five variants — state=default, is checked=false, at all five sizes — carry a padding binding that changes nothing: the track is not an auto-layout frame, so padding moves no child. It cannot be cleared from the file, because Figma does not expose padding controls on a frame without a layout, and it has no effect either way."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4341-31485"
  last_verified: "2026-10-10"
notes: "Native Toggle Input implementation. Historical parents are retained; legacy Label/Icon/Badge/Loader children are removed because they are not content children of this control. Motion uses duration/micro and easing/linear, with reduced-motion and forced-colors support."
import:
  batch: 1
  ready: true
