# List spacing verified against all ten live Figma variants on 2026-10-24.
id: "Dropdown"
name: "Dropdown"
level: "widget"
role: "container"
html: "<div><ul role=\"listbox\"></ul></div>"
status: "ready"
version: "0.1.0"
summary: "The panel a dropdown opens: a list of options with optional search, a way back, and buttons under it."
purpose: "Everything a list of options needs around the options themselves. The rows are their own components and go in a slot; what this adds is the surface they sit on, the four bands that can appear around them — a way back out of a submenu, a field to narrow the list, the list itself, and buttons to apply or cancel — and one decision about how tall the thing is allowed to get before it starts scrolling."
use_when:
  - "Options have to be shown in a panel over the page rather than in the layout."
  - "The list needs searching, applying, or a way back out of a nested level."
do_not_use_when:
  -
    text: "The options belong in the page rather than over it, and all of them should be visible at once."
    instead:
      - "Radio Label"
      - "Radio Text"
  -
    text: "The panel is a whole view rather than a list — a form, a document, a set of sections."
    instead:
      - "Modal"
      - "Drawer"
children:
  - "Dropdown Item Default"
  - "Dropdown Item Parent"
  - "Dropdown Item Checkbox"
  - "Dropdown Item Toggle"
parents:
  - "Select"
  - "Multiselect"
  - "Select Cascade"
  - "Button Dropdown"
  - "Tabs Horizontal"
uses:
  - "Dropdown Item Default"
  - "Input Search"
  - "Button"
  - "Scrollbar"
flow_behavior:
  - "fixed"
  - "absolute"
a11y:
  -
    status: "requires"
    note: "The panel is a list of options and nothing here says so. The implementation has to expose it as one, tie it to whatever opened it, and carry the open state on that control — SC 4.1.2."
  -
    status: "requires"
    note: "For the current single-choice web composition, Arrow keys, Home/End and typeahead move the highlighted option without committing it. Enter/Space or a pointer click commits it and closes. Escape closes without changing the value. Tab dismisses and continues through the page; the panel is not a focus trap. SC 2.1.1 and SC 2.1.2."
  -
    status: "requires"
    note: "The search field narrows the list under it. The implementation has to say how many options are left after each keystroke, because a person who cannot see the list shrinking has no way to know the field is doing anything — SC 4.1.3."
  -
    status: "requires"
    note: "The buttons band means the choices are not applied until it is pressed, and the list is telling nobody that. Where it is used, whether a change has been staged or committed has to be said rather than implied by a button being there."
sizing_model:
  horizontal: "fixed"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: true
  intent: "Width is supplied by the owner. The panel hugs its bands until its maximum; only the options scroll. Default maxima are derived from 6.5 plain row heights, five row gaps, block padding on both sides and the panel border. List padding on all four sides and the gap between rows are gap/g-0_500 at every size."
  sizes:
    -
      size: "extra small"
      max_height: 186
      list_gap: "gap/g-0_500"
      search_padding: "gap/g-1_000"
      buttons_padding: "gap/g-1_000"
      buttons_gap: "gap/g-0_750"
      back_padding_block: "gap/g-0_750"
      back_padding_inline: "gap/g-0_250"
      list_padding_inline: "gap/g-0_500"
      list_padding_block: "gap/g-0_500"
    -
      size: "small"
      max_height: 225
      list_gap: "gap/g-0_500"
      search_padding: "gap/g-1_250"
      buttons_padding: "gap/g-1_250"
      buttons_gap: "gap/g-0_875"
      back_padding_block: "gap/g-0_875"
      back_padding_inline: "gap/g-0_375"
      list_padding_inline: "gap/g-0_500"
      list_padding_block: "gap/g-0_500"
    -
      size: "medium"
      max_height: 264
      list_gap: "gap/g-0_500"
      search_padding: "gap/g-1_500"
      buttons_padding: "gap/g-1_500"
      buttons_gap: "gap/g-0_875"
      back_padding_block: "gap/g-1_000"
      back_padding_inline: "gap/g-0_500"
      list_padding_inline: "gap/g-0_500"
      list_padding_block: "gap/g-0_500"
    -
      size: "large"
      max_height: 303
      list_gap: "gap/g-0_500"
      search_padding: "gap/g-1_750"
      buttons_padding: "gap/g-1_750"
      buttons_gap: "gap/g-0_875"
      back_padding_block: "gap/g-1_000"
      back_padding_inline: "gap/g-0_625"
      list_padding_inline: "gap/g-0_500"
      list_padding_block: "gap/g-0_500"
    -
      size: "extra large"
      max_height: 342
      list_gap: "gap/g-0_500"
      search_padding: "gap/g-2_000"
      buttons_padding: "gap/g-2_000"
      buttons_gap: "gap/g-0_875"
      back_padding_block: "gap/g-1_250"
      back_padding_inline: "gap/g-0_750"
      list_padding_inline: "gap/g-0_500"
      list_padding_block: "gap/g-0_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Density of the panel and its option rows. Dropdown Item Default inherits this size in Svelte; the owner configures optional band content and the external trigger to match."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "content slot"
    kind: "slot"
    description: "The option rows. A single-choice panel contains Dropdown Item Default rows with unique non-empty values."
  -
    name: "back slot"
    kind: "slot"
    description: "Optional back band. The owner supplies its content and nested-navigation behaviour."
  -
    name: "search slot"
    kind: "slot"
    description: "Optional search band. The owner supplies the field and filtering behaviour."
  -
    name: "actions slot"
    kind: "slot"
    description: "Optional actions band. The owner supplies actions and staged-value behaviour."
  -
    name: "content role"
    kind: "variant"
    default: "listbox"
    description: "Listbox for plain selection options; group for native Checkbox and Toggle rows. The owner chooses matching behaviour."
    values:
      -
        value: "listbox"
      -
        value: "group"
  -
    name: "id"
    kind: "string"
    description: "Identifier of the content group or listbox, available to the behaviour owner."
  -
    name: "accessible name"
    kind: "text"
    description: "The question this list answers. Supply a non-empty name."
    values:
      -
        value: "Choose a workspace"
  -
    name: "max height"
    kind: "string"
    description: "Optional CSS length overriding the panel maximum. By default the size profile clips after six and a half plain rows."
limitations:
  - "No open and no closed. The panel is the open thing; whatever it drops from owns the opening, the closing and where it sits on the screen."
  - "No position, no side and no alignment. Whether the panel hangs below or above the control, and which edge it lines up with, is not decided here."
  - "No empty state, no loading state and no group headings inside the list. A list with nothing in it, a list still arriving, and a list that needs dividing all have to be built in the slot."
  - "The scrollbar uses small/absolute at every panel size in Figma; the web applies this drawing treatment through native CSS with owner-approved platform differences. The scrollbar is the same size at every panel size. That is a choice of default parameters for it rather than a run, and it does not follow the size property the way the rows, the field and the buttons do."
  - "One search field and one back row, both at the top and both in a fixed order. Nothing reorders the bands."
  - "dropdownBehavior supports plain single selection; dropdownControlsBehavior supports a group of native Checkbox/Toggle rows. dropdownNavigationBehavior uses the Back band for navigation within one popup. Search and actions slots remain owner-supplied bands for future searchable or staged-selection behaviour. None of those bands can be combined with dropdownBehavior."
figma_notes:
  - "Amended 2026-10-24: all ten size/height variants use gap/g-0_500 for list padding on all four sides and for the gap between rows. Web default maxima follow the existing 6.5-row formula with the new padding: 186/225/264/303/342 px for XS/S/M/L/XL. The manually authored fixed-height Figma examples remain 186/229/272/315/358 px; they are not the web maximum-height contract."
  - "Amended 2026-10-12 at the owner’s request: navigation levels slide out then slide in across their own width, without fading, over one continuous Figma frame and shadow. Forward exits left and arrives from the right; Back reverses it. Incoming travel and height adjustment start as soon as outgoing travel finishes. Arrival and expansion use motion/duration/medium/enter with enter easing; departure and contraction use medium/exit with exit easing. Interruptions continue from presented translation and height; returning to a level already on screen reverses it immediately. Reduced motion changes levels immediately. This internal transition is separate from the shared layer-3 surface entry."
  - "Elevation checked on 2026-10-11: all ten size/height variants use shadow/elevation 3 (style key 1f7004d54f790d3624f31d20a58a9a6543ab2470). Web CSS now matches that binding; the earlier elevation-4 implementation was incorrect."
  - "The maximum height has no property in the set. Figma cannot hold a maximum and keep the buttons band pinned beneath it, so the two ends are variants instead: hug is the panel under its maximum, and fixed is a height a designer sets by hand to see the list clipped with the buttons still in place. Neither value is part of the component — it has one adjustable maximum and no such switch."
  - "The set is authored at a width because Figma cannot leave one unset. It carries no meaning and no width token is recorded."
  - "The back row is an instance of Dropdown Item Default rather than a component of its own, so it inherits the row's states and its focus ring."
  - "The scrollbar instance is Scrollbar / Vertical in the library. The registry entry it points at is Scrollbar; the ids will meet when that component is written."
  - "has scrollbar is a Figma property and not part of the API. It shows the bar beside the list so a mockup can draw an overflowing panel; it says the bar is visible, never that the list scrolls, and a list shorter than the maximum has nothing to scroll and nothing to show it with. A real component decides this from its own content height and exposes nothing for it, which is why the property is recorded here rather than in api — registry/README.md."
  - "The panel clips its own content, and so does the container holding the list, so a row longer than the panel is cut at the panel's edge rather than drawn over its shadow."
  - "Web slots replace has back button, has search and has buttons: a band is present when its content snippet is supplied. The Figma set is unchanged. Single-value selection uses listbox/option semantics; opening, dismissal and positioning belong to dropdownBehavior and its external trigger. Menu actions remain a separate future behaviour."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4857:3786"
  last_verified: "2026-10-24"
notes: "Level 3, control attachment under FND-LAYERS-01 and FND-LAYERS-02; shadow selection follows FND-EFFECTS-05 and surface motion follows FND-MOTION-19. The shared surface-motion adapter implements panel entry and exit. Closed panels are inert and hidden from accessibility immediately; selection, dismissal and focus do not wait for animation. The api order is authored for readability: Figma's componentPropertyDefinitions does not return the order the panel shows, so adjacency under naming.md sections 9 and 10 cannot be checked from the file and is not claimed."
import:
  batch: 1
  ready: true
