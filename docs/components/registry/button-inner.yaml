  - "Modal"
  - "Side Panel"
  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The button shows no text, so nothing on screen supplies its accessible name automatically — the implementation sets one, and the tooltip that names the action usually carries the same words. That is ordinary work rather than a gap. The name says what the action does, not what the icon looks like."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable: true
  intent: "One footprint bound to one token, with proportions locked so the second axis follows the first. There is no size run and no size property: a consumer that needs another dimension sets the number outright, and everything inside follows by scale constraint. The footprint is the icon's rather than the control's — the component is laid out as if it were the icon it contains, which is why a parent gives it exactly an icon's room. The pressable area is not that footprint. It is the halo, deliberately larger and drawn outside the bounds, so it behaves as an effect that appears under the pointer rather than as a box in the flow. That separation is the component: the icon holds the space, the halo holds the target."
  footprint: "size/s-5_000"
  halo: "larger than the footprint and outside it, by a raw dimension rather than a token — see limitations"
api:
  -
    name: "icon"
    kind: "instance"
    default: "Placeholder"
    description: "The mark that names the action. It is the whole content of the component and it fills the footprint exactly, so there is no visible label to fall back on and the icon has to carry the meaning on screen by itself. It is also what the accessible name has to describe."
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "The interaction condition. Only the surface behind the icon responds to it: the icon itself is unchanged across default, hover and active, and changes only when the control is disabled. Focus is a separate boolean."
    values:
      -
        value: "default"
        note: "No halo. The component is the icon and nothing else, which is the state it is in nearly all of the time."
      -
        value: "hover"
        note: "The halo appears behind the icon. It is the only difference from default, and it is drawn outside the component's bounds."
      -
        value: "active"
        note: "The halo darkens by one step. The icon is unchanged from hover."
      -
        value: "disabled"
        note: "No halo, and the icon drops to the disabled text role. The component keeps its place in the layout and stops being a target."
  -
    name: "is focused"
    kind: "boolean"
    default: "false"
    description: "Whether the control holds keyboard focus. A ring is drawn outside it and nothing else changes. It is a boolean rather than a value of state because focus coexists with hover, active and disabled instead of replacing them."
limitations:
  - "No size property: the footprint takes one token and a consumer that needs another sets the number. The icon's colour is a different case — it is bound to a text role deliberately, so an instance can be repainted to any role in that family, which is how the control follows the text it sits beside."
  - "The halo is a raw 56 with no variable binding, so it cannot follow the scale when the scale moves. Resizing an instance carries it by scale constraint, which keeps the proportion but does not make it a token."
  - "The halo sits outside the component's bounds and no parent layout reserves room for it. That is the design, and it has a cost: in an auto-layout row whose gap is under 16 the halo of one instance overlaps its neighbour."
figma_notes:
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
