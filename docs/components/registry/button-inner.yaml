  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "open"
    note: "Focus is not modelled. `state` carries default, hover, active and disabled, there is no `is focused` boolean, and no focus ring exists in any variant, so SC 2.4.7 has nothing to satisfy it. This is not a gap peculiar to this component: focus coexists with hover and with active and therefore cannot be a value of a single-select property, and Stylos has not yet decided what shape it takes instead. The component waits on that decision rather than inventing one for itself."
  -
    status: "requires"
    note: "The component has no text of its own — its entire content is a swapped icon — so nothing in it carries an accessible name and the consumer must supply one, per SC 4.1.2. The name has to say what the action does, not what the icon looks like. An unlabelled instance is a control a screen reader announces as nothing."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable: true
  intent: "One footprint bound to one token, with proportions locked so the second axis follows the first. There is no size run and no size property: a consumer that needs another dimension sets the number outright, and everything inside follows by scale constraint. The footprint is the icon's rather than the control's — the component is laid out as if it were the icon it contains, which is why a parent gives it exactly an icon's room. The pressable area is not that footprint. It is the halo, deliberately larger and drawn outside the bounds, so it behaves as an effect that appears under the pointer rather than as a box in the flow. That separation is the component: the icon holds the space, the halo holds the target."
  footprint: "size/s-5_000"
  halo: "larger than the footprint and outside it, by a raw dimension rather than a token — see limitations"
variants:
  count: 4
  complete_cross_product: true
api:
  -
    name: "icon"
    kind: "instance"
    default: "Placeholder"
    description: "The mark that names the action. It is the whole content of the component and it fills the footprint exactly, so there is no label to fall back on and the icon has to carry the meaning by itself. It is also what the accessible name has to describe."
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "The interaction condition. Only the surface behind the icon responds to it: the icon itself is unchanged across default, hover and active, and changes only when the control is disabled. Focus is absent — see the component-level finding."
    values:
      -
        value: "default"
        note: "No halo. The component is the icon and nothing else, which is the state it is in nearly all of the time."
      -
        value: "hover"
        note: "The halo appears behind the icon. It is the only difference from default, and it is drawn outside the component's bounds."
      -
        value: "active"
        note: "The halo darkens by one step. The icon is unchanged from hover."
      -
        value: "disabled"
        note: "No halo, and the icon drops to the disabled text role. The component keeps its place in the layout and stops being a target."
limitations:
  - "No tone and no size. The icon takes the base text role in every enabled state and the footprint takes one token; neither has a property to move it. On a filled or inverted surface the mark would be dark on dark, and nothing in the API corrects it."
  - "The halo is a raw 56 with no variable binding, so it cannot follow the scale when the scale moves. Resizing an instance carries it by scale constraint, which keeps the proportion but does not make it a token."
  - "The halo sits outside the component's bounds and no parent layout reserves room for it. That is the design, and it has a cost: in an auto-layout row whose gap is under 16 the halo of one instance overlaps its neighbour."
  - "The component is not auto-layout. Both children are absolutely positioned with scale constraints, which is what makes a consumer's resize work at all; it also means the icon cannot be inset from the footprint without moving to a different layout model."
