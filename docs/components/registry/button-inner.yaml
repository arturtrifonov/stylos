# Contract written 2026-08-28 from the live component set. The children/parents
# lists and the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Button Inner"
name: "Button Inner"
family: "Button Inner"
level: "element"
role: "trigger"
html: "<button type=\"button\"><!-- icon --></button>"
status: "draft"
version: "0.1"
summary: "An icon-sized trigger for a single local action on the component it sits in."
purpose: "Composed components accumulate small actions on themselves — clear a field, remove a tag, dismiss a toast, reset a filter — and none of them is an action on the view. Button Inner is the control for exactly those. It is drawn as an icon and it occupies an icon's space, so a parent lays it out as though it were the icon it contains and the content beside it closes up around it; the affordance that says it is pressable appears only under the pointer and reaches outside that space. Its label is not visible — the icon carries the meaning on screen, the name is supplied to assistive technology, and a tooltip says the same thing to everyone else."
use_when:
  - "A composed component needs one local action on itself — close, remove, clear, dismiss, reset — and the icon alone says what the action is."
  - "The action has to occupy no more room than the icon that names it, because the space belongs to the content beside it."
do_not_use_when:
  -
    text: "The action is the point of the view rather than a detail inside it. This component has no label, no tone and no emphasis, and a primary action given to a control designed to recede is a primary action that gets missed."
    instead:
      - "Button Base"
      - "Button Outline"
      - "Button Ghost"
  -
    text: "The control is icon-only but stands on its own — a toolbar action, an action in a header. That is an object with its own size run and its own tones, not an element borrowed from the component around it."
    instead: "Button Icon"
  -
    text: "The control changes a value rather than performing an action — selecting, toggling, expanding. A trigger that leaves state behind it is a different component."
    instead: "Toggle Label"
children:
  - "Icon"
  - "Loader"
parents:
