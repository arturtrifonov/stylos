# Contract written 2026-08-28 from the live component set. The children/parents
# lists and the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.
# Web API amended 2026-10-10 for native interaction and configured icon snippets.

id: "Button Inner"
name: "Button Inner"
family: "Button Inner"
level: "element"
role: "trigger"
html: "<button type=\"button\"><!-- icon --></button>"
status: "ready"
version: "0.1.0"
summary: "An icon-sized trigger for a single local action on the component it sits in."
purpose: "Composed components accumulate small actions on themselves — clear a field, remove a tag, dismiss a toast, reset a filter — and none of them is an action on the view. Button Inner is the control for exactly those. It is drawn as an icon and it occupies an icon's space, so a parent lays it out as though it were the icon it contains and the content beside it closes up around it; the affordance that says it is pressable appears only under the pointer and reaches outside that space. Its label is not visible — the icon carries the meaning on screen, the name is supplied to assistive technology, and a tooltip says the same thing to everyone else."
use_when:
  - "A composed component needs one local action on itself — close, remove, clear, dismiss, reset — and the icon alone says what the action is."
  - "The action has to occupy no more room than the icon that names it, because the space belongs to the content beside it."
do_not_use_when:
  -
    text: "The action is the point of the view rather than a detail inside it. This component has no label, no tone and no emphasis, and a primary action given to a control designed to recede is a primary action that gets missed."
    instead:
      - "Button"
  -
    text: "The control is icon-only but stands on its own — a toolbar action, an action in a header. That is an object with its own size run and its own tones, not an element borrowed from the component around it."
    instead:
      - "Button Icon"
  -
    text: "The control changes a value rather than performing an action — selecting, toggling, expanding. A trigger that leaves state behind it is a different component."
    instead: "Toggle Label"
children:
  - "Icon"
  - "Loader"
parents:
  - "Accordion Header"
  - "Avatar"
  - "Chips"
  - "Tag"
  - "Tooltip"
  - "Asset"
  - "Code Editor Text Area"
  - "Edit Mode"
  - "Input Text"
  - "Input Date"
  - "Input Search"
  - "Input Number"
  - "Input Color"
  - "Input Datetime"
  - "Input Email"
  - "Input Password"
  - "Input Time"
  - "Input Telephone"
  - "Input URL"
  - "Multiselect"
  - "Select"
  - "Select Cascade"
  - "Text Area"
  - "Progress"
  - "Pull to Refresh"
  - "Slider"
  - "Table Cell Text"
  - "Table Cell Link"
  - "Table Cell Boolean"
  - "Table Cell Tags"
  - "Table Cell Actions"
  - "Table Cell Expand"
  - "Table Cell Person"
  - "Table Cell Image"
  - "Table Cell Heading"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "fixed"
a11y:
  -
    status: "requires"
    note: "The button shows no text, so nothing on screen supplies its accessible name automatically — the implementation sets one, and the tooltip that names the action usually carries the same words. That is ordinary work rather than a gap. The name says what the action does, not what the icon looks like."
sizing_model:
  horizontal: "fixed"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: true
  intent: "One footprint bound to one token, with proportions locked so the second axis follows the first. There is no size run and no size property: a consumer that needs another dimension sets the number outright, and everything inside follows by scale constraint. The footprint is the icon's rather than the control's — the component is laid out as if it were the icon it contains, which is why a parent gives it exactly an icon's room. The pressable area is not that footprint. It is the halo, deliberately larger and drawn outside the bounds, so it behaves as an effect that appears under the pointer rather than as a box in the flow. That separation is the component: the icon holds the space, the halo holds the target."
  footprint: "size/s-5_000"
  halo: "140% of the footprint, centred outside it; 56 at the default footprint"
api:
  -
    name: "icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "The configured Icon or Loader snippet that names the action on screen. It fills the footprint and is decorative for assistive technology; accessible name supplies the action's words. An unassigned icon renders nothing."
    examples:
      -
        verdict: "do"
        caption: "Give the local action a name matching its icon."
        props:
          icon: "close"
          "accessible name": "Clear field"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Whether the local action is available. The browser derives hover, pressing and keyboard focus; disabled also suppresses activation and removes the tab stop."
    values:
      -
        value: "default"
        note: "No halo at rest. Pointer interaction changes only the surface behind the icon."
      -
        value: "disabled"
        note: "No halo, and the icon takes text/disabled. Native disabled fieldsets have the same effect."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Required consumer-supplied action name for aria-label, such as Clear field or Remove tag. The icon's name is not an action label; an optional surrounding Tooltip usually repeats these words."
  -
    name: "id"
    kind: "string"
    description: "Native button id; the consumer keeps it unique."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated supporting element ids for aria-describedby."
  -
    name: "onclick"
    kind: "event"
    description: "Native click callback for pointer, Enter and Space activation. This local-action button always uses type=button and does not submit its surrounding form. Disabled controls do not activate."
limitations:
  - "No size run or tone property. CSS --stylos-button-inner-footprint defaults to size/s-5_000; a parent can set it to another size token. --stylos-button-inner-color defaults to text/base and can inherit a parent-supplied text-role token. Disabled always uses text/disabled."
  - "Figma leaves the 56-unit halo unbound. Its SCALE constraint makes it 140% of the footprint; CSS preserves that proportion and the exact exported halo SVG. The target extends beyond the layout box even at rest."
  - "The halo sits outside the component's bounds and no parent layout reserves room for it. That is the design, and it has a cost: at the default 40-unit footprint, neighbours whose gap is under 16 have overlapping halos. The necessary separation scales with the footprint."
figma_notes:
  - "Verified on 2026-10-10 on Button Inner page 4015:7774, component set 330:59475: all four drawing states share a 40-unit Icon footprint; hover and active have a 56-unit centred ellipse at (-8,-8), using surface/subtle/base/hover and active. The icon uses text/base or text/disabled."
  - "Figma hover, active and is focused are drawing controls; the web API exposes default/disabled and native browser interaction. Icon instances are configured through snippets rendered with Svelte @render. Placeholder has no web default. Registry examples select active-set icon names for static previews; Svelte consumers pass configured snippets."
  - "Focus uses a 44-unit frame at (-2,-2), radius/round and a width/thick stroke aligned OUTSIDE in border/primary. CSS preserves the 110% frame and outward stroke; focus is absent from native disabled controls."
  - "Focus is a boolean toggling a Focus ring instance rather than a value of state, which keeps the variant count where it is instead of multiplying it."
  - "The focus frame's dimensions and position are unbound and follow SCALE constraints. Its round radius, stroke width and stroke color are token-bound."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "330-59475"
  last_verified: "2026-10-10"
notes: "The api order is authored for reading, not transcribed. Local surface and icon-colour changes use duration/micro and easing/linear under FND-MOTION-06, reverse from the current colour on interruption and change immediately under reduced motion. Native activation, accessible naming and contextual target separation require verification in the consuming interface."
import:
  batch: 1
  ready: true
