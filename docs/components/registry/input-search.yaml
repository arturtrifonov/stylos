id: "Input Search"
name: "Input Search"
family: "Input"
level: "object"
role: "input"
flow_behavior:
  - "fill"
children:
  - "Avatar"
  - "Badge"
  - "Button Inner"
  - "Chips"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Label"
  - "Link"
  - "Tag"
  - "Loader"
parents:
  - "Accordion"
  - "Alert Inline"
  - "Alert Popup"
  - "Alert Popup Timer"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
notes: "Aligned with Input Text and the reviewed Figma variants on 2026-10-25. The owner approved component readiness on 2026-10-25 after the compact DOM, native clear action, five sizes and form semantics were reviewed. Release-wide accessibility acceptance remains separate."
import:
  batch: 1
  ready: true
status: "ready"
html: "<label>Label text <span>Additional text</span></label><input type=\"search\"><button type=\"button\">Clear</button>"
summary: "A single-line search query field with a persistent label."
purpose: "A native search input with Input Text sizing, defaults, ellipsis, field effects and form semantics. The search icon is always visible; filled editable fields include a local clear button."
use_when:
  - "A single-line search query field with a persistent label."
do_not_use_when:
  -
    text: "The value is chosen from a fixed set rather than typed as a query."
    instead: "Select"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Field height, padding, text and icon sizes. Width belongs to the consumer."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Editing mode. Hover and focus follow the native input; they are not simulated props."
    values:
      -
        value: "default"
      -
        value: "read only"
      -
        value: "disabled"
  -
    name: "value"
    kind: "text"
    default: ""
    description: "Native text value, bindable in Svelte. The Figma input text property maps here; is filled follows whether this value is empty."
  -
    name: "has label"
    kind: "boolean"
    default: true
    description: "Shows the associated Label above the field. When hidden, supply an external label or accessible name."
  -
    name: "label text"
    kind: "text"
    default: "Label"
    description: "Passed to the nested Label and used as the visible field's accessible name."
  -
    name: "has additional text"
    kind: "boolean"
    default: false
    description: "Shows the Label's optional supporting hint. Search has no validation state."
    controls:
      - "additional text"
  -
    name: "additional text"
    kind: "text"
    default: "Additional text"
    description: "Supporting hint, associated with the field through aria-describedby."
  -
    name: "has placeholder"
    kind: "boolean"
    default: false
    description: "Enables the native placeholder. A hint in the supporting line remains visible while typing."
    controls:
      - "placeholder text"
  -
    name: "placeholder text"
    kind: "text"
    default: "Placeholder text"
    description: "Example format for the empty field; does not provide its accessible name."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied leading decorative mark. No placeholder drawing is substituted."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet before the value, normally Icon."
  -
    name: "clear accessible name"
    kind: "text"
    description: "Accessible name of the clear button, for localization. Defaults to Clear followed by the field label or accessible name. The button appears only for a nonempty editable value; it clears value, emits input then change, and returns focus to the input without submitting the form."
  -
    name: "has suffix text"
    kind: "boolean"
    default: false
    description: "Shows a unit or qualifier after the value; it is not part of the submitted value."
    controls:
      - "suffix text"
  -
    name: "suffix text"
    kind: "text"
    default: "Suffix"
    description: "Unit or qualifier, included in the field's accessible description."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native required constraint and the nested Label's required marker."
  -
    name: "id"
    kind: "string"
    description: "Native control ID. A stable instance ID is generated when omitted."
  -
    name: "name"
    kind: "string"
    description: "Native form-data key."
  -
    name: "form"
    kind: "string"
    description: "ID of an external form, when the field is outside it."
  -
    name: "autocomplete"
    kind: "string"
    description: "Native autocomplete hint."
  -
    name: "accessible name"
    kind: "text"
    description: "Nonvisual accessible name when has label is false."
  -
    name: "label ids"
    kind: "string"
    description: "Space-separated external label IDs for aria-labelledby when has label is false."
  -
    name: "description ids"
    kind: "string"
    description: "Additional description IDs, combined with the component's supporting text and suffix."
  -
    name: "oninput"
    kind: "event"
    description: "Native input event; value binding is already updated when the callback runs. Clearing emits one bubbling input event with an empty value."
  -
    name: "onchange"
    kind: "event"
    description: "Native change event when the edited value is committed. Clearing commits the empty value with one bubbling change event after input."
sizing_model:
  horizontal: "fixed"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Same five field heights and text/icon geometry as Input Text. Clear uses the clear_icon footprint for its density; Search uses icon. Width follows the parent layout and has no component width token. The complete value remains available: ellipsis applies outside focus and the native input scrolls while editing."
  sizes:
    -
      size: "extra small"
      field_height: "size/s-3_000"
      padding_inline: "gap/g-1_000"
      gap: "gap/g-0_500"
      stack_gap: "gap/g-0_250"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      label_font_size: "size/0_750"
      label_line_height: "line height/string/0_750"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_000"
      clear_icon: "size/s-1_500"
    -
      size: "small"
      field_height: "size/s-4_000"
      padding_inline: "gap/g-1_250"
      gap: "gap/g-0_625"
      stack_gap: "gap/g-0_375"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      label_font_size: "size/0_875"
      label_line_height: "line height/string/0_875"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_500"
      clear_icon: "size/s-1_750"
    -
      size: "medium"
      field_height: "size/s-5_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_750"
      stack_gap: "gap/g-0_500"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      label_font_size: "size/1_000"
      label_line_height: "line height/string/1_000"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_000"
      clear_icon: "size/s-2_000"
    -
      size: "large"
      field_height: "size/s-6_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_875"
      stack_gap: "gap/g-0_625"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
      label_font_size: "size/1_125"
      label_line_height: "line height/string/1_125"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_500"
      clear_icon: "size/s-2_250"
    -
      size: "extra large"
      field_height: "size/s-7_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-1_000"
      stack_gap: "gap/g-0_750"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
      label_font_size: "size/1_250"
      label_line_height: "line height/string/1_250"
      message_font_size: "size/0_875"
      message_line_height: "line height/string/0_875"
      suffix_font_size: "size/0_875"
      suffix_line_height: "line height/string/0_875"
      icon: "size/s-4_000"
      clear_icon: "size/s-2_500"
a11y:
  -
    status: "requires"
    note: "Supply an associated visible label or, with has label false, label ids or accessible name. Placeholder text is optional guidance and never supplies the accessible name."
  -
    status: "requires"
    note: "Localize clear accessible name when needed. Search and Close drawings are decorative; the native clear button carries the action name and is keyboard reachable while available."
  -
    status: "requires"
    note: "Supporting hints and suffixes are associated through aria-describedby. Read-only and disabled suppress Clear while retaining the value. Search has no validation prop, status mark or aria-invalid state."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4833:15163"
  last_verified: "2026-10-26"
limitations:
  - "Whole-release Chrome/Orca, contrast, two-theme visual and accessibility acceptance remain in packages/ui/verification/0.3.0.md; component readiness does not close that release gate."
  - "Search execution belongs to the enclosing form or oninput/onchange consumer. The trailing search mark is decorative."
  - "Migration from the provisional API: remove validation, has trailing icon and trailing icon; Search is permanent. To retain the former defaults, set size to extra small and has placeholder to true explicitly. Use Input Text when the trailing decorative mark needs to be configurable."
figma_notes:
  - "Figma input text becomes bindable value; is filled follows the value; hover/focus follow the browser. The permanent trailing Search mark is decorative and cannot be hidden or replaced. Button Inner with Close appears before Search for a filled editable value; its footprint follows clear size (12/14/16/18/20 px). Optional suffix text remains distinct from Label supporting text. No result popup, filtering, debounce or submit action belongs to this component."
