# Contract written 2026-08-31 from the live component set. The relations and the
# import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Input Text"
name: "Input Text"
family: "Input"
level: "object"
role: "input"
html: "<label>Label text <span>Additional text</span></label><input type=\"text\">"
status: "ready"
version: "0.1.0"
summary: "A single-line text field with its label, for building forms."
purpose: "A text field is a label, a box, and a message that appears when the value is checked, with room inside the box for a mark and for a unit. They are one component because a field assembled from separate parts spaces itself differently in every form, and because a field built without a place for the message has nowhere to put one when validation is added."
use_when:
  - "A form field takes one line of typed text — a name, a reference, a title, a code."
  - "The field needs a label, and may need to show whether the value passed checking."
do_not_use_when:
  -
    text: "The value runs to more than one line and needs to grow as it is typed."
    instead: "Text Area"
  -
    text: "The value is chosen from a known set rather than typed."
    instead:
      - "Select"
      - "Multiselect"
  -
    text: "The value has a type the browser and the platform already know how to collect, mask, or offer a picker for."
    instead:
      - "Input Email"
      - "Input Password"
      - "Input Number"
      - "Input Date"
      - "Input Search"
children:
  - "Avatar"
  - "Badge"
  - "Button Inner"
  - "Chips"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Label"
  - "Link"
  - "Tag"
  - "Loader"
parents:
  - "Accordion"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Label"
  - "Icon"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "The field needs an accessible name and something has to associate it with the field. Which route is used is the implementation's to choose — see has label — but having none is not a route."
  -
    status: "requires"
    note: "The placeholder is not the label. It disappears as soon as someone types, and it sits at text/tertiary, one step quieter than the value. With has label off, the field still needs a name and it is set on the component rather than left to the placeholder."
  -
    status: "requires"
    note: "validation is drawn as the border colour and the mark in the field, and on error and warning as the supporting message below the name and above the field — and none of them is programmatic. The implementation has to say the field is invalid and tie the message to it, or a person not looking at the colour learns nothing. SC 1.4.1 and SC 3.3.1."
  -
    status: "requires"
    note: "read only and disabled have to be exposed as the different things they are. A read-only field stays reachable, stays selectable and is announced as read-only; a disabled one leaves the tab order and is announced as unavailable. The text role is what separates them on screen, and nothing about the semantics follows from that automatically."
sizing_model:
  horizontal: "fixed"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Width is the one dimension a consumer names — sizing.md lists text-field width among the dimensions usually adjusted — and the 220 the set is authored at is a canvas artifact carrying no meaning, which is why no width token is recorded. Height is not named either: the field is a token height per size, the name and the message above it hug their own text, and the component is the sum. The field run is the Object run its level implies, step for step. The type inside the field follows the Element profile rather than the recommended Object profile. This entry records that chosen mapping. Line heights come from the string family because the field is one line by definition. The label and the message are the nested Label component's own runs and are recorded here only as measured, because they are that component's to decide. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      field_height: "size/s-3_000"
      padding_inline: "gap/g-1_000"
      gap: "gap/g-0_500"
      stack_gap: "gap/g-0_250"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      label_font_size: "size/0_750"
      label_line_height: "line height/string/0_750"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_000"
      validation_icon: "size/s-1_500"
    -
      size: "small"
      field_height: "size/s-4_000"
      padding_inline: "gap/g-1_250"
      gap: "gap/g-0_625"
      stack_gap: "gap/g-0_375"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      label_font_size: "size/0_875"
      label_line_height: "line height/string/0_875"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_500"
      validation_icon: "size/s-1_750"
    -
      size: "medium"
      field_height: "size/s-5_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_750"
      stack_gap: "gap/g-0_500"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      label_font_size: "size/1_000"
      label_line_height: "line height/string/1_000"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_000"
      validation_icon: "size/s-2_000"
    -
      size: "large"
      field_height: "size/s-6_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_875"
      stack_gap: "gap/g-0_625"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
      label_font_size: "size/1_125"
      label_line_height: "line height/string/1_125"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_500"
      validation_icon: "size/s-2_250"
    -
      size: "extra large"
      field_height: "size/s-7_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-1_000"
      stack_gap: "gap/g-0_750"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
      label_font_size: "size/1_250"
      label_line_height: "line height/string/1_250"
      message_font_size: "size/0_875"
      message_line_height: "line height/string/0_875"
      suffix_font_size: "size/0_875"
      suffix_line_height: "line height/string/0_875"
      icon: "size/s-4_000"
      validation_icon: "size/s-2_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Field height, padding, text and icon sizes. Width belongs to the consumer."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Editing mode. Hover and focus follow the native input; they are not simulated props."
    values:
      -
        value: "default"
      -
        value: "read only"
      -
        value: "disabled"
  -
    name: "validation"
    kind: "variant"
    default: "off"
    description: "Consumer-supplied checking result. Error and warning show supporting text; success shows only a mark. Read-only and disabled suppress the outcome. Only error sets aria-invalid; a warning is advisory."
    values:
      -
        value: "off"
      -
        value: "error"
      -
        value: "warning"
      -
        value: "success"
  -
    name: "value"
    kind: "text"
    default: ""
    description: "Native text value, bindable in Svelte. The Figma input text property maps here; is filled follows whether this value is empty."
  -
    name: "has label"
    kind: "boolean"
    default: true
    description: "Shows the associated Label above the field. When hidden, supply an external label or accessible name."
  -
    name: "label text"
    kind: "text"
    default: "Label"
    description: "Passed to the nested Label and used as the visible field's accessible name."
  -
    name: "has additional text"
    kind: "boolean"
    default: false
    description: "Shows the Label's supporting line outside error and warning, which require the line."
    controls:
      - "additional text"
  -
    name: "additional text"
    kind: "text"
    default: "Additional text"
    description: "Hint or validation message, associated with the field through aria-describedby."
  -
    name: "has placeholder"
    kind: "boolean"
    default: false
    description: "Enables the native placeholder. A hint in the supporting line remains visible while typing."
    controls:
      - "placeholder text"
  -
    name: "placeholder text"
    kind: "text"
    default: "Placeholder text"
    description: "Example format for the empty field; does not provide its accessible name."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied leading decorative mark. No placeholder drawing is substituted."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet before the value, normally Icon."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied trailing decorative mark."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet after validation. Not an action slot."
  -
    name: "has suffix text"
    kind: "boolean"
    default: false
    description: "Shows a unit or qualifier after the value; it is not part of the submitted value."
    controls:
      - "suffix text"
  -
    name: "suffix text"
    kind: "text"
    default: "Suffix"
    description: "Unit or qualifier, included in the field's accessible description."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native required constraint and the nested Label's required marker."
  -
    name: "id"
    kind: "string"
    description: "Native control ID. A stable instance ID is generated when omitted."
  -
    name: "name"
    kind: "string"
    description: "Native form-data key."
  -
    name: "form"
    kind: "string"
    description: "ID of an external form, when the field is outside it."
  -
    name: "autocomplete"
    kind: "string"
    description: "Native autocomplete hint."
  -
    name: "accessible name"
    kind: "text"
    description: "Nonvisual accessible name when has label is false."
  -
    name: "label ids"
    kind: "string"
    description: "Space-separated external label IDs for aria-labelledby when has label is false."
  -
    name: "description ids"
    kind: "string"
    description: "Additional description IDs, combined with the component's supporting text and suffix."
  -
    name: "oninput"
    kind: "event"
    description: "Native input event; value binding is already updated when the callback runs."
  -
    name: "onchange"
    kind: "event"
    description: "Native change event when the edited value is committed."
limitations:
  - "One line, always. The native input stays on one line. Long values scroll while editing and selection; unfocused text uses an ellipsis where the browser supports it."
  - "validation exists only on default, hover and active / focus. A read-only or disabled field carries no outcome, so a form re-rendered read-only after a failed submit has nowhere to keep the error."
  - "is required sets the native constraint and passes the marker to Label. With has label off, the consumer supplies the visible required indication with its external label."
  - "No character count or clear control. Leading and trailing slots are decorative; they do not support focusable actions."
  - "The placeholder measures 4.76:1 in light mode against a required 4.5:1. It passes, and it cannot be strengthened: a darker placeholder reads as a value already entered. Faint or ambiguous is the whole choice available."
  - "The disabled value measures 2.05:1 in light mode. SC 1.4.3 exempts disabled controls, so this fails nothing, and it is the system-wide disabled contrast already known to need lifting."
  - "The label's own size run diverges from the field's at large and extra large — the field goes to 1_250 and 1_500 where the label goes to 1_125 and 1_250. That belongs to Label and is recorded here only as measured."
figma_notes:
  - "Vertical trim checked on 2026-10-10: leadingTrim=NONE on all 480 text layers across 140 variants. No text-box trimming is applied."
  - "Web mapping: hover/focus follow the native input; value replaces input text and determines is filled. Nested Label properties are forwarded through the field API."
  - "read only is modelled as a value of state because a separate property would need none of hover, focus or validation and would have to exclude every state but default. It is a mode, and state is where Figma can hold it cheaply."
  - "The label's words and the message's words are properties of the nested Label instance rather than of this component, because Figma cannot push a value deeper without a variable for the whole file. Figma surfaces them on the instance instead. In @stylos/ui the label is set on Input Text and passed down."
  - "state and validation both drive the nested Label by swapping its variant. On success the Label is left on validation off, which is how the rule that success carries no message is expressed."
  - "The placeholder sits in a wrapper so the field row keeps its width when the placeholder is switched off."
  - "Focus uses the existing focus/base style through --stylos-focus-base: a four-unit primary halo plus two shadow layers (0/2/3/0 primary and 0/4/4/0 base), replacing resting elevation-1. The style is recorded separately in tokens/_styles.yaml because Figma variable exports omit effect styles. It applies on pointer and keyboard focus in every validation state; read-only and disabled modes keep their own surfaces. Border colour transitions on hover, focus and return with duration/micro and easing/linear. Resting and focus effects crossfade through opacity with the same tokens, preserving their full geometry without growth or visual delay. Interrupted transitions continue from their current presentation; reduced motion makes the change immediate."
  - "The leading, trailing and validation icon containers bind their width to a local collection named icon size, outside tokens/, while their heights bind to the dimension scale. The icon footprints recorded in sizes above are the tokens."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4392:6011"
  last_verified: "2026-10-10"
notes: "The api order is authored for readability: Figma's componentPropertyDefinitions does not return the order the panel shows, so adjacency under naming.md sections 9 and 10 cannot be checked from the file and is not claimed. The variant properties themselves are ordered size, state, validation, is filled, which is section 8's order."
import:
  batch: 1
  ready: true
