# Contract written 2026-08-31 from the live component set. The relations and the
# import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Input Text"
name: "Input Text"
family: "Input"
level: "object"
role: "input"
html: "<label>Label text <span>Additional text</span></label><input type=\"text\">"
status: "draft"
version: "0.1"
summary: "A single-line text field with its label, for building forms."
purpose: "A text field is a label, a box, and a message that appears when the value is checked, with room inside the box for a mark and for a unit. They are one component because a field assembled from separate parts spaces itself differently in every form, and because a field built without a place for the message has nowhere to put one when validation is added."
use_when:
  - "A form field takes one line of typed text — a name, a reference, a title, a code."
  - "The field needs a label, and may need to show whether the value passed checking."
do_not_use_when:
  -
    text: "The value runs to more than one line and needs to grow as it is typed."
    instead: "Text Area"
  -
    text: "The value is chosen from a known set rather than typed."
    instead:
      - "Select"
      - "Multiselect"
  -
    text: "The value has a type the browser and the platform already know how to collect, mask, or offer a picker for."
    instead:
      - "Input Email"
      - "Input Password"
      - "Input Number"
      - "Input Date"
      - "Input Search"
children:
  - "Avatar"
  - "Badge"
  - "Button Inner"
  - "Chips"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Label"
  - "Link"
  - "Tag Fill"
  - "Tag Outline"
  - "Loader"
parents:
  - "Accordion"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Side Panel"
  - "Side Panel Menu"
uses:
  - "Label"
  - "Icon"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "The field needs an accessible name and something has to associate it with the field. Which route is used is the implementation's to choose — see has label — but having none is not a route."
  -
    status: "requires"
    note: "The placeholder is not the label. It disappears as soon as someone types, and it sits at text/tertiary, one step quieter than the value. With has label off, the field still needs a name and it is set on the component rather than left to the placeholder."
  -
    status: "requires"
    note: "validation is drawn as the border colour and the mark in the field, and on error and warning as the message above the label — and none of them is programmatic. The implementation has to say the field is invalid and tie the message to it, or a person not looking at the colour learns nothing. SC 1.4.1 and SC 3.3.1."
  -
    status: "requires"
    note: "read only and disabled have to be exposed as the different things they are. A read-only field stays reachable, stays selectable and is announced as read-only; a disabled one leaves the tab order and is announced as unavailable. The text role is what separates them on screen, and nothing about the semantics follows from that automatically."
sizing_model:
  horizontal: "fixed"
  vertical: "hug"
  adjustable: true
  intent: "Width is the one dimension a consumer names — sizing.md lists text-field width among the dimensions usually adjusted — and the 220 the set is authored at is a canvas artifact carrying no meaning, which is why no width token is recorded. Height is not named either: the field is a token height per size, the name and the message above it hug their own text, and the component is the sum. The field run is the Object run its level implies, step for step. The type inside the field follows the Element profile rather than the Object one its level would give it. This entry is that documented mapping and overrides the level default per typography.md. Line heights come from the string family because the field is one line by definition. The label and the message are the nested Label component's own runs and are recorded here only as measured, because they are that component's to decide. Resolve token values with npm run tokens:report."
  sizes:
    -
      size: "extra small"
      field_height: "size/s-3_000"
      padding_inline: "gap/g-1_000"
      gap: "gap/g-0_500"
      stack_gap: "gap/g-0_250"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      label_font_size: "size/0_750"
      label_line_height: "line height/string/0_750"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_000"
      validation_icon: "size/s-1_500"
    -
      size: "small"
      field_height: "size/s-4_000"
      padding_inline: "gap/g-1_250"
      gap: "gap/g-0_625"
      stack_gap: "gap/g-0_375"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      label_font_size: "size/0_875"
      label_line_height: "line height/string/0_875"
      message_font_size: "size/0_625"
      message_line_height: "line height/string/0_625"
      suffix_font_size: "size/0_625"
      suffix_line_height: "line height/string/0_625"
      icon: "size/s-2_500"
      validation_icon: "size/s-1_750"
    -
      size: "medium"
      field_height: "size/s-5_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_750"
      stack_gap: "gap/g-0_500"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      label_font_size: "size/1_000"
      label_line_height: "line height/string/1_000"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_000"
      validation_icon: "size/s-2_000"
    -
      size: "large"
      field_height: "size/s-6_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_875"
      stack_gap: "gap/g-0_625"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
      label_font_size: "size/1_125"
      label_line_height: "line height/string/1_125"
      message_font_size: "size/0_750"
      message_line_height: "line height/string/0_750"
      suffix_font_size: "size/0_750"
      suffix_line_height: "line height/string/0_750"
      icon: "size/s-3_500"
      validation_icon: "size/s-2_250"
    -
      size: "extra large"
      field_height: "size/s-7_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-1_000"
      stack_gap: "gap/g-0_750"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
      label_font_size: "size/1_250"
      label_line_height: "line height/string/1_250"
      message_font_size: "size/0_875"
      message_line_height: "line height/string/0_875"
      suffix_font_size: "size/0_875"
      suffix_line_height: "line height/string/0_875"
      icon: "size/s-4_000"
      validation_icon: "size/s-2_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "Field density. Drives the field height, its padding and gap, the type in it and both icon runs. It does not set the width."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Where the field is in the interaction, and — for two of the values — whether it can be edited at all. The values are not all the same kind of thing, and that is deliberate: see the note on each."
    values:
      -
        value: "default"
      -
        value: "hover"
        note: "The border takes the primary role."
      -
        value: "active / focus"
        note: "One value, not two. On a text field pressing is focusing, so a separate active treatment would only fire while text is being selected inside the field — restyling the field mid-drag. This is the case where focus does not need mixing with anything else, which is why the selection controls answer the same question the other way: there focus coexists with checked and with hover, here it does not."
      -
        value: "read only"
        note: "The value is shown and cannot be edited. It carries no validation outcome, because there is nothing to check in a value that cannot be changed."
      -
        value: "disabled"
        note: "Not applicable now, against read only, which is applicable and settled. The label and the value both take the disabled text role, and the field leaves the tab order."
  -
    name: "validation"
    kind: "variant"
    default: "off"
    description: "What checking the value said. It colours the border and puts a mark in the field. On error and warning it also switches the message above the label; on success it does not — see that value. The message is above the field rather than below it because suggestion lists, dropdowns and pickers open below the field and would cover it. Only default, hover and active / focus carry validation — see limitations."
    values:
      -
        value: "off"
        note: "Nothing has been checked, or nothing was wrong. Not the same as success."
      -
        value: "error"
        note: "Carries the message with it, because a person who has to fix something needs to be told what."
      -
        value: "warning"
        note: "Carries the message with it."
      -
        value: "success"
        note: "The mark in the field and nothing else. The label stays in its default treatment and no message appears, because a field that is simply correct rarely has anything to say beyond being correct — and success is rare enough that the mark carries it. Where there is something to say, the supporting line is switched on deliberately."
  -
    name: "is filled"
    kind: "variant"
    default: "false"
    description: "Whether the field holds a value. It swaps the placeholder for the value and takes the text from tertiary to base; it changes nothing else."
    values:
      -
        value: "false"
      -
        value: "true"
  -
    name: "has leading icon"
    kind: "boolean"
    default: "false"
    description: "Whether a mark sits before the value — the kind of thing the field wants, a currency, a protocol."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    default: "Placeholder"
    description: "Which mark leads. Named for the meaning the set carries, not for a drawing."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: "false"
    description: "Whether a mark sits after the value. The component draws it and gives it no behaviour: anything pressable there is the consumer's to supply."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    default: "Placeholder"
    description: "Which mark trails."
  -
    name: "has label"
    kind: "boolean"
    default: "true"
    description: "Whether the name of the field is shown above it. On by default, because a field without a visible name is the exception. Three routes give the field its name: the label is passed to the component, which associates it; a label is authored outside the component and associated with the field; or the context makes the field obvious and the name is supplied without being shown. Turning this off rules out the first and leaves the other two — it does not remove the need for a name."
  -
    name: "has placeholder"
    kind: "boolean"
    default: "false"
    description: "Whether the empty field shows a placeholder. Off by default. The recommendation is to put the hint in the label's additional text instead, because a placeholder clears at the first keystroke and takes the hint with it. Reach for it rarely — somewhere between the field that needs no hint and the field that is unusable without one."
    controls:
      - "placeholder text"
  -
    name: "placeholder text"
    kind: "text"
    default: "Placeholder text"
    description: "What stands in the empty field when has placeholder is on. An example of the format, not a repeat of the label and not an instruction. It cannot be strengthened past text/tertiary without reading as a value already entered, so it is either faint or ambiguous — the other half of the argument for keeping the hint in the additional text. One line, truncated with an ellipsis."
    examples:
      -
        verdict: "do"
        props:
          "placeholder text": "INV-2026-0184"
      -
        verdict: "dont"
        caption: "The label's job, done in the place that empties itself."
        props:
          "placeholder text": "Invoice number"
  -
    name: "input text"
    kind: "text"
    default: "Input text"
    description: "The value, shown when is filled is true. One line, truncated with an ellipsis rather than wrapped or scrolled."
  -
    name: "has suffix text"
    kind: "boolean"
    default: "false"
    description: "Whether a short quiet string sits at the end of the field, inside it."
    controls:
      - "suffix text"
  -
    name: "suffix text"
    kind: "text"
    default: "Suffix"
    description: "The unit or qualifier the value is in — a currency, kg, per month. It sits in the secondary text role at the message's measure, inside the field and after the value, and it is not part of what the person typed."
limitations:
  - "One line, always. Both the placeholder and the value truncate with an ellipsis; there is no wrapping and no scrolling within the field."
  - "validation exists only on default, hover and active / focus. A read-only or disabled field carries no outcome, so a form re-rendered read-only after a failed submit has nowhere to keep the error."
  - "Marking a field required belongs to the label, not to the field: the component passes it on and the label carries the marker, so there is no is required here. A required field with has label off has nowhere to show it, and that shape is not supported."
  - "No character count, no clear control and no behaviour on the trailing icon. Each is drawn if the consumer supplies it and none is modelled."
  - "The placeholder measures 4.76:1 in light mode against a required 4.5:1. It passes, and it cannot be strengthened: a darker placeholder reads as a value already entered. Faint or ambiguous is the whole choice available."
  - "The disabled value measures 2.05:1 in light mode. SC 1.4.3 exempts disabled controls, so this fails nothing, and it is the system-wide disabled contrast already known to need lifting."
  - "The label's own size run diverges from the field's at large and extra large — the field goes to 1_250 and 1_500 where the label goes to 1_125 and 1_250. That belongs to Label and is recorded here only as measured."
figma_notes:
  - "read only is modelled as a value of state because a separate property would need none of hover, focus or validation and would have to exclude every state but default. It is a mode, and state is where Figma can hold it cheaply."
  - "The label's words and the message's words are properties of the nested Label instance rather than of this component, because Figma cannot push a value deeper without a variable for the whole file. Figma surfaces them on the instance instead. In @stylos/ui the label is set on Input Text and passed down."
  - "state and validation both drive the nested Label by swapping its variant. On success the Label is left on validation off, which is how the rule that success carries no message is expressed."
  - "The placeholder sits in a wrapper so the field row keeps its width when the placeholder is switched off."
  - "Focus is a third drop shadow on top of the two the resting field already carries, rather than a change of border weight."
  - "The leading, trailing and validation icon containers bind their width to a local collection named icon size, outside tokens/, while their heights bind to the dimension scale. The icon footprints recorded in sizes above are the tokens."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4392:6011"
  last_verified: "2026-08-31"
notes: "The api order is authored for readability: Figma's componentPropertyDefinitions does not return the order the panel shows, so adjacency under naming.md sections 9 and 10 cannot be checked from the file and is not claimed. The variant properties themselves are ordered size, state, validation, is filled, which is section 8's order."
import:
  batch: 1
  ready: true
