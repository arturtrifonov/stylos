id: "Text Area"
name: "Text Area"
family: "Input"
level: "object"
role: "input"
flow_behavior:
  - "fill"
children:
  - "Avatar"
  - "Badge"
  - "Button Inner"
  - "Chips"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Label"
  - "Link"
  - "Tag"
  - "Loader"
parents:
  - "Accordion"
  - "Alert Inline"
  - "Alert Popup"
  - "Alert Popup Timer"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
notes: "Owner-directed component review completed 2026-10-26 against the updated Figma set. Counter sizes 10/10/12/12/14 and the counter-off default were confirmed by the owner; Figma was left unchanged during implementation. Scoped evidence: packages/ui/verification/text-area-2026-10-26.md."
import:
  batch: 1
  ready: true
status: "ready"
html: "<label>Label text <span>Additional text</span></label><textarea></textarea>"
summary: "A labelled, resizable multiline text field."
purpose: "Collect multiline product content with native editing, form submission, validation and reset."
use_when:
  - "A labelled, resizable multiline text field."
do_not_use_when:
  -
    text: "The value takes one line and does not need multiline editing."
    instead: "Input Text"
api:
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "Field height, padding, text and icon sizes. Width belongs to the consumer."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Editing mode. Hover and focus follow the native input; they are not simulated props."
    values:
      -
        value: "default"
      -
        value: "read only"
      -
        value: "disabled"
  -
    name: "validation"
    kind: "variant"
    default: "off"
    description: "Consumer-supplied checking result, overlaid without reserving text width. Error and warning show supporting text; success shows only a mark. Read-only and disabled suppress the outcome. Only error sets aria-invalid; a warning is advisory."
    values:
      -
        value: "off"
      -
        value: "error"
      -
        value: "warning"
      -
        value: "success"
  -
    name: "value"
    kind: "text"
    default: ""
    description: "Native text value, bindable in Svelte. The Figma input text property maps here; is filled follows whether this value is empty."
  -
    name: "has label"
    kind: "boolean"
    default: true
    description: "Shows the associated Label above the field. When hidden, supply an external label or accessible name."
  -
    name: "label text"
    kind: "text"
    default: "Label"
    description: "Passed to the nested Label and used as the visible field's accessible name."
  -
    name: "has additional text"
    kind: "boolean"
    default: false
    description: "Shows the Label's supporting line outside error and warning, which require the line."
    controls:
      - "additional text"
  -
    name: "additional text"
    kind: "text"
    default: "Additional text"
    description: "Hint or validation message, associated with the field through aria-describedby."
  -
    name: "has placeholder"
    kind: "boolean"
    default: false
    description: "Enables the native placeholder. A hint in the supporting line remains visible while typing."
    controls:
      - "placeholder text"
  -
    name: "placeholder text"
    kind: "text"
    default: "Placeholder text"
    description: "Example format for the empty field; does not provide its accessible name."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied leading decorative mark. No placeholder drawing is substituted."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet before the value, normally Icon."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: false
    description: "Shows the supplied trailing decorative mark."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "Decorative snippet at the upper trailing edge. Not an action slot."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native required constraint and the nested Label's required marker."
  -
    name: "id"
    kind: "string"
    description: "Native control ID. A stable instance ID is generated when omitted."
  -
    name: "name"
    kind: "string"
    description: "Native form-data key."
  -
    name: "form"
    kind: "string"
    description: "ID of an external form, when the field is outside it."
  -
    name: "autocomplete"
    kind: "string"
    description: "Native autocomplete hint."
  -
    name: "accessible name"
    kind: "text"
    description: "Nonvisual accessible name when has label is false."
  -
    name: "label ids"
    kind: "string"
    description: "Space-separated external label IDs for aria-labelledby when has label is false."
  -
    name: "description ids"
    kind: "string"
    description: "Additional description IDs, combined with the component's supporting text and counter."
  -
    name: "oninput"
    kind: "event"
    description: "Native input event; value binding is already updated when the callback runs."
  -
    name: "onchange"
    kind: "event"
    description: "Native change event when the edited value is committed."
  -
    name: "has counter text"
    kind: "boolean"
    description: "Show the count beneath the textarea. By default it derives from the native value and optional maxlength; counter text can override its display."
    default: false
    controls:
      - "counter text"
  -
    name: "counter text"
    kind: "text"
    description: "Optional custom counter display. When omitted, show the UTF-16 length of the value, with / maxlength only when a valid limit exists. CR and CRLF count as native LF. This display never enforces a limit."
  -
    name: "maxlength"
    kind: "number"
    description: "Optional native maximum number of UTF-16 code units. Accepts nonnegative integers, including zero; missing, negative or fractional values impose no limit. Existing over-limit values are not silently truncated."
  -
    name: "minlength"
    kind: "number"
    description: "Optional native minimum UTF-16 length for validation. Accepts nonnegative integers; missing, negative or fractional values are ignored. When both limits exist, supply minlength less than or equal to maxlength."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: true
  intent: "Five density presets set three initial native lines: two body line heights plus the matching single-line field height. Native vertical resizing can reduce the field to one line. The parent controls width. The validation indicator overlays the content without reserving text width; its glyph and backdrop align with Input Text. Optional leading and trailing snippets still reserve space. Icon gaps and top alignment follow the multiline design; native overflow and resizing replace its static scrollbar and handle drawings."
  sizes:
    -
      size: "extra small"
      counter_height: "line height/string/0_625"
      icon: "size/s-2_000"
      validation_icon: "size/s-1_500"
      gap: "gap/g-0_750"
      stack_gap: "gap/g-0_500"
      counter_font_size: "size/0_625"
      counter_line_height: "line height/string/0_625"
      padding_x: "gap/g-1_000"
      padding_y: "gap/g-0_500"
      font_size: "size/0_875"
      line_height: "line height/text/0_875"
    -
      size: "small"
      counter_height: "line height/string/0_750"
      icon: "size/s-2_500"
      validation_icon: "size/s-1_750"
      gap: "gap/g-0_875"
      stack_gap: "gap/g-0_625"
      counter_font_size: "size/0_625"
      counter_line_height: "line height/string/0_625"
      padding_x: "gap/g-1_250"
      padding_y: "gap/g-0_750"
      font_size: "size/1_125"
      line_height: "line height/text/1_125"
    -
      size: "medium"
      counter_height: "line height/string/0_750"
      icon: "size/s-3_000"
      validation_icon: "size/s-2_000"
      gap: "gap/g-1_000"
      stack_gap: "gap/g-0_750"
      counter_font_size: "size/0_750"
      counter_line_height: "line height/string/0_750"
      padding_x: "gap/g-1_500"
      padding_y: "gap/g-1_000"
      font_size: "size/1_375"
      line_height: "line height/text/1_375"
    -
      size: "large"
      counter_height: "line height/string/0_875"
      icon: "size/s-3_500"
      validation_icon: "size/s-2_250"
      gap: "gap/g-1_250"
      stack_gap: "gap/g-0_875"
      counter_font_size: "size/0_750"
      counter_line_height: "line height/string/0_750"
      padding_x: "gap/g-2_000"
      padding_y: "gap/g-1_250"
      font_size: "size/1_625"
      line_height: "line height/text/1_625"
    -
      size: "extra large"
      counter_height: "line height/string/0_875"
      icon: "size/s-4_000"
      validation_icon: "size/s-2_500"
      gap: "gap/g-1_500"
      stack_gap: "gap/g-1_000"
      counter_font_size: "size/0_875"
      counter_line_height: "line height/string/0_875"
      padding_x: "gap/g-2_500"
      padding_y: "gap/g-1_500"
      font_size: "size/1_875"
      line_height: "line height/text/1_875"
a11y:
  -
    status: "requires"
    note: "Supply an associated visible label or, with has label false, label ids or accessible name. Placeholder text never provides the accessible name."
  -
    status: "requires"
    note: "Provide meaningful error and warning messages. Error sets aria-invalid; messages and an enabled nonempty counter join external description ids through aria-describedby. Counter text alone does not constrain input."
  -
    status: "requires"
    note: "Read-only remains focusable and selectable; disabled follows native tab-order and form-data rules. The consumer chooses required, minlength and maxlength constraints and exposes any application validation result."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4780:26517"
  last_verified: "2026-10-26"
limitations:
  - "Whole-release Chrome/Orca, contrast and two-theme accessibility acceptance remain in packages/ui/verification/0.3.0.md; this component review does not close those gates."
  - "Migration: Medium replaces XS as default; placeholder and counter default off. Length limits are numeric props. Counter text is optional custom copy; omitting it derives a live count, with no implicit maximum."
figma_notes:
  - "Figma is filled and hover/focus are derived web states. Counter text is a Figma display sample; the web derives a live count unless a consumer supplies custom text. Only native maxlength enforces a maximum. Native scrollbars and resize affordance replace static Figma drawings; shared native scrollbar CSS is reused. Existing field effects and Label are composed. Validation overlays the text without changing its available width; optional trailing content keeps its own reserve and the status moves before it."
