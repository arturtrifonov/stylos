id: "Alert Popup"
name: "Alert Popup"
level: "object"
role: "trigger"
status: "draft"
html: "<section>Notification and actions</section>"
summary: "A floating notification."
purpose: "Give product notifications a shared visual and interaction contract while their designs remain provisional."
use_when:
  - "A floating notification."
do_not_use_when:
  -
    text: "A decision must block interaction with the page."
    instead: "Modal"
api:
  -
    name: "size"
    kind: "variant"
    description: "The five current Figma density presets; the consumer owns available width."
    default: "extra small"
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "type"
    kind: "variant"
    description: "Semantic notification type. Legacy Figma Info maps to default and Error maps to danger."
    default: "default"
    values:
      -
        value: "default"
      -
        value: "warning"
      -
        value: "danger"
      -
        value: "success"
  -
    name: "is open"
    kind: "boolean"
    description: "Bindable presence. Closing hides this notification and does not steal focus."
    default: true
  -
    name: "has heading"
    kind: "boolean"
    description: "Show the heading."
    default: true
    controls:
      - "heading text"
  -
    name: "heading text"
    kind: "text"
    description: "Notification heading."
    default: "Heading Text"
  -
    name: "has icon"
    kind: "boolean"
    description: "Show the consumer-configured decorative icon."
    default: true
    controls:
      - "icon"
  -
    name: "icon"
    kind: "instance"
    description: "Configured semantic mark; an unconfigured Figma placeholder is not a product icon."
    svelte_type: "snippet"
  -
    name: "has content"
    kind: "boolean"
    description: "Show the content slot."
    default: true
    controls:
      - "content slot"
  -
    name: "content slot"
    kind: "slot"
    description: "Notification details; no product-specific fallback copy is inserted."
  -
    name: "has buttons"
    kind: "boolean"
    description: "Show primary and secondary actions."
    default: true
    controls:
      - "primary button text"
      - "secondary button text"
  -
    name: "primary button text"
    kind: "text"
    description: "Primary action label; the consumer owns its effect."
    default: "Accept"
  -
    name: "secondary button text"
    kind: "text"
    description: "Secondary action label; the consumer owns its effect."
    default: "Cancel"
  -
    name: "has close button"
    kind: "boolean"
    description: "Show the native dismiss action."
    default: true
    controls:
      - "close accessible name"
  -
    name: "close accessible name"
    kind: "text"
    description: "Accessible name of the icon-only dismiss action."
    default: "Close"
  -
    name: "announcement"
    kind: "variant"
    description: "Consumer selects urgency independently of visual type; initial static content may need an enclosing live region."
    default: "polite"
    values:
      -
        value: "polite"
      -
        value: "assertive"
      -
        value: "off"
  -
    name: "onprimaryclick"
    kind: "event"
    description: "Native primary action click."
  -
    name: "onsecondaryclick"
    kind: "event"
    description: "Native secondary action click."
  -
    name: "onclose"
    kind: "event"
    description: "Close event after the bound is open becomes false."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Five Popup densities; width follows the host and height hugs the content. Each row records the icon footprint and heading typography. The icon and close containers take the heading's single-line height and centre their marks within it, even when the title wraps or is hidden. Body text uses text/base at the matching size; actions use matching-size Buttons and Modal's button-gap profile. Floating placement, stacking and lifetime belong to the consumer."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_500"
      padding_x: "gap/g-1_500"
      padding_y: "gap/g-1_500"
      gap: "gap/g-1_000"
      font_size: "size/1_125"
      line_height: "line height/heading/1_125"
    -
      size: "small"
      box: "size/s-3_000"
      padding_x: "gap/g-1_750"
      padding_y: "gap/g-1_750"
      gap: "gap/g-1_000"
      font_size: "size/1_250"
      line_height: "line height/heading/1_250"
    -
      size: "medium"
      box: "size/s-3_500"
      padding_x: "gap/g-2_000"
      padding_y: "gap/g-2_000"
      gap: "gap/g-1_250"
      font_size: "size/1_500"
      line_height: "line height/heading/1_500"
    -
      size: "large"
      box: "size/s-4_000"
      padding_x: "gap/g-2_500"
      padding_y: "gap/g-2_500"
      gap: "gap/g-1_250"
      font_size: "size/1_750"
      line_height: "line height/heading/1_750"
    -
      size: "extra large"
      box: "size/s-4_500"
      padding_x: "gap/g-3_000"
      padding_y: "gap/g-3_000"
      gap: "gap/g-1_500"
      font_size: "size/2_000"
      line_height: "line height/heading/2_000"
a11y:
  -
    status: "requires"
    note: "Supply meaningful names and content. Keyboard and native semantics are implemented, but manual Chrome/Orca evaluation and contrast review are pending."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "1820:140371"
  last_verified: "2026-10-25"
limitations:
  - "Provisional product integration: status stays draft even when code exists. API, design alignment and accessibility require subsequent review."
  - "Popup is a notification surface, not a modal dialog; it neither traps focus nor implements an overlay queue."
  - "Timer retains legacy Figma geometry. Existing Stylos Buttons and fonts replace its obsolete nested button/font definitions."
notes: "Owner-directed starting-set expansion, 2026-10-17. Popup geometry reviewed against the redesigned XS and remaining variants on 2026-10-25. Heading line heights follow FND-TYPOGRAPHY-14; the adjacent icon and close containers bind to the same token. This is not a Ready to publish assessment."
children:
  - "Avatar"
  - "Badge"
  - "Button"
  - "Button Inner"
  - "Button Dropdown"
  - "Button Group"
  - "Button Icon"
  - "Checkbox Input"
  - "Checkbox Label"
  - "Checkbox Text"
  - "Code Snippet"
