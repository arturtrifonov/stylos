# Unified frontend contract, approved 2026-10-10.
# Separate authored Figma sets are mapped explicitly in figma.sources.
id: "Tag"
name: "Tag"
family: "Tag"
level: "element"
role: "content"
html: "span"
status: "ready"
version: "0.1.0"
summary: "A short non-interactive label with fill and outline treatments."
purpose: "Classify content with a short label. fill gives it a solid band; outline uses a subtle surface with an inside border. Both treatments share sizing, text case and decorative icon slots."
use_when:
  - "A short word or two classifies the thing it sits on — a status, a category, an owner — and the reader takes it in without reading it as a sentence."
do_not_use_when:
  -
    text: "The label performs an action when activated."
    instead: "Tag Interactive"
  -
    text: "The mark is a count, or a dot that says only that something is there. A tag carries a word; those carry a quantity or a presence and are sized for the corner of something else."
    instead:
      - "Badge"
      - "Indicator Status"
children:
  - "Icon"
  - "Button Inner"
  - "Badge"
  - "Indicator Status"
  - "Indicator Special"
  - "Loader"
parents:
  - "Accordion"
  - "Accordion Header"
  - "Asset"
  - "Button"
  - "Button Dropdown"
  - "Button Group"
  - "Button Icon"
  - "Code Editor Text Area"
  - "Edit Mode"
  - "Input Text"
  - "Input Date"
  - "Input Search"
  - "Input Number"
  - "Input Color"
  - "Input Datetime"
  - "Input Email"
  - "Input Password"
  - "Input Time"
  - "Input Telephone"
  - "Input URL"
  - "Multiselect"
  - "Select"
  - "Select Cascade"
  - "Text Area"
  - "Table Cell Tags"
  - "Tab Item"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
flow_behavior:
  - "hug"
a11y:
  -
    status: "requires"
    note: "The uppercase value is a transform, not typed capitals — the characters stay as they were written. An implementation has to do the same and change the case in CSS, because typing the label in capitals changes the accessible name as well as the appearance, and a screen reader may then spell it out letter by letter."
sizing_model:
  horizontal: "hug"
  vertical: "fixed"
  adjustable:
    horizontal: false
    vertical: false
  intent: "The height is authored on the Element run and the width is whatever the label needs, so a tag is a fixed band of a known height wrapping a variable word. The type run uses a component-specific mapping rather than the recommended Element profile: one step below it at every size, topping out at a measure the profile does not carry; this entry records that choice. Horizontal padding and the gap have their own runs; the radius does not move with size, because a tag reads as the same shape at every size rather than a shape that rounds off as it grows."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
      padding_inline: "gap/g-0_875"
      gap: "gap/g-0_500"
      font_size: "size/0_625"
      line_height: "line height/string/0_625"
      icon: "size/s-1_500"
    -
      size: "small"
      box: "size/s-2_500"
      padding_inline: "gap/g-1_000"
      gap: "gap/g-0_625"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      icon: "size/s-1_750"
    -
      size: "medium"
      box: "size/s-3_000"
      padding_inline: "gap/g-1_250"
      gap: "gap/g-0_750"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      icon: "size/s-2_000"
    -
      size: "large"
      box: "size/s-3_500"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_875"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
      icon: "size/s-2_250"
    -
      size: "extra large"
      box: "size/s-4_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-1_000"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
      icon: "size/s-2_500"
api:
  -
    name: "tone"
    kind: "variant"
    default: "base"
    description: "Semantic colour role. fill uses inverted text on a bold band; outline uses the corresponding text and border roles on a subtle band."
    values:
      -
        value: "base"
        note: "No meaning of its own — a category, an owner, a name. The one to reach for when the tag classifies rather than warns."
      -
        value: "primary"
      -
        value: "warning"
      -
        value: "danger"
      -
        value: "success"
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "The band height, and with it the label measure, the padding, the gap and the icon slots. A tag is sized to sit beside the content it labels rather than to be read on its own, which is why the run starts smaller than anything else at this level."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "text case"
    kind: "variant"
    default: "uppercase"
    description: "Whether the label is set in capitals. uppercase transforms it and widens the letter spacing to match; original leaves it exactly as written. The value names what happens to the text, not what the text becomes — original is not lower case, it is no change."
    values:
      -
        value: "uppercase"
        note: "The default. Capitals and the wider tracking make a short label read as a marker rather than as a word in the sentence around it."
      -
        value: "original"
        note: "For labels whose case carries meaning — a proper noun, a product name, an identifier that would be wrong in capitals."
  -
    name: "variant"
    kind: "variant"
    default: "fill"
    description: "Visual treatment mapped to an existing Figma component set. It preserves the shared behaviour and geometry."
    values:
      -
        value: "fill"
        note: "A short label on a filled band, in one of five tones."
      -
        value: "outline"
        note: "A short label on a tinted band with a border, in one of five tones."
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows a mark before the label. Off by default: a tag is its word, and a mark in front is for the cases where the category has a symbol a reader already knows."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "The mark shown before the label. It qualifies the word rather than replacing it, so a tag whose meaning rests on the mark alone is a tag with the wrong label."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: false
    description: "Shows a mark after the label. This is the side for a mark that points outward — that the tag links somewhere, or that more follows."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    svelte_type: "snippet"
    description: "The mark shown after the label, on the same terms as the leading one. It is not a remove control: nothing here is interactive."
  -
    name: "label text"
    kind: "text"
    default: "Tag"
    examples:
      -
        verdict: "do"
        caption: "A category with a supporting decorative icon."
        props:
          "label text": "Category"
          "has leading icon": true
          "leading icon": "check"
    description: "Short classification label supplied in its original case."
limitations:
  - "No state. Nothing here responds to a pointer or a key, which is the whole difference from the interactive members of the family."
  - "The base tone measures 4.55:1 against its own label in light mode, which clears the 4.5:1 the label needs by less than rounding. Any move of surface/bold/base/default or text/inverted is a contrast change, not a colour change."
  - "The trailing icon is a mark, not a control. A tag that needs to be dismissed is a different component."
figma_notes:
  - "Label typography uses family/normal, weight/emphasis and the recorded size/string-line-height runs. Uppercase and original use the matching letter-spacing/style token. Vertical trim checked on 2026-10-10: leadingTrim=CAP_HEIGHT on all 50 label layers, including both text cases. Native text-box-trim:trim-both and text-box-edge:cap alphabetic match that component setting. The tag-specific rule is guarded by @supports; unsupported browsers retain centred normal line boxes. No manual label offset is applied."
  - "Verified 2026-10-10 on Tag page 25:1620: five sizes, five tones and uppercase/original. Figma defaults to medium/base/uppercase; icon containers are hidden by default, have widths 10/12/14/16/18 and hold icons 12/14/16/18/20. Leading icons overhang outward by 2; trailing icons start at the slot origin. CSS uses gap/g-0_250 for this optical correction."
  - "The local icon container width collection is not exported. CSS derives the same widths from the icon dimension token minus gap/g-0_250. Icon snippets are configured by the consumer, with no Placeholder default; registry icon examples select active-set names for static previews."
  - "The owner approved one frontend component for these separate Figma sets on 2026-10-10. variant is a web integration property; Figma names and nodes stay unchanged. Each visual treatment preserves its original tokens, geometry, states and text trimming."
figma:
  variant_property: "variant"
  sources:
    -
      value: "fill"
      name: "Tag Fill"
      file_key: "WUc07ZBtjRvypXtsOlbVut"
      node_id: "4592-18607"
      last_verified: "2026-10-10"
    -
      value: "outline"
      name: "Tag Outline"
      file_key: "WUc07ZBtjRvypXtsOlbVut"
      node_id: "4820-20677"
      last_verified: "2026-10-10"
notes: "children and parents are inherited in full from the entry this component was split out of, as the split rule requires; narrowing either is a later judgement."
import:
  batch: 1
  ready: true
