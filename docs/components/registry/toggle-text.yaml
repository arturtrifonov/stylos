# Amended 2026-10-10: binary native switch API and verified Figma geometry.
# Hand-written 2026-08-30. Replaces part of toggle.yaml, whose id "Toggle"
# matches no component in Figma. See docs/components/registry/README.md,
# section "When a component is split".

id: "Toggle Text"
name: "Toggle Text"
family: "Toggle"
level: "element"
role: "input"
html: "<label><input type=\"checkbox\" role=\"switch\"> Label text</label>"
status: "ready"
version: "0.1.0"
summary: "A switch tied to wrapping copy in a column of fixed width, the track aligned to the first line."
purpose: "Some settings need a sentence: what the switch turns on, and what that costs. That text wraps at a width the layout decides, and the track has to stay where the reader's eye starts rather than float in the vertical middle of three lines. Toggle Label can do neither, because it hugs and centres."
use_when:
  - "The setting needs more than a phrase to be understood, or the rows must occupy a width the layout sets rather than a width the text sets."
do_not_use_when:
  -
    text: "The setting is a phrase on one line — a fixed width would leave a gap after short text."
    instead: "Toggle Label"
  -
    text: "The control has no visible text of its own because its context supplies the meaning."
    instead: "Toggle Input"
  -
    text: "The choice is made now and applied later, when the form is submitted."
    instead: "Checkbox Text"
parents:
  - "Accordion"
  - "Accordion Header"
  - "Table Cell Checkbox"
  - "Table Cell Heading Checkbox"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Toggle Input"
flow_behavior:
  - "fill"
  - "hug"
a11y:
  -
    status: "requires"
    note: "Interactive content inside the copy — a link to what the setting affects is the usual case — must not flip the switch, and nesting a link inside the label is an HTML validity problem in some structures. This is the most common bug in the pattern and the implementation has to handle it explicitly."
  -
    status: "warning"
    note: "The copy is the accessible name, so a screen reader reads the whole paragraph as the control's name with no pause. Where the copy runs past a sentence or two, give the control a short name and leave the full text as adjacent described-by content."
  -
    status: "requires"
    note: "A switch acts on the setting the moment it is flipped. Where the change is slow, costly or hard to reverse, the interface around it has to say so and offer the way back."
sizing_model:
  horizontal: "fill"
  vertical: "hug"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Width is the one dimension a consumer sets — directly, or by filling an auto-layout parent — and no width token is recorded because there is no width the system chooses. Height follows the wrapping line boxes and is never set by hand. The track is vertically centred on the first line however many lines appear, which is the whole reason this component is separate from Toggle Label, and the line height comes from the text family rather than the string family for the same reason."
  sizes:
    -
      size: "extra small"
      track: "size/s-2_000"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/text/0_750"
    -
      size: "small"
      track: "size/s-2_500"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/text/0_875"
    -
      size: "medium"
      track: "size/s-3_000"
      gap: "gap/g-0_750"
      font_size: "size/1_000"
      line_height: "line height/text/1_000"
    -
      size: "large"
      track: "size/s-3_500"
      gap: "gap/g-0_875"
      font_size: "size/1_250"
      line_height: "line height/text/1_250"
    -
      size: "extra large"
      track: "size/s-4_000"
      gap: "gap/g-1_000"
      font_size: "size/1_500"
      line_height: "line height/text/1_500"
api:
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "Drives the track, the text measure and the gap together. It does not set the width."
    values:
      -
        value: "extra small"
      -
        value: "small"
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native switch. Hover, pressing and keyboard focus come from the browser. Disabled inputs and disabled fieldsets prevent switching, focus and submission."
    values:
      -
        value: "default"
      -
        value: "disabled"
  -
    name: "is checked"
    kind: "variant"
    default: "false"
    description: "Binary on/off setting, bindable through bind:isChecked. Native activation updates it immediately; form reset restores the initial value and respects cancellation. Mixed is not part of the web API."
    values:
      -
        value: "false"
      -
        value: "true"
  -
    name: "label text"
    kind: "text"
    default: "Toggle"
    description: "Prose: sentence case, full sentences, terminal punctuation. Written to wrap — if it never wraps, Toggle Label is the right component. Because the switch acts at once, the copy is the last thing a person reads before the change happens, so it says what will happen rather than what the setting is called."
  -
    name: "id"
    kind: "string"
    description: "Native input id. Generated per instance when omitted; consumer-supplied ids must be unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "Native form field name. Only enabled, checked switches with a nonempty name submit."
  -
    name: "value"
    kind: "string"
    default: "on"
    description: "Value submitted when checked and enabled."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Optional form id for an input outside its form. Otherwise the enclosing form owns the input."
  -
    name: "accessible name"
    kind: "text"
    default: ""
    description: "Accessible name mapped to aria-label. Leave empty for the visible label to supply the name."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated ids of explanatory or error copy, mapped to aria-describedby."
  -
    name: "is required"
    kind: "boolean"
    default: false
    description: "Native validity requires this switch to be on. No inline error appearance is supplied."
  -
    name: "content"
    kind: "slot"
    description: "Optional phrasing content rendered as children instead of label text. Use text, emphasis and anchors; no nested labels or additional form controls. Clicking an anchor follows the link without switching the control."
limitations:
  - "Native required validity is supported; no inline error appearance is supplied. Associate consumer error copy through description ids."
  - "No supporting-text slot. One text role only, so the setting and its explanation share a paragraph."
  - "The track is always leading and always aligned to the first line. No property changes either."
  - "No tone."
figma_notes:
  - "Verified on 2026-10-10: five sizes and all binary state appearances. Web API exposes default and disabled; hover, active and focus are native. The owner selected false/true only for the web API: mixed remains a Figma drawing variant and is not implemented as a switch value. Form properties add no Figma variants."
  - "The ring's dimensions and offset are positioned by hand for every size and are deliberately not bound to variables. A browser draws focus around an element for free and it flows with the element; Figma has no equivalent. component-integrity-check exempts focus-ring geometry for this reason."
  - "is focused exists here as well as on the Toggle Input this component contains. Every other condition passes down — this component's state variant drives the nested input's — but focus is drawn as an appearance toggle rather than a variant, so it is set on both independently. This is how the Figma file is built and it is not a requirement on the component: an implementation propagates focus by ordinary means."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4703-26467"
  last_verified: "2026-10-10"
notes: "Native Toggle Text implementation. Historical parents are retained; legacy Label/Icon/Badge/Loader children are removed because they are not content children of this control. Motion uses duration/micro and easing/linear, with reduced-motion and forced-colors support."
import:
  batch: 1
  ready: true
