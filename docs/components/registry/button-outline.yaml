# Amended 2026-10-09: implement Outline/Ghost with the same native API and
# local-state Motion profile as Button Base; Figma controls remain drawing-only.
# Contract written 2026-09-03 from the live component set. The entry was created
# on 2026-08-29 by docs/specs/0004-registry-reconciliation.md §3.3, which carried
# its children and parents over from Button Base; it left button/ and lost its
# slash group on 2026-09-02. See docs/components/registry/README.md for the schema.

id: "Button Outline"
name: "Button Outline"
family: "Button"
level: "object"
role: "trigger"
html: "<button type=\"button\">"
status: "ready"
version: "0.1.0"
summary: "The bordered action button, for the action beside the main one."
purpose: "A surface usually has one action it is for and one or two that go with it — cancel beside save, back beside continue, export beside apply. Those need to be as easy to hit and as easy to read as the main action while being visibly not it, and the way this family draws that distinction is weight rather than size or position. This member keeps the box, the run and the label of its siblings and replaces the filled band with a pale surface and a border in its own tone, so it holds its shape and its edge on any background without claiming the eye first."
use_when:
  - "The action sits beside a filled one and should be equally reachable but not reached for first — cancel, back, export, duplicate."
  - "Several actions of equal standing sit together and none of them is the one the surface is for."
do_not_use_when:
  -
    text: "The action is what the surface exists for. Drawing the main action at secondary weight makes the reader look for it."
    instead: "Button Base"
  -
    text: "The action is a background option that should recede until it is looked for, and a visible box around it would clutter a dense row."
    instead: "Button Ghost"
  -
    text: "The control is a local action on the component it sits in — clear a field, remove a tag, dismiss a toast."
    instead: "Button Inner"
  -
    text: "The control is icon-only and stands on its own — a toolbar action, an action in a header."
    instead:
      - "Button Icon Base"
      - "Button Icon Outline"
      - "Button Icon Ghost"
  -
    text: "The control navigates rather than acts. A link drawn as a button is still a link, and drawing it this way breaks the middle click, the copy-address, and the back button."
    instead: "Link"
children:
  - "Badge"
  - "Avatar"
  - "Icon"
  - "Indicator Status"
  - "Indicator Special"
  - "Tag Fill"
  - "Tag Outline"
  - "Loader"
parents:
  - "Accordion"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Drawer"
  - "Side Panel Menu"
uses:
  - "Icon"
flow_behavior:
  - "hug"
a11y:
  -
    status: "requires"
    note: "The label is uppercased by a transform, not typed in capitals — the characters stay as they were written. An implementation has to do the same and change the case in CSS, because typing the label in capitals changes the accessible name as well as the appearance, and a screen reader may then spell it out letter by letter."
  -
    status: "requires"
    note: "The label has to say what the action does. This component supplies visual weight and nothing else; a button labelled OK inside a bordered box is still a button labelled OK."
sizing_model:
  horizontal: "hug"
  vertical: "fixed"
  adjustable:
    horizontal: true
    vertical: false
  intent: "Identical to Button Base, and deliberately so: the three treatments are interchangeable in a layout only if a row of them lines up without anyone arranging it, which means one height run, one padding run, one gap run and one type run across the family. The height is authored on the Object run and the width is whatever the label needs. The label neither wraps nor truncates, so a phrase too long for its column widens the button rather than being cut. The type run is a component-specific mapping rather than the recommended Object profile, one step below it at every size; this entry records that choice. The border is drawn inside the box, so turning it on costs no width and a bordered button and a filled one of the same size and label are the same size on screen. The radius does not move with size. Width is the consumer's to name where a layout calls for it — a named width is still fixed, not fill."
  sizes:
    -
      size: "extra small"
      box: "size/s-3_000"
      padding_inline: "gap/g-1_500"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
      icon: "size/s-2_000"
    -
      size: "small"
      box: "size/s-4_000"
      padding_inline: "gap/g-2_000"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
      icon: "size/s-2_500"
    -
      size: "medium"
      box: "size/s-5_000"
      padding_inline: "gap/g-2_500"
      gap: "gap/g-0_750"
      font_size: "size/1_125"
      line_height: "line height/string/1_125"
      icon: "size/s-3_000"
    -
      size: "large"
      box: "size/s-6_000"
      padding_inline: "gap/g-3_000"
      gap: "gap/g-0_875"
      font_size: "size/1_375"
      line_height: "line height/string/1_375"
      icon: "size/s-3_500"
    -
      size: "extra large"
      box: "size/s-7_000"
      padding_inline: "gap/g-3_500"
      gap: "gap/g-1_000"
      font_size: "size/1_625"
      line_height: "line height/string/1_625"
      icon: "size/s-4_000"
api:
  -
    name: "tone"
    kind: "variant"
    default: "primary"
    description: "Which meaning the action carries. Unlike the filled member, the tone here colours the label, the border and a pale surface rather than filling the box, so the tone is read from the writing rather than from the block. A tone is a colour role, not an outcome: a destructive action is danger because destroying is what it does, not because anything went wrong."
    values:
      -
        value: "base"
        note: "No meaning of its own — the neutral secondary action, and the most common one on a form. Its border is the shared neutral rather than a tone of its own, so its edge is quieter than the other four."
      -
        value: "primary"
        note: "The default. For a secondary action that still belongs to the brand path — back, previous, edit."
      -
        value: "warning"
        note: "The action has a consequence the reader should weigh first, and can undo afterwards."
      -
        value: "danger"
        note: "The action destroys something, or cannot be undone. Not an error — the button is working exactly as intended."
      -
        value: "success"
        note: "Rare on a trigger. For a button that completes something rather than starting it."
  -
    name: "size"
    kind: "variant"
    default: "medium"
    description: "The band height, and with it the label measure, the padding, the gap and the icon slots. Sized to the density of the surface the button sits on rather than to the importance of the action — importance is what tone is for."
    values:
      -
        value: "extra small"
        note: "For a dense row — a table, a toolbar. The 24-unit height meets the minimum target height in WCAG 2.2 SC 2.5.8 (https://www.w3.org/TR/WCAG22/#target-size-minimum); the consumer keeps the complete target at least 24 by 24."
      -
        value: "small"
      -
        value: "medium"
        note: "The default, and what most surfaces want."
      -
        value: "large"
      -
        value: "extra large"
        note: "For a button that is the only thing on its surface — an empty state, a landing section."
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "Availability of the native control. The browser derives hover, pressing and keyboard focus; disabled prevents activation and focus. A disabled fieldset has the same effect."
    values:
      -
        value: "default"
      -
        value: "disabled"
        note: "All tones use the shared disabled label and neutral border on their subtle disabled surface, without a shadow."
  -
    name: "type"
    kind: "variant"
    default: "button"
    description: "Native form behaviour. button performs only the supplied action; submit submits its associated form; reset restores that form's default values."
    values:
      -
        value: "button"
      -
        value: "submit"
      -
        value: "reset"
  -
    name: "has leading icon"
    kind: "boolean"
    default: false
    description: "Shows a mark before the label. Off by default: the label names the action, and a mark in front is for the cases where the action has a symbol the reader already knows."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    description: "The mark shown before the label. It qualifies the action rather than naming it, so a button whose meaning rests on the mark alone is a button with the wrong label."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: false
    description: "Shows a mark after the label. This is the side for a mark that points outward — that the action opens something, continues somewhere, or reveals more."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    description: "The mark shown after the label, on the same terms as the leading one."
  -
    name: "label text"
    kind: "text"
    default: "Button"
    description: "What the action does, as a verb or a verb phrase, in two or three words. The label neither wraps nor truncates, so a longer phrase widens the button until it breaks the layout around it — which is the signal to shorten the phrase, not to constrain the button."
  -
    name: "id"
    kind: "string"
    description: "Native button id; the consumer keeps it unique."
  -
    name: "name"
    kind: "string"
    default: ""
    description: "The submitter name included when this button submits its form."
  -
    name: "value"
    kind: "string"
    default: ""
    description: "The submitter value paired with name."
  -
    name: "form"
    kind: "string"
    default: ""
    description: "Id of an associated form, including a form outside the button's ancestors."
  -
    name: "description ids"
    kind: "string"
    default: ""
    description: "Space-separated supporting element ids for aria-describedby."
  -
    name: "onclick"
    kind: "event"
    description: "Native click callback for pointer and keyboard activation. It receives a MouseEvent; preventDefault cancels the native submit/reset action. Disabled controls do not activate."
limitations:
  - "Disabled controls do not activate or receive keyboard focus; this also applies inside a disabled fieldset."
  - "The base tone's border is the shared neutral at 2.14:1 against a white page, where the other four tones sit between 7.1:1 and 7.9:1. The label carries the contrast in every tone — between 9.8:1 and 12.9:1 for base — and the border is a boundary rather than information, so its suitability is assessed against FND-ACCESSIBILITY-01 in the consuming interface."
  - "The label cannot wrap. There is no two-line button and no truncating one; the component is one line by construction."
  - "The focus ring does not scale with size. A 24-tall button and a 56-tall one take the same two-pixel ring at the same offset — deliberate, because the ring belongs to the keyboard rather than to the size run."
figma_notes:
  - "Verified on 2026-10-09 on Button page 0:1, component set 4829:7643. All 100 size/tone/state variants use surface/subtle tokens with the tone’s text and border roles; the base border uses border/default and disabled uses border/secondary. Figma hover/active states and is focused are drawing controls; the web API exposes default/disabled and derives interaction from the browser. Native type, form identity and onclick are web integration properties, without Figma controls."
  - "The icon containers use the local icon container width collection: widths 14/18/22/25/29 around 16/20/24/28/32-unit icons. Leading marks overhang outward to the left by 2/2/2/3/3; trailing marks overhang to the right. The implementation preserves that optical correction using existing gap tokens. Figma uses Placeholder for unassigned icon swaps; the public icon inputs have no default and render nothing until assigned, as in the Icon contract."
  - "The shared Focus instance has a 2-unit outward offset, an outside stroke bound to width/thick, radius large and border/primary. Focus is absent from disabled variants."
  - "The api block is ordered by the registry contract; Figma's property-key order does not establish panel order."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4829-7643"
  last_verified: "2026-10-09"
notes: "Assessed against FND-ACCESSIBILITY-01. Contrast measurements describe the recorded light palette; a consuming interface or replacement theme requires its own assessment. Surface-colour changes on hover, press and return use duration/micro with easing/linear under FND-MOTION-06: a local control state needs a direct, continuous response. CSS transitions reverse from the current colour when interrupted, with no movement or visual delay. Focus feedback and native availability remain immediate. Reduced motion replaces the colour transition with an immediate change under FND-MOTION-13."
