# Contract written 2026-09-04 from the live component set. The children list and
# the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.
#
# 2026-09-04: renamed from "Side Panel". That entry always described this
# component; the panel of menus and tools that the name suggests is a different,
# later thing, and the registry keeps it as "Side Panel Menu".

id: "Drawer"
name: "Drawer"
level: "layout"
role: "container"
html: "<dialog>"
status: "draft"
version: "0.1"
summary: "A full-height panel that slides in from one edge and holds a task beside the page."
purpose: "Some work is too big for a dialog and too small for a page: editing a record while its list stays visible, filtering a table while the table is still there, reading a detail without losing your place in what led to it. A drawer is the frame for that. It takes one edge of the screen and the full height of it, keeps the heading, the content and the answers in the same three bands the dialog uses, and leaves the page behind it in view. It is squared off against the edge it comes from and carries a single border on the side that faces the page — the only line in it, and the one that says where the panel stops and the page resumes."
use_when:
  - "A task needs more room than a dialog and would be worse as a page, and the context it came from is worth keeping on screen."
  - "The work is long enough to scroll — a form of many fields, a record, a document — which a dialog cannot do."
do_not_use_when:
  -
    text: "The person has to answer before anything else can continue. A drawer keeps the page in view and reads as optional; a decision that blocks the flow should look like it blocks the flow."
    instead: "Modal"
  -
    text: "The panel is the application's own chrome — navigation, the permanent tools down one side. That is assembled once per product and stays there; this arrives, is used, and leaves."
    instead: "Side Panel Menu"
  -
    text: "The content is a short reaction to something the person just did, needing no answer."
    instead:
      - "Toast"
      - "Alert"
  -
    text: "It is a small amount of content anchored to one control rather than to the screen edge."
    instead:
      - "Popover"
      - "Tooltip"
