# Contract written 2026-08-28 from the live component set. The children/parents
# lists and the import block are carried over from the CSV import of 2026-08-20.
# See docs/components/registry/README.md for the schema.

id: "Link"
name: "Link"
level: "element"
role: "trigger"
status: "draft"
version: "0.1"
summary: "An underlined text control that takes the person somewhere rather than acting on what is in front of them."
purpose: "Navigation inside a dense interface has to happen without spending the room a button takes. Link is the control for that: a label with an underline and nothing else — no fill, no border, no reserved footprint — sized from the same run as the text around it so it can sit in a table cell, a panel header or a line of prose without disturbing it. Its two tones are the whole of its emphasis, because a link that competes with the primary action of a view has stopped being a link."
use_when:
  - "The control takes the person somewhere — another view, an external destination, a record — rather than changing something in place."
  - "The control has to occupy no more room than its own text, because the space belongs to the content it sits in."
do_not_use_when:
  -
    text: "The control performs an action rather than going somewhere — submitting, saving, deleting, applying. A control whose appearance promises navigation and then acts is the one mistake a link can make that a person cannot recover from."
    instead: "Button Basic"
  -
    text: "The action belongs to the component around it — clearing a field, removing a tag, dismissing a message — and is named by an icon rather than by words."
    instead: "Button Inner"
  -
    text: "The destinations are a set of peers the person moves between while staying in place, with one of them current. That is a navigation structure with a selected position, not a row of links."
    instead: "Tabs Horizontal"
children:
  - "Icon"
  - "Badge"
  - "Indicator Status"
  - "Indicator Special"
  - "Loader"
parents:
  - "Accordion / Container"
  - "Input Text"
  - "Input Date"
  - "Input Search"
  - "Input Number"
  - "Input Color"
  - "Input Datetime"
  - "Input Email"
  - "Input Password"
  - "Input Time"
  - "Input Telephone"
  - "Input URL"
  - "Multiselect"
  - "Select"
  - "Select Cascade"
  - "Text Area"
  - "Table / TD Link"
  - "Alert"
  - "Toast"
  - "Bottom Sheet"
  - "Flex Layout"
  - "Header"
  - "Hero"
  - "Modal"
  - "Side Panel"
  - "Side Panel Menu"
  - "Breadcrumbs"
uses:
  - "Icon"
flow_behavior:
  - "hug"
a11y:
  -
    status: "open"
    note: "Focus is not modelled. `state` carries default, hover, active and disabled, there is no `is focused` boolean, and no focus ring exists in any variant, so SC 2.4.7 has nothing to satisfy it. Focus coexists with hover and with active and therefore cannot be a value of a single-select property; Stylos has not decided what shape it takes instead, and this component waits on that decision rather than inventing one. The gap is worse here than on a control with a filled surface, because a keyboard user reaching a link gets no change of any kind."
  -
    status: "requires"
    note: "The label is the accessible name and it is the only thing that says where the link goes — SC 2.4.4. A page of links all reading the same words is a page where the name identifies nothing, and no property of this component prevents that. The consumer writes a label that names the destination, or supplies the context in the markup around it."
  -
    status: "requires"
    note: "Hover and active are carried entirely by the surface behind the label: the text keeps its colour, its weight and its underline in all three. Any implementation that drops that surface leaves the two states indistinguishable from default."
sizing_model:
  horizontal: "hug"
  vertical: "hug"
  adjustable: false
  intent: "The component is its text. Both axes hug, so a link takes exactly the room its label needs and nothing reserves space for it — that is the whole reason to reach for one instead of a button. What the run authors is the box: the Element run from 16 to 32, with the label measure taken from the Element profile in typography.md and no component-specific override. The vertical padding on the text container is not authored; it is half the difference between the box and the line box, which is why it stalls at the same value for the top three sizes. The icon slots track the box exactly, so a link is one row however it is composed. The hover and active surface is outside this model entirely — see limitations."
  sizes:
    -
      size: "extra small"
      box: "size/s-2_000"
      icon: "size/s-2_000"
      gap: "gap/g-0_500"
      font_size: "size/0_750"
      line_height: "line height/string/0_750"
    -
      size: "small"
      box: "size/s-2_500"
      icon: "size/s-2_500"
      gap: "gap/g-0_625"
      font_size: "size/0_875"
      line_height: "line height/string/0_875"
    -
      size: "medium"
      box: "size/s-3_000"
      icon: "size/s-3_000"
      gap: "gap/g-0_750"
      font_size: "size/1_000"
      line_height: "line height/string/1_000"
    -
      size: "large"
      box: "size/s-3_500"
      icon: "size/s-3_500"
      gap: "gap/g-0_875"
      font_size: "size/1_250"
      line_height: "line height/string/1_250"
    -
      size: "extra large"
      box: "size/s-4_000"
      icon: "size/s-4_000"
      gap: "gap/g-1_000"
      font_size: "size/1_500"
      line_height: "line height/string/1_500"
variants:
  count: 40
  complete_cross_product: true
api:
  -
    name: "tone"
    kind: "variant"
    default: "primary"
    description: "How much of the reader's attention the link is entitled to. It changes the label colour and nothing else; the underline, the weight and the interaction surface are the same either way."
    values:
      -
        value: "primary"
        note: "The default, and the one to reach for when the link is a destination the person is meant to notice."
      -
        value: "base"
        note: "The label takes the ordinary text colour and only the underline marks it as a link. This is for links that must not draw attention — a secondary destination in a dense view, a row of them where any colour would be noise. It is deliberately not the tone for a link inside running prose."
  -
    name: "size"
    kind: "variant"
    default: "extra small"
    description: "The box, and with it the label measure, the gap and the icon slots. The Element run and the Element type profile, with no component-specific mapping — a link is sized to match the text it sits beside, so the value is usually chosen by the surrounding content rather than by the link."
    values:
      -
        value: "extra small"
        rationale: "Dense desktop tables and toolbars set their own text at this measure, and a link that stepped up a size to satisfy a target rule would stop matching the row it belongs to. The value ships because the alternative is a link that cannot sit in the interfaces this system is for."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "The box is 16 tall, under the 24 by 24 minimum. Where the link sits in a sentence or in a line of non-target text the inline exception applies and the value is conformant. Standing alone it is not covered by that exception and nothing in the component supplies the missing area."
      -
        value: "small"
        rationale: "Same reasoning as extra small, one step up: the measure is chosen to match surrounding text, and the shortfall is smaller."
        a11y:
          status: "warning"
          criterion: "WCAG 2.2 SC 2.5.8"
          note: "The box is 20 tall, under the 24 by 24 minimum. The inline exception covers it in running text and does not cover it standing alone."
      -
        value: "medium"
      -
        value: "large"
      -
        value: "extra large"
  -
    name: "state"
    kind: "variant"
    default: "default"
    description: "The interaction condition. Hover and active add a surface behind the label and change nothing else; disabled changes the label colour and adds no surface. Focus is absent — see the component-level finding."
    values:
      -
        value: "default"
        note: "No surface. The link is a label and an underline."
      -
        value: "hover"
        note: "A rounded surface appears behind the label, wider and taller than the box and drawn outside it."
      -
        value: "active"
        note: "The same surface, one step darker. The label is unchanged from hover."
      -
        value: "disabled"
        note: "The label drops to the disabled text role and both tones render identically; no surface appears. The link keeps its place in the line and stops being a destination."
  -
    name: "has leading icon"
    kind: "boolean"
    default: "false"
    description: "Shows an icon before the label. Off by default: a link is its words, and a mark in front of them is for the cases where the destination has a recognisable symbol — an external target, a file type, a service."
    controls:
      - "leading icon"
  -
    name: "leading icon"
    kind: "instance"
    default: "Placeholder"
    description: "The mark shown before the label. It is decoration for the label rather than a name of its own, so it must not be the only thing saying where the link goes."
  -
    name: "has trailing icon"
    kind: "boolean"
    default: "false"
    description: "Shows an icon after the label. This is the usual side for a mark that qualifies the destination rather than identifying it — that the link leaves the application, opens in a new place, or expands."
    controls:
      - "trailing icon"
  -
    name: "trailing icon"
    kind: "instance"
    default: "Placeholder"
    description: "The mark shown after the label, on the same terms as the leading one."
  -
    name: "label text"
    kind: "text"
    default: "Link"
    description: "The words of the link, and its accessible name. They have to name the destination on their own, because nothing else in the component does."
limitations:
  - "The hover and active surface is drawn outside the component's bounds and its insets are raw numbers with no variable binding. That is deliberate: the spacing scale governs room inside an element, and a surface that exists only under the pointer is not that. The cost is that nothing in the system moves it, and no parent layout reserves room for it — links on adjacent lines can have overlapping surfaces at a tight line height."
  - "Hover and active are the surface and nothing else. The label keeps its colour, its weight and its underline through both, so the component has no second channel for either state."
  - "No visited state. The one distinction a browser gives a link for free is not modelled, and there is no property to carry it."
  - "The label is a single line. The text layer resizes on both axes and the box height is derived from one line box, so a link that wraps is outside what this component describes."
figma:
  file_key: "WUc07ZBtjRvypXtsOlbVut"
  node_id: "4333-27795"
  last_verified: "2026-08-28"
notes: "The api order follows naming.md §8 and §10 and is authored, not transcribed: componentPropertyDefinitions returns a key order that does not match the properties panel, so the panel order could not be verified from here — it reports the two controlling booleans before either instance slot, which would split both controlled groups. Both icon slots are hidden by their booleans in every one of the 40 variants, so only their width bindings could be read; their sizing behaviour when shown is unverified. The label reports the Georama Medium instance while its weight is bound to weight/semibold, which is 450 — the number is what the system specifies. used_by is absent; it needs a whole-file survey that has not been run."
import:
  batch: 1
  ready: true
