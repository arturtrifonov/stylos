# Authored file — read by `npm run ui:generate` (tools/build-ui-icons.mjs).
# The single instance the preset is drawn at, and the marks registered by
# default. Names are Material Symbols ligature names, which are also the
# filenames upstream uses and the values `<Icon name>` takes.
#
# The build draws every name the pinned font package declares, so any mark is
# available: a consumer imports it from @stylos/ui/icons/<name> and registers
# it. `registered` is the subset that resolves without that step — the marks
# the components and the Figma library already use. A registered name that does
# not resolve to exactly one glyph fails the build rather than shipping a blank.
#
# The registered marks began as the Figma library's system components
# (node 2839:2469), read 2026-09-07 and matched against the drawings rather
# than against the names — see SPEC 0012 §2.
source:
  family: "Material Symbols Rounded"
  package: "material-symbols"
  file: "material-symbols-rounded.woff2"
  licence: "Apache-2.0"
instance:
  wght: 500
  FILL: 1
  GRAD: 0
  opsz: 20
registered:
  - "add"
  - "arrow_back"
  - "arrow_downward"
  - "arrow_drop_down"
  - "arrow_drop_up"
  - "arrow_forward"
  - "arrow_left"
  - "arrow_right"
  - "arrow_upward"
  - "attach_file"
  - "calendar_month"
  - "check"
  - "check_circle"
  - "chevron_left"
  - "chevron_right"
  - "close"
  - "content_copy"
  - "edit"
  - "error"
  - "expand_less"
  - "expand_more"
  - "filter_list"
  - "home"
  - "keyboard_arrow_down"
  - "keyboard_arrow_up"
  - "more_horiz"
  - "person"
  - "remove"
  - "schedule"
  - "search"
  - "warning"
