# AUTHORED FILE. Maps Figma's vocabulary onto Stylos's. Nothing here is
# guessed: an unmapped collection or mode is a build failure, not a default.
# See docs/specs/0001-token-pipeline.md §5.1.
#
# This is also the whitelist for `npm run tokens:import` — a collection that
# is not declared here cannot be imported.

source:
  file: "Stylos / Styles"
  key: "2OJYDoTE9EAdQKaJAJK9Kt"
  url: "https://www.figma.com/design/2OJYDoTE9EAdQKaJAJK9Kt/Stylos--Styles"

# The library's version marker. Not a token, and never written to tokens/: it
# is a STRING variable in Figma naming the release the published library
# belongs to, and `npm run tokens:import` records it in figma/library.yaml
# instead. It is declared here because this file is the whitelist — a
# collection nobody declared cannot be imported, and that has to hold for this
# one too. If either is built with another name the import says so rather than
# guessing. See docs/specs/0006-versioning-and-release-0-1-0.md §6.
meta:
  from: "meta"
  mode: "meta"
  variable: "version"

# Semantic collection -> the primitive collection it aliases into. Corrected
# 2026-09-05: it said `space: "space-scale"`, and neither name has existed
# since the collection became `dimension`. Nothing read the field, which is why
# it could be wrong for that long; docs/specs/0007-tokens-to-css.md gives it its
# first reader.
draws_from:
  color: "palette"
  dimension: "dimension-scale"

# Every collection and every mode in Figma is lowercase, and a mode is named
# after the collection it belongs to — `radius` has one mode called "radius",
# `color` has "color.light" and "color.dark". Figma's defaults ("Mode 1",
# "Value") are gone as of 2026-09-05, which is what makes an export
# self-identifying: the mode inside the file now says which collection it came
# from, so a file handed to the wrong --collection is caught by the mode check
# rather than by the variable-id check behind it.
collections:
  # Two Figma collections, one canonical palette with two modes. They are
  # separate in Figma so a semantic role can bind to a *different step* per
  # mode, not merely to a different value of the same step.
  palette:
    layer: "primitive"
    modes:
      light:
        from: "palette.light"
        mode: "palette.light"
      dark:
        from: "palette.dark"
        mode: "palette.dark"
  color:
    layer: "semantic"
    modes:
      light:
        from: "color"
        mode: "color.light"
      dark:
        from: "color"
        mode: "color.dark"
  dimension-scale:
    layer: "primitive"
    modes:
      default:
        from: "dimension.scale"
        mode: "dimension.scale"
  dimension:
    layer: "semantic"
    modes:
      default:
        from: "dimension"
        mode: "dimension"
  font:
    layer: "primitive"
    modes:
      default:
        from: "font"
        mode: "font"
  radius:
    layer: "primitive"
    modes:
      default:
        from: "radius"
        mode: "radius"
  effect:
    layer: "primitive"
    modes:
      default:
        from: "effect"
        mode: "effect"
  border:
    layer: "primitive"
    modes:
      default:
        from: "border"
        mode: "border"

# Roles allowed to reference a different token per mode. A role that does so
# without being listed here fails the build; so does a role listed here that
# references the same token in every mode.
#
# Shadow colours are not here: Figma cannot bind a variable and change its
# opacity, so they arrive as literals and are stored exactly as given.
mode_dependent:
  # Anchored to the ends of the ramp, so each mode takes the opposite end.
  - "color/text/static-light"
  - "color/text/static-dark"
  - "color/background/base"
  # Perceptual equivalence, not inversion: a bold disabled surface has to read
  # as a filled surface, and slate/100 is two steps off white in light but only
  # two steps off near-black in dark, where it would sink into the background.
  # Declared 2026-09-05. `surface/subtle/*/disabled` is slate/25 in both modes
  # and is deliberately not here — a subtle surface sits on the background, so
  # the same step works in either.
  - "color/surface/bold/base/disabled"
  - "color/surface/bold/primary/disabled"
  - "color/surface/bold/success/disabled"
  - "color/surface/bold/warning/disabled"
  - "color/surface/bold/danger/disabled"
