<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stylos — state checks</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: var(--stylos-color-background-base, #fff); color: var(--stylos-color-text-base, #1a2a3a); }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #status { font-size: 13px; margin: 0 0 12px; }
      .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
      .sheet > section { min-width: 0; border: 1px dashed currentColor; padding: 8px; }
      .sheet h2 { font: 11px/1.3 ui-monospace, monospace; margin: 0 0 6px; }
      #stage { width: 100%; }
    </style>
  </head>
  <body>
    <h1>State checks</h1>
    <p id="status">Loading…</p>
    <div id="stage"></div>
    <script type="module" src="/states.mjs"></script>
  </body>
</html>
