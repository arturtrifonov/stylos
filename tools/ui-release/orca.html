<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stylos — Orca walkthrough</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a2a3a; background: #fff; }
      main { max-width: 860px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .build { font-size: 14px; color: #445668; margin: 0 0 12px; }
      .warn { background: #fde8e8; border: 2px solid #c81e1e; color: #771d1d; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
      .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .bar select { font: inherit; max-width: 100%; }
      progress { width: 160px; }
      .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .card h2 { font-size: 20px; margin: 0 0 4px; }
      .card h3 { font-size: 15px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: #445668; }
      .card ol, .card ul { margin: 4px 0; padding-inline-start: 24px; }
      .card li { margin: 4px 0; }
      kbd { display: inline-block; min-width: 1.4em; padding: 0 6px; border: 1px solid #94a3b8; border-bottom-width: 2px; border-radius: 4px; background: #f1f5f9; font: 14px/1.5 ui-monospace, monospace; text-align: center; }
      .known { background: #fff7e0; border-inline-start: 4px solid #d97706; padding: 8px 12px; margin-top: 12px; }
      .note { color: #445668; font-size: 14px; margin-top: 12px; }
      .sample-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .sample-title { font-size: 16px; margin: 0 0 8px; }
      #sample { border: 2px dashed #94a3b8; border-radius: 8px; padding: 16px; min-height: 48px; }
      .result label { display: inline-flex; gap: 6px; align-items: center; margin-inline-end: 16px; }
      .result textarea { width: 100%; box-sizing: border-box; min-height: 72px; font: inherit; margin-top: 8px; }
      .nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 12px; }
      button { font: inherit; padding: 6px 14px; }
      .primary { background: #1a2a3a; color: #fff; border: 0; border-radius: 4px; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; text-align: start; vertical-align: top; }
      .s-fail { color: #c81e1e; font-weight: 600; } .s-pass { color: #166534; } .s-skip { color: #92400e; } .s-none { color: #64748b; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/orca.mjs"></script>
  </body>
</html>
