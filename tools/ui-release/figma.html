<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stylos — Figma comparison</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1a2a3a; background: #fff; }
      .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      nav { border-inline-end: 1px solid #cbd5e1; padding: 12px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
      nav a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; color: inherit; text-decoration: none; }
      nav a[aria-current="page"] { background: #e2e8f0; font-weight: 600; }
      .count { font-size: 12px; color: #64748b; } .count.bad { color: #c81e1e; font-weight: 600; }
      main { padding: 16px 20px; min-width: 0; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .meta { font-size: 13px; color: #445668; margin: 0 0 12px; }
      .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .panel { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; min-width: 0; }
      .panel h2 { font-size: 14px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: #445668; }
      .figma img { max-width: 100%; height: auto; image-rendering: auto; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
      .cell { border: 1px dashed #cbd5e1; padding: 6px; min-width: 0; max-width: 100%; }
      .cell.off { border-color: #c81e1e; border-style: solid; }
      .cell > .name { font: 11px/1.3 ui-monospace, monospace; color: #64748b; margin-bottom: 4px; }
      .render { background: var(--stylos-color-background-base, #fff); padding: 4px; }
      .results { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 16px; }
      .results th, .results td { border-bottom: 1px solid #e2e8f0; padding: 4px 6px; text-align: start; vertical-align: top; }
      .results td.num { font-variant-numeric: tabular-nums; } .results .off td { background: #fde8e8; }
      .note { color: #92400e; }
      .frozen { position: relative; } .frozen > * { position: static !important; inset: auto !important; transform: none !important; margin: 0 !important; }
    </style>
  </head>
  <body>
    <div class="layout"><nav id="nav" aria-label="Компоненты"></nav><main id="app"></main></div>
    <script type="module" src="/figma.mjs"></script>
  </body>
</html>
