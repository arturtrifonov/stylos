services:
  stylos-colors:
    build: .
    image: stylos-colors:local
    restart: unless-stopped
    networks: [web]
    depends_on:
      colors-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/stylos.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  colors-api:
    build:
      context: .
      dockerfile: Server.Dockerfile
    image: stylos-colors-api:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks: [web]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  web:
    external: true
